fragment IssueDetails on Issue {
  number
  title
  url
  state
  stateReason
  updatedAt
}

fragment PullRequestDetails on PullRequest {
  number
  title
  url
  state
  isDraft
  merged
  reviewDecision
  mergeable
  mergeStateStatus
  headRefName
  baseRefName
  additions
  deletions
  changedFiles
  updatedAt
  commits(last: 1) {
    nodes {
      commit {
        oid
        statusCheckRollup {
          state
        }
      }
    }
  }
}

fragment ReviewDetails on PullRequest {
  reviewThreads(first: 100) {
    nodes {
      isResolved
      isOutdated
      comments(last: 1) {
        nodes {
          url
          author {
            login
          }
        }
      }
    }
  }
}
