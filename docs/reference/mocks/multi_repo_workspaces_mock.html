<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mock — Multi-Repo Folder Workspaces (Orca sidebar)</title>
<style>
  /* Tokens copied from src/renderer/src/assets/main.css (.dark) */
  :root {
    --background: #0a0a0a;
    --foreground: #fafafa;
    --card: #171717;
    --muted: #262626;
    --muted-foreground: #a1a1a1;
    --accent: #404040;
    --destructive: #ff6568;
    --border: rgb(255 255 255 / 0.07);
    --ring: #737373;
    --worktree-sidebar: #2a2a2a;
    --worktree-sidebar-foreground: #fafafa;
    --worktree-sidebar-accent: #353535;
    --worktree-sidebar-border: rgb(255 255 255 / 0.1);
    --worktree-sidebar-ring: #737373;
    --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-sans);
    background: var(--background);
    color: var(--foreground);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  svg { display: block; }
  button { font-family: inherit; background: none; border: none; color: inherit; cursor: pointer; }

  #app { display: flex; flex-direction: column; height: 100vh; }

  /* Window chrome */
  #titlebar {
    height: 38px; flex-shrink: 0;
    display: flex; align-items: center;
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 0 12px; position: relative;
  }
  .traffic { display: flex; gap: 8px; }
  .traffic span { width: 12px; height: 12px; border-radius: 50%; }
  .traffic .r { background: #ff5f57; } .traffic .y { background: #febc2e; } .traffic .g { background: #28c840; }
  #titlebar .tb-title {
    position: absolute; left: 0; right: 0; text-align: center;
    font-size: 12px; color: var(--muted-foreground); pointer-events: none;
  }

  #content { display: flex; flex: 1; min-height: 0; }

  /* ── Sidebar ───────────────────────────────────────── */
  #sidebar {
    width: 280px; flex-shrink: 0; display: flex; flex-direction: column;
    background: var(--worktree-sidebar); color: var(--worktree-sidebar-foreground);
    border-right: 1px solid var(--border); min-height: 0;
  }
  .sidebar-header {
    margin-top: 8px; height: 32px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 8px; gap: 8px;
  }
  .sidebar-header .sh-title {
    padding-left: 8px; font-size: 12px; font-weight: 600;
    color: color-mix(in srgb, var(--muted-foreground) 80%, transparent);
    user-select: none;
  }
  .sidebar-header .sh-actions { display: flex; align-items: center; gap: 6px; }
  .icon-btn {
    width: 24px; height: 24px; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted-foreground);
  }
  .icon-btn:hover { background: color-mix(in srgb, var(--accent) 70%, transparent); color: var(--foreground); }

  #sidebar-list { flex: 1; overflow-y: auto; padding: 2px 4px 16px 0; min-height: 0; }
  #sidebar-list::-webkit-scrollbar { width: 8px; }
  #sidebar-list::-webkit-scrollbar-thumb {
    border-radius: 4px;
    background: color-mix(in srgb, var(--muted-foreground) 28%, transparent);
  }
  .group-spacer { height: 4px; }

  /* Group / repo header rows (matches WorktreeList header: h-7, gap-1.5, 13px semibold) */
  .group-header {
    height: 28px; width: 100%;
    display: flex; align-items: center; gap: 6px;
    padding-right: 4px; cursor: pointer; user-select: none;
    border-radius: 6px;
  }
  .group-header .gh-icon {
    width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted-foreground);
  }
  .group-header .gh-label-wrap { min-width: 0; flex: 1; display: flex; align-items: center; gap: 6px; }
  .group-header .gh-label {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 13px; font-weight: 600; line-height: 1;
  }
  .count-badge {
    height: 16px; min-width: 16px; padding: 0 6px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 9999px; border: 1px solid var(--worktree-sidebar-border);
    background: var(--worktree-sidebar-accent);
    font-size: 9px; font-weight: 500; line-height: 1;
    color: color-mix(in srgb, var(--muted-foreground) 90%, transparent);
  }
  .gh-chevron {
    width: 16px; height: 16px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    color: color-mix(in srgb, var(--muted-foreground) 60%, transparent);
    opacity: 0; transition: opacity .15s;
  }
  .gh-chevron svg { transition: transform .15s; }
  .group-header.collapsed .gh-chevron svg { transform: rotate(-90deg); }
  .group-header:hover .gh-chevron { opacity: 1; }
  .gh-action {
    width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted-foreground);
    opacity: 0; transition: opacity .15s, background-color .15s;
  }
  .group-header:hover .gh-action, .gh-action[data-on="true"] { opacity: 1; }
  .gh-action:hover { background: color-mix(in srgb, var(--accent) 70%, transparent); color: var(--foreground); }
  .gh-action[data-on="true"] { background: color-mix(in srgb, var(--accent) 60%, transparent); color: var(--foreground); }

  /* Selectable repo / scope rows */
  .repo-row { cursor: pointer; }
  .repo-row:hover { background: color-mix(in srgb, var(--worktree-sidebar-accent) 40%, transparent); }
  .repo-row.selected {
    background: rgb(255 255 255 / 0.10);
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.03);
  }
  .repo-row .gh-label { font-weight: 500; font-size: 12.5px; }
  .scope-row .gh-label { color: var(--muted-foreground); }
  .path-label {
    flex-shrink: 0; font-size: 10.5px; line-height: 1;
    color: color-mix(in srgb, var(--muted-foreground) 75%, transparent);
    padding-right: 2px;
  }

  /* Disconnected folder workspace */
  .group-header.disconnected .gh-label { color: var(--muted-foreground); }
  .badge {
    height: 16px; padding: 0 6px; flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 4px;
    border-radius: 4px; font-size: 10px; font-weight: 500; line-height: 1;
  }
  .badge.disconnected-badge {
    color: var(--destructive);
    border: 1px solid color-mix(in srgb, var(--destructive) 30%, transparent);
    background: color-mix(in srgb, var(--destructive) 6%, transparent);
  }
  .disconnected-note {
    display: flex; align-items: center; gap: 6px;
    margin: 2px 6px 6px 0; padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid color-mix(in srgb, var(--destructive) 18%, transparent);
    background: color-mix(in srgb, var(--destructive) 4%, transparent);
    font-size: 11px; color: var(--muted-foreground);
  }
  .disconnected-note .warn { color: color-mix(in srgb, var(--destructive) 75%, transparent); flex-shrink: 0; }
  .disconnected-note .dn-text { min-width: 0; flex: 1; line-height: 1.35; }
  .disconnected-note .dn-path { font-family: var(--font-mono); font-size: 10px; }
  .locate-btn {
    flex-shrink: 0; height: 20px; padding: 0 8px; border-radius: 6px;
    border: 1px solid var(--worktree-sidebar-border);
    background: color-mix(in srgb, var(--worktree-sidebar-accent) 45%, transparent);
    font-size: 11px; color: var(--foreground); white-space: nowrap;
  }
  .locate-btn:hover { background: var(--worktree-sidebar-accent); }
  /* ── Worktree cards (matches WorktreeCard: rounded-lg, pl-0 pr-1.5 pt-1.5 pb-2) ── */
  .card {
    position: relative; margin-left: 4px; width: calc(100% - 4px);
    display: flex; align-items: flex-start; gap: 2px;
    padding: 6px 6px 8px 0; border-radius: 8px;
    border: 1px solid transparent; cursor: pointer; user-select: none;
    transition: background-color .2s, border-color .2s;
  }
  .card:hover:not(.active) { background: color-mix(in srgb, var(--worktree-sidebar-accent) 40%, transparent); }
  .card.active {
    background: rgb(255 255 255 / 0.10);
    border-color: color-mix(in srgb, var(--worktree-sidebar-border) 40%, transparent);
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.03);
  }
  .status-slot {
    width: 12px; height: 12px; flex-shrink: 0; margin-top: 2px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.working {
    background: transparent;
    border: 2px solid #eab308; border-top-color: transparent;
    animation: spin 1s linear infinite;
  }
  .dot.done, .dot.active-status { background: #10b981; }
  .dot.permission { background: #f59e0b; }
  .dot.inactive { background: rgb(115 115 115 / 0.4); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .card-content { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
  .card-title { font-size: 12px; line-height: 1.25; font-weight: 400; }
  .card-meta {
    display: flex; align-items: center; gap: 6px; min-width: 0;
    font-size: 11px; line-height: 1; color: var(--muted-foreground);
  }
  .card-meta .branch { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge.repos-badge {
    color: var(--muted-foreground);
    border: 1px solid color-mix(in srgb, var(--border) 50%, transparent);
    background: color-mix(in srgb, var(--accent) 80%, transparent);
  }
  .badge.changed-badge {
    color: #fbbf24;
    border: 1px solid rgb(251 191 36 / 0.3);
    background: rgb(251 191 36 / 0.05);
  }
  .badge.primary-badge {
    color: color-mix(in srgb, var(--foreground) 70%, transparent);
    border: 1px solid color-mix(in srgb, var(--foreground) 20%, transparent);
    background: color-mix(in srgb, var(--foreground) 6%, transparent);
  }

  /* ── Center: tab strip + terminal (matches TabBar/Terminal) ── */
  #center { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; background: var(--background); }
  #tabstrip {
    height: 34px; flex-shrink: 0;
    display: flex; align-items: stretch;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 0 10px; max-width: 220px;
    font-size: 12px; color: var(--muted-foreground);
    border-right: 1px solid var(--border); cursor: pointer;
  }
  .tab.active {
    color: var(--foreground);
    background: color-mix(in srgb, var(--card) 80%, transparent);
  }
  .tab .tab-icon { color: var(--muted-foreground); flex-shrink: 0; }
  .tab .tab-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab .tab-close {
    width: 16px; height: 16px; border-radius: 4px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted-foreground);
  }
  .tab .tab-close:hover { background: var(--accent); color: var(--foreground); }
  .new-tab-btn {
    width: 28px; align-self: center; height: 28px; margin-left: 4px;
    border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted-foreground);
  }
  .new-tab-btn:hover { background: color-mix(in srgb, var(--accent) 50%, transparent); }
  .tabstrip-spacer { flex: 1; }
  .tabstrip-right { display: flex; align-items: center; gap: 2px; padding-right: 6px; }

  #terminal {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 12px 16px;
    font-family: var(--font-mono); font-size: 12px; line-height: 1.7;
    color: #d4d4d4; white-space: pre-wrap;
  }
  #terminal .t-dim { color: #6f6f6f; }
  #terminal .t-prompt { color: #86efac; }
  #terminal .t-path { color: #93c5fd; }
  #terminal .t-accent { color: #c4b5fd; }
  .t-cursor {
    display: inline-block; width: 7px; height: 13px; vertical-align: -2px;
    background: #d4d4d4; animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── Right sidebar: Files / Search only ── */
  #right-sidebar {
    width: 260px; flex-shrink: 0;
    display: flex; flex-direction: column; min-height: 0;
    border-left: 1px solid var(--border); background: var(--background);
  }
  #right-sidebar.collapsed { display: none; }
  .rs-header {
    height: 36px; flex-shrink: 0;
    display: flex; align-items: center; gap: 2px;
    padding: 0 6px; border-bottom: 1px solid var(--border);
  }
  .rs-tab-btn {
    width: 26px; height: 26px; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted-foreground);
  }
  .rs-tab-btn:hover { background: color-mix(in srgb, var(--accent) 60%, transparent); color: var(--foreground); }
  .rs-tab-btn.active { background: color-mix(in srgb, var(--accent) 60%, transparent); color: var(--foreground); }
  .rs-spacer { flex: 1; }
  #rs-panel { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 0 14px; }
  #rs-panel::-webkit-scrollbar { width: 8px; }
  #rs-panel::-webkit-scrollbar-thumb {
    border-radius: 4px;
    background: color-mix(in srgb, var(--muted-foreground) 28%, transparent);
  }
  .explorer-row {
    width: 100%; display: flex; align-items: center; gap: 5px;
    height: 24px; padding: 0 10px;
    font-size: 12px; text-align: left; cursor: pointer; user-select: none;
  }
  .explorer-row:hover { background: color-mix(in srgb, var(--accent) 35%, transparent); }
  .explorer-row .ex-chev {
    width: 12px; height: 12px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    color: color-mix(in srgb, var(--muted-foreground) 70%, transparent);
    transition: transform .15s;
  }
  .explorer-row.collapsed .ex-chev { transform: rotate(-90deg); }
  .explorer-row .ex-icon { color: var(--muted-foreground); flex-shrink: 0; }
  .explorer-row .ex-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .explorer-row .ex-hint {
    margin-left: auto; flex-shrink: 0;
    font-size: 9.5px; color: color-mix(in srgb, var(--muted-foreground) 65%, transparent);
  }
  .explorer-empty { padding: 10px 12px; font-size: 11.5px; color: var(--muted-foreground); line-height: 1.5; }
  .search-panel { padding: 8px 10px; display: grid; gap: 8px; }
  .search-input {
    width: 100%; height: 26px; border-radius: 6px;
    border: 1px solid rgb(255 255 255 / 0.15); background: transparent;
    color: var(--foreground); padding: 0 8px; font-size: 12px; outline: none;
  }
  .search-input:focus { border-color: var(--ring); }
  .search-hint { font-size: 11px; color: var(--muted-foreground); line-height: 1.5; }

  /* ── Popover menu (Radix dropdown look) ─────────────── */
  .popover {
    position: fixed; z-index: 60; min-width: 252px;
    background: var(--card); border: 1px solid var(--worktree-sidebar-border);
    border-radius: 8px; padding: 4px;
    box-shadow: 0 10px 38px -10px rgb(0 0 0 / .55), 0 10px 20px -15px rgb(0 0 0 / .4);
  }
  .popover .pop-label { padding: 6px 8px 4px; font-size: 11px; color: var(--muted-foreground); }
  .menu-item {
    width: 100%; text-align: left;
    display: flex; align-items: flex-start; gap: 8px;
    padding: 6px 8px; border-radius: 6px; font-size: 12.5px; line-height: 1.3;
  }
  .menu-item:hover { background: color-mix(in srgb, var(--accent) 60%, transparent); }
  .menu-item .mi-icon { margin-top: 1px; color: var(--muted-foreground); flex-shrink: 0; }
  .menu-item .mi-sub { display: block; margin-top: 2px; font-size: 10.5px; color: var(--muted-foreground); }
  .menu-sep { height: 1px; margin: 4px 6px; background: var(--border); }

  /* ── Toast ─────────────────────────────────────────── */
  #toast-layer { position: fixed; right: 16px; bottom: 16px; z-index: 70; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    display: flex; align-items: flex-start; gap: 8px;
    max-width: 360px; padding: 10px 12px; border-radius: 8px;
    background: var(--card); border: 1px solid var(--worktree-sidebar-border);
    box-shadow: 0 10px 30px -12px rgb(0 0 0 / .6);
    font-size: 12px; line-height: 1.4;
  }
  .toast .t-icon { color: #10b981; flex-shrink: 0; margin-top: 1px; }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="traffic"><span class="r"></span><span class="y"></span><span class="g"></span></div>
    <div class="tb-title">Orca — mock: multi-repo folder workspaces</div>
  </div>
  <div id="content">
    <aside id="sidebar">
      <div class="sidebar-header">
        <span class="sh-title">Projects</span>
        <span class="sh-actions">
          <button class="icon-btn" title="Workspace board" data-act="noop" id="kanban-btn"></button>
          <button class="icon-btn" title="New workspace" data-act="noop" id="plus-btn"></button>
        </span>
      </div>
      <div id="sidebar-list"></div>
    </aside>
    <div id="center">
      <div id="tabstrip"></div>
      <div id="terminal"></div>
    </div>
    <aside id="right-sidebar">
      <div class="rs-header" id="rs-header"></div>
      <div id="rs-panel"></div>
    </aside>
  </div>
</div>
<div id="toast-layer"></div>
<script>
'use strict';

/* Lucide icon path data (stroke-based, 24x24, stroke-width 2) */
const ICONS = {
  folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  folderTree: '<path d="M20 10a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-2.5a1 1 0 0 1-.8-.4l-.9-1.2A1 1 0 0 0 15 3h-2a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1Z"/><path d="M20 21a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1h-2.5a1 1 0 0 1-.8-.4l-.9-1.2a1 1 0 0 0-.8-.4h-2a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1Z"/><path d="M3 5a2 2 0 0 0 2 2h3"/><path d="M3 3v13a2 2 0 0 0 2 2h3"/>',

  listTree: '<path d="M21 12h-8"/><path d="M21 6H8"/><path d="M21 18h-8"/><path d="M3 6v4c0 1.1.9 2 2 2h3"/><path d="M3 10v6c0 1.1.9 2 2 2h3"/>',
  gitBranch: '<line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',

  layers: '<path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
  bot: '<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  triangleAlert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  squarePlus: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8"/><path d="M12 8v8"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  squareTerminal: '<path d="m7 11 2-2-2-2"/><path d="M11 13h4"/><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>',
  files: '<path d="M20 7h-3a2 2 0 0 1-2-2V2"/><path d="M9 18a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h7l5 5v9a2 2 0 0 1-2 2Z"/><path d="M3 7.6v12.8A1.6 1.6 0 0 0 4.6 22h9.8"/>',
  fileText: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  panelRight: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'
};
function icon(name, size = 14, extra = '') {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" ' +
    'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ' +
    (extra ? extra + ' ' : '') + 'aria-hidden="true">' + ICONS[name] + '</svg>';
}

/* ── Example data from docs/reference/multi-repo-agent-workspaces.md ── */
const PLATFORM = {
  id: 'platform', name: 'Platform', path: '~/work/platform',
  tasks: [
    { id: 'refund-fix', name: 'refund fix', status: 'working', branch: 'refund-fix', linkedRepos: 2, changed: 4 },
    { id: 'tax-export', name: 'tax export', status: 'inactive', branch: 'tax-export', linkedRepos: 2, changed: 0 }
  ],
  repos: [
    { id: 'api',   name: 'api',   icon: 'braces',  rel: 'api' },
    { id: 'web',   name: 'web',   icon: 'globe',   rel: 'web' },
    { id: 'repo1', name: 'repo1', icon: 'package', rel: 'packages/shared/repo1', scope: 'packages/shared' },
    { id: 'repo2', name: 'repo2', icon: 'package', rel: 'packages/shared/repo2', scope: 'packages/shared' }
  ]
};
const MOBILE = {
  id: 'mobile', name: 'Mobile Apps',
  oldPath: '~/work/mobile-apps', newPath: '~/src/mobile-apps',
  repos: [
    { id: 'ios',     name: 'ios',     icon: 'smartphone', rel: 'ios' },
    { id: 'android', name: 'android', icon: 'smartphone', rel: 'android' }
  ]
};
/* File-explorer trees per folder workspace (right sidebar Files panel). */
const EXPLORER_TREES = {
  platform: [
    { name: 'api', folder: true, hint: 'repo', children: [
      { name: 'src', folder: true, children: [] },
      { name: 'package.json' }
    ] },
    { name: 'packages', folder: true, children: [
      { name: 'shared', folder: true, children: [
        { name: 'repo1', folder: true, hint: 'repo', children: [] },
        { name: 'repo2', folder: true, hint: 'repo', children: [] }
      ] }
    ] },
    { name: 'web', folder: true, hint: 'repo', children: [
      { name: 'src', folder: true, children: [] },
      { name: 'package.json' }
    ] },
    { name: 'CLAUDE.md' }
  ],
  mobile: [
    { name: 'android', folder: true, hint: 'repo', children: [] },
    { name: 'ios', folder: true, hint: 'repo', children: [] }
  ],
  butterfish: [
    { name: 'docs', folder: true, children: [] },
    { name: 'src', folder: true, children: [] },
    { name: 'CLAUDE.md' },
    { name: 'package.json' }
  ]
};

const state = {
  selection: { type: 'task', id: 'refund-fix' },
  collapsed: {},                 // groupKey -> true
  projection: 'flat',            // 'flat' | 'tree'  (Platform group only)
  mobileConnected: false,
  popoverOpen: false,
  rsTab: 'files',                // right sidebar: 'files' | 'search'
  rsCollapsed: false,
  explorerCollapsed: { 'platform/api': true, 'platform/web': true }
};

/* Indentation rules from worktree-list-indentation.ts:
   headers: 10 + depth*10; cards: (depth+1)*18 + 2 */
function headerPad(depth) { return 10 + depth * 10; }
function cardPad(depth) { return 2 + (depth + 1) * 18 + 2; }

<script>
'use strict';

/* ── Sidebar rendering ─────────────────────────────── */
function isSel(type, id) {
  return state.selection.type === type && state.selection.id === id ? ' selected' : '';
}

function statusDot(status) {
  const cls = status === 'working' ? 'working' : status === 'done' ? 'done' : status === 'permission' ? 'permission' : 'inactive';
  return '<span class="status-slot"><span class="dot ' + cls + '"></span></span>';
}

function taskCard(task, depth) {
  const active = state.selection.type === 'task' && state.selection.id === task.id;
  const changed = task.changed > 0
    ? '<span class="badge changed-badge">' + task.changed + ' files</span>' : '';
  return '<div class="card' + (active ? ' active' : '') + '" data-act="select" data-sel-type="task" data-sel-id="' + task.id + '"' +
    ' style="padding-left:' + cardPad(depth) + 'px">' +
    statusDot(task.status) +
    '<div class="card-content">' +
      '<div class="card-title">' + task.name + '</div>' +
      '<div class="card-meta">' +
        '<span class="branch">' + task.branch + '</span>' +
        '<span class="badge repos-badge">' + icon('layers', 10) + task.linkedRepos + ' repos</span>' +
        changed +
      '</div>' +
    '</div>' +
  '</div>';
}

function repoRow(repo, depth, opts) {
  const o = opts || {};
  const pathLabel = o.pathLabel ? '<span class="path-label">' + o.pathLabel + '</span>' : '';
  return '<div class="group-header repo-row' + isSel('repo', repo.id) + '" data-act="select" data-sel-type="repo" data-sel-id="' + repo.id + '"' +
    ' style="padding-left:' + headerPad(depth) + 'px">' +
    '<span class="gh-icon">' + icon(repo.icon, 14) + '</span>' +
    '<span class="gh-label-wrap"><span class="gh-label">' + repo.name + '</span></span>' +
    pathLabel +
  '</div>';
}

function scopeRow(depth, opts) {
  const o = opts || {};
  const chev = o.collapsible
    ? '<span class="gh-chevron">' + icon('chevronDown', 14) + '</span>' : '';
  return '<div class="group-header repo-row scope-row' + isSel('scope', 'packages/shared') +
    (o.collapsed ? ' collapsed' : '') + '"' +
    ' data-act="select" data-sel-type="scope" data-sel-id="packages/shared"' +
    (o.collapsible ? ' data-scope-toggle="true"' : '') +
    ' style="padding-left:' + headerPad(depth) + 'px">' +
    '<span class="gh-icon">' + icon('folderTree', 13) + '</span>' +
    '<span class="gh-label-wrap"><span class="gh-label">packages/shared</span></span>' +
    chev +
  '</div>';
}

function platformGroup() {
  const collapsed = !!state.collapsed['platform'];
  const treeOn = state.projection === 'tree';
  let html =
    '<div class="group-header' + (collapsed ? ' collapsed' : '') + '" data-act="toggle-group" data-group="platform" style="padding-left:' + headerPad(0) + 'px">' +
      '<span class="gh-icon">' + icon('folder', 14) + '</span>' +
      '<span class="gh-label-wrap"><span class="gh-label">Platform</span>' +
        '<span class="count-badge" title="' + PLATFORM.tasks.length + ' task workspaces">' + PLATFORM.tasks.length + '</span>' +
      '</span>' +
      '<span class="gh-chevron">' + icon('chevronDown', 14) + '</span>' +
      '<button class="gh-action" data-act="toggle-projection" data-on="' + treeOn + '" ' +
        'title="' + (treeOn ? 'Show default projection' : 'Show folder tree') + '" aria-pressed="' + treeOn + '">' +
        icon(treeOn ? 'listTree' : 'folderTree', 13) + '</button>' +
      '<button class="gh-action" data-act="open-new-task" id="new-task-btn" title="New task workspace in ~/work/platform">' +
        icon('plus', 13) + '</button>' +
    '</div>';
  if (collapsed) { return html; }

  // Task workspaces first in both projections.
  for (const task of PLATFORM.tasks) { html += taskCard(task, 0); }

  if (state.projection === 'flat') {
    // Default sortable projection: repos as siblings; nested repos keep a muted
    // path label; the sparse scope stays available as a launch target row.
    for (const repo of PLATFORM.repos) {
      html += repoRow(repo, 1, { pathLabel: repo.scope || '' });
    }
    html += scopeRow(1, {});
  } else {
    // Literal folder-tree projection.
    for (const repo of PLATFORM.repos.filter((r) => !r.scope)) { html += repoRow(repo, 1, {}); }
    const scopeCollapsed = !!state.collapsed['scope:packages/shared'];
    html += scopeRow(1, { collapsible: true, collapsed: scopeCollapsed });
    if (!scopeCollapsed) {
      for (const repo of PLATFORM.repos.filter((r) => r.scope)) { html += repoRow(repo, 2, {}); }
    }
  }
  return html;
}

function mobileGroup() {
  const collapsed = !!state.collapsed['mobile'];
  const connected = state.mobileConnected;
  let html =
    '<div class="group-header' + (collapsed ? ' collapsed' : '') + (connected ? '' : ' disconnected') + '" data-act="toggle-group" data-group="mobile" style="padding-left:' + headerPad(0) + 'px">' +
      '<span class="gh-icon">' + icon('folder', 14) + '</span>' +
      '<span class="gh-label-wrap"><span class="gh-label">Mobile Apps</span>' +
        (connected
          ? '<span class="count-badge">0</span>'
          : '<span class="badge disconnected-badge">disconnected</span>') +
      '</span>' +
      '<span class="gh-chevron">' + icon('chevronDown', 14) + '</span>' +
    '</div>';
  if (collapsed) { return html; }
  if (!connected) {
    html +=
      '<div class="disconnected-note" style="margin-left:' + (headerPad(1) + 8) + 'px">' +
        '<span class="warn">' + icon('triangleAlert', 13) + '</span>' +
        '<span class="dn-text">Folder not found<br/><span class="dn-path">' + MOBILE.oldPath + '</span></span>' +
        '<button class="locate-btn" data-act="locate-folder">Locate Folder…</button>' +
      '</div>';
  } else {
    for (const repo of MOBILE.repos) { html += repoRow(repo, 1, {}); }
  }
  return html;
}

function butterfishGroup() {
  const collapsed = !!state.collapsed['butterfish'];
  const active = state.selection.type === 'worktree' && state.selection.id === 'butterfish-main';
  let html =
    '<div class="group-header' + (collapsed ? ' collapsed' : '') + '" data-act="toggle-group" data-group="butterfish" style="padding-left:' + headerPad(0) + 'px">' +
      '<span class="gh-icon">' + icon('code2', 14) + '</span>' +
      '<span class="gh-label-wrap"><span class="gh-label">butterfish</span>' +
        '<span class="count-badge">1</span></span>' +
      '<span class="gh-chevron">' + icon('chevronDown', 14) + '</span>' +
    '</div>';
  if (collapsed) { return html; }
  html +=
    '<div class="card' + (active ? ' active' : '') + '" data-act="select" data-sel-type="worktree" data-sel-id="butterfish-main"' +
      ' style="padding-left:' + cardPad(0) + 'px">' +
      statusDot('inactive') +
      '<div class="card-content">' +
        '<div class="card-title">main</div>' +
        '<div class="card-meta"><span class="branch">main</span><span class="badge primary-badge">primary</span></div>' +
      '</div>' +
    '</div>';
  return html;
}

function renderSidebar() {
  document.getElementById('sidebar-list').innerHTML =
    platformGroup() +
    '<div class="group-spacer"></div>' + mobileGroup() +
    '<div class="group-spacer"></div>' + butterfishGroup();
}
</script>
<script>
'use strict';

/* ── Center: tab strip + terminal ──────────────────── */
/* The selected sidebar scope decides the session cwd (doc: Agent Launch
   Behavior) — the terminal is how the mock shows it, like the real app. */
function selectionContext() {
  const sel = state.selection;
  if (sel.type === 'task') {
    const task = PLATFORM.tasks.find((t) => t.id === sel.id);
    return { kind: 'agent', tabLabel: 'claude', tabIcon: 'bot', cwd: PLATFORM.path, task };
  }
  if (sel.type === 'repo') {
    const all = PLATFORM.repos.concat(MOBILE.repos);
    const repo = all.find((r) => r.id === sel.id);
    const isMobile = MOBILE.repos.some((r) => r.id === sel.id);
    const base = isMobile ? MOBILE.newPath : PLATFORM.path;
    return { kind: 'shell', tabLabel: 'zsh', tabIcon: 'squareTerminal', cwd: base + '/' + repo.rel };
  }
  if (sel.type === 'scope') {
    return { kind: 'shell', tabLabel: 'zsh', tabIcon: 'squareTerminal', cwd: PLATFORM.path + '/packages/shared' };
  }
  return { kind: 'shell', tabLabel: 'zsh', tabIcon: 'squareTerminal', cwd: '~/source/repos/butterfish' };
}

function renderTabStrip(ctx) {
  document.getElementById('tabstrip').innerHTML =
    '<div class="tab active">' +
      '<span class="tab-icon">' + icon(ctx.tabIcon, 13) + '</span>' +
      '<span class="tab-label">' + ctx.tabLabel + '</span>' +
      '<span class="tab-close">' + icon('x', 10) + '</span>' +
    '</div>' +
    '<button class="new-tab-btn" title="New tab">' + icon('plus', 14) + '</button>' +
    '<div class="tabstrip-spacer"></div>' +
    '<div class="tabstrip-right">' +
      (state.rsCollapsed
        ? '<button class="icon-btn" data-act="rs-toggle" title="Open right sidebar">' + icon('panelRight', 14) + '</button>'
        : '') +
    '</div>';
}

function promptLine(cwd, rest) {
  return '<span class="t-prompt">' + cwd + '</span><span class="t-dim"> $</span> ' + (rest || '<span class="t-cursor"></span>');
}

function renderTerminal(ctx) {
  let html;
  if (ctx.kind === 'agent') {
    const task = ctx.task;
    const working = task.status === 'working';
    html =
      promptLine(ctx.cwd, 'claude') + '\n' +
      '<span class="t-accent">▐▛███▜▌ Claude Code</span>\n' +
      '<span class="t-dim">cwd </span><span class="t-path">' + ctx.cwd + '</span>' +
      '<span class="t-dim">  ORCA_WORKSPACE_ROOT=' + ctx.cwd + '</span>\n' +
      '<span class="t-dim">↳ CLAUDE.md loaded from folder root</span>\n' +
      '\n' +
      '<span class="t-dim">›</span> ' + (task.id === 'refund-fix'
        ? 'fix the refund rounding bug across api and web'
        : 'wire up the quarterly tax export') + '\n' +
      '\n';
    if (working) {
      html +=
        '<span class="t-dim">⏺ Editing</span> api/src/billing/refund.ts <span class="t-dim">(worktree ' + task.branch + ')</span>\n' +
        '<span class="t-dim">⏺ Editing</span> web/src/pages/refunds.tsx <span class="t-dim">(worktree ' + task.branch + ')</span>\n' +
        '<span class="t-accent">✶</span> Working… <span class="t-cursor"></span>';
    } else {
      html +=
        '<span class="t-dim">⏺ Created worktrees</span> api/' + task.branch + '<span class="t-dim">,</span> repo1/' + task.branch + '\n' +
        '<span class="t-dim">✓ Done. Session idle.</span>\n' +
        '\n' +
        promptLine(ctx.cwd);
    }
  } else {
    html =
      '<span class="t-dim">Last login: Wed Jun 10 19:41:02 on ttys012</span>\n' +
      promptLine(ctx.cwd);
  }
  document.getElementById('terminal').innerHTML = html;
}

/* ── Right sidebar: Files / Search ─────────────────── */
function explorerOwner() {
  const sel = state.selection;
  if (sel.type === 'worktree') { return 'butterfish'; }
  if (sel.type === 'repo' && MOBILE.repos.some((r) => r.id === sel.id)) { return 'mobile'; }
  return 'platform';
}

function explorerRows(nodes, owner, prefix, depth) {
  let html = '';
  for (const node of nodes) {
    const key = owner + '/' + prefix + node.name;
    const pad = 10 + depth * 14;
    if (node.folder) {
      const collapsed = !!state.explorerCollapsed[key];
      html +=
        '<div class="explorer-row' + (collapsed ? ' collapsed' : '') + '" data-act="ex-toggle" data-key="' + key + '" style="padding-left:' + pad + 'px">' +
          '<span class="ex-chev">' + icon('chevronDown', 11) + '</span>' +
          '<span class="ex-icon">' + icon('folder', 13) + '</span>' +
          '<span class="ex-name">' + node.name + '</span>' +
          (node.hint ? '<span class="ex-hint">' + node.hint + '</span>' : '') +
        '</div>';
      if (!collapsed && node.children && node.children.length) {
        html += explorerRows(node.children, owner, prefix + node.name + '/', depth + 1);
      }
    } else {
      html +=
        '<div class="explorer-row" style="padding-left:' + (pad + 17) + 'px">' +
          '<span class="ex-icon">' + icon('fileText', 13) + '</span>' +
          '<span class="ex-name">' + node.name + '</span>' +
        '</div>';
    }
  }
  return html;
}

function renderRightSidebar() {
  const rs = document.getElementById('right-sidebar');
  rs.className = state.rsCollapsed ? 'collapsed' : '';
  if (state.rsCollapsed) { return; }

  document.getElementById('rs-header').innerHTML =
    '<button class="rs-tab-btn' + (state.rsTab === 'files' ? ' active' : '') + '" data-act="rs-tab" data-tab="files" title="Files">' + icon('files', 14) + '</button>' +
    '<button class="rs-tab-btn' + (state.rsTab === 'search' ? ' active' : '') + '" data-act="rs-tab" data-tab="search" title="Search">' + icon('search', 14) + '</button>' +
    '<span class="rs-spacer"></span>' +
    '<button class="rs-tab-btn" data-act="rs-toggle" title="Close right sidebar">' + icon('panelRight', 14) + '</button>';

  const owner = explorerOwner();
  let html;
  if (state.rsTab === 'search') {
    const scope = owner === 'butterfish' ? '~/source/repos/butterfish'
      : owner === 'mobile' ? MOBILE.newPath : PLATFORM.path;
    html =
      '<div class="search-panel">' +
        '<input class="search-input" placeholder="Search" aria-label="Search files" />' +
        '<div class="search-hint">Searches across <strong>' + scope + '</strong>' +
          (owner === 'platform' ? ' — all 4 repos and shared folders in the folder workspace.' : '.') + '</div>' +
      '</div>';
  } else if (owner === 'mobile' && !state.mobileConnected) {
    html = '<div class="explorer-empty">Folder not found — reconnect Mobile Apps to browse files.</div>';
  } else {
    html = explorerRows(EXPLORER_TREES[owner], owner, '', 0);
  }
  document.getElementById('rs-panel').innerHTML = html;
}

function renderAll() {
  renderSidebar();
  const ctx = selectionContext();
  renderTabStrip(ctx);
  renderTerminal(ctx);
  renderRightSidebar();
}

/* ── Toast ─────────────────────────────────────────── */
function showToast(text) {
  const layer = document.getElementById('toast-layer');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<span class="t-icon">' + icon('check', 13) + '</span><span>' + text + '</span>';
  layer.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

/* ── New-task-workspace popover ────────────────────── */
function closePopover() {
  const pop = document.getElementById('new-task-popover');
  if (pop) { pop.remove(); }
  state.popoverOpen = false;
}

function openNewTaskPopover(anchor) {
  closePopover();
  const pop = document.createElement('div');
  pop.className = 'popover';
  pop.id = 'new-task-popover';
  pop.innerHTML =
    '<div class="pop-label">New task workspace in <strong>Platform</strong></div>' +
    '<button class="menu-item" data-menu="same-named">' +
      '<span class="mi-icon">' + icon('gitBranch', 13) + '</span>' +
      '<span>Create same-named worktrees<span class="mi-sub">One branch name across api, web, repo1, repo2</span></span></button>' +
    '<button class="menu-item" data-menu="existing">' +
      '<span class="mi-icon">' + icon('link', 13) + '</span>' +
      '<span>Use existing checkouts…<span class="mi-sub">Pick a worktree per repo to link</span></span></button>' +
    '<div class="menu-sep"></div>' +
    '<button class="menu-item" data-menu="bare">' +
      '<span class="mi-icon">' + icon('folder', 13) + '</span>' +
      '<span>Start without linked worktrees<span class="mi-sub">Agent starts at ~/work/platform; link checkouts later</span></span></button>';
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  const w = pop.offsetWidth;
  pop.style.top = (r.bottom + 6) + 'px';
  pop.style.left = Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8)) + 'px';
  state.popoverOpen = true;
}

/* ── Event wiring ──────────────────────────────────── */
document.getElementById('kanban-btn').innerHTML = icon('kanban', 14);
document.getElementById('plus-btn').innerHTML = icon('plus', 14);

document.addEventListener('click', (e) => {
  const menuItem = e.target.closest('[data-menu]');
  if (menuItem) {
    const kind = menuItem.dataset.menu;
    closePopover();
    showToast(kind === 'same-named'
      ? 'Mock: would create same-named worktrees across 4 repos and open the new task workspace.'
      : kind === 'existing'
        ? 'Mock: would open the existing-checkout picker per repo.'
        : 'Mock: would start a task workspace with cwd ~/work/platform and no linked worktrees.');
    return;
  }
  if (e.target.closest('#new-task-popover')) { return; }
  if (state.popoverOpen) { closePopover(); }

  const el = e.target.closest('[data-act]');
  if (!el) { return; }
  const act = el.dataset.act;

  if (act === 'open-new-task') {
    e.stopPropagation();
    openNewTaskPopover(el);
    return;
  }
  if (act === 'toggle-projection') {
    e.stopPropagation();
    state.projection = state.projection === 'flat' ? 'tree' : 'flat';
    renderAll();
    return;
  }
  if (act === 'toggle-group') {
    const key = el.dataset.group;
    state.collapsed[key] = !state.collapsed[key];
    renderAll();
    return;
  }
  if (act === 'select') {
    // The scope header in tree projection doubles as a collapse toggle when
    // the chevron is clicked; plain row clicks select the scope.
    if (el.dataset.scopeToggle === 'true' && e.target.closest('.gh-chevron')) {
      const key = 'scope:packages/shared';
      state.collapsed[key] = !state.collapsed[key];
      renderAll();
      return;
    }
    state.selection = { type: el.dataset.selType, id: el.dataset.selId };
    renderAll();
    return;
  }
  if (act === 'locate-folder') {
    e.stopPropagation();
    state.mobileConnected = true;
    renderAll();
    showToast('Reconnected Mobile Apps — 2 repos remapped to ' + MOBILE.newPath + '.');
    return;
  }
  if (act === 'rs-toggle') {
    state.rsCollapsed = !state.rsCollapsed;
    renderTabStrip(selectionContext());
    renderRightSidebar();
    return;
  }
  if (act === 'rs-tab') {
    state.rsTab = el.dataset.tab;
    renderRightSidebar();
    return;
  }
  if (act === 'ex-toggle') {
    const key = el.dataset.key;
    state.explorerCollapsed[key] = !state.explorerCollapsed[key];
    renderRightSidebar();
    return;
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.popoverOpen) { closePopover(); }
});
