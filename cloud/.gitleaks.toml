[extend]
useDefault = true

[[allowlists]]
description = "Explicit Relay test signing key"
regexTarget = "secret"
regexes = ['''^test-assignment-key-with-at-least-32-bytes$''']

# Fixture lease holders use owner/repo/run_id, which the generic key rule mistakes for a secret.
[[allowlists]]
description = "Cloud SQL rollout lease holder keys in the action's unit tests"
regexTarget = "secret"
paths = ['''\.github/actions/cloud-sql-rollout-lease/[a-z-]+\.test\.mjs$''']
regexes = ['''^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/[0-9]+$''']

# Raw-socket tests use RFC 6455 §1.3’s example base64 nonce, triggering the generic key rule.
[[allowlists]]
description = "RFC 6455 example Sec-WebSocket-Key in upgrade tests"
regexTarget = "secret"
regexes = ['''^dGhlIHNhbXBsZSBub25jZQ==$''']

# The Orca Cloud connector service moved out of this repo; these stay because the history scan still reads its old files.
# The Discord client-secret rule reads a connector env var name in a config error as the secret.
[[allowlists]]
description = "Connector Discord env var names"
regexTarget = "secret"
regexes = ['''^ORCA_CONNECTOR_DISCORD_[A-Z_]+$''']

[[allowlists]]
description = "Locally calculated webhook fixture signature"
condition = "AND"
regexTarget = "secret"
paths = ['''^cloud/apps/connector/src/test-fixtures/webhook-signatures/sentry\.json$''']
# Groups keep the allowlist itself from looking like a token to the other scanner.
regexes = ['''^(282391d7e1f11b55)(31b9e4d7db12c980)(e92fe82846b668d1)(20f5c8ac232a8bcc)$''']

[[allowlists]]
description = "Published Svix verification example signing secret"
condition = "AND"
regexTarget = "secret"
paths = ['''^cloud/apps/connector/src/test-fixtures/webhook-signatures/svix\.json$''']
regexes = ['''^whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw$''']

[[allowlists]]
description = "Made-up webhook key in the envelope scrubbing test"
condition = "AND"
regexTarget = "secret"
paths = ['''^cloud/apps/connector/src/webhook-call-envelope\.test\.ts$''']
regexes = ['''^(orcawh_Ab3-_xYz)(0123456789abcdefghijklmnopqrstuvwxy)$''']
