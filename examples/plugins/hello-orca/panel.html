<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* The host injects Orca design tokens as CSS custom properties, so
         panels can match the app without any access to it. */
      body {
        margin: 0;
        padding: 12px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        color: var(--orca-foreground, #ddd);
        background: var(--orca-background, transparent);
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      button {
        display: block;
        margin: 6px 0;
        padding: 6px 10px;
        border: 1px solid var(--orca-border, #555);
        border-radius: 6px;
        background: var(--orca-secondary, #2a2a2a);
        color: var(--orca-foreground, #ddd);
        cursor: pointer;
        font: inherit;
      }
      .status {
        margin-top: 10px;
        min-height: 1.4em;
        color: var(--orca-muted-foreground, #999);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Hello Orca 👋</h1>
    <p>Panel + worker command + events, gated by consent.</p>
    <button id="ctx">Read workspace context</button>
    <button id="notify">Show a notification</button>
    <p class="status" id="status"></p>
    <script>
      'use strict'
      var seq = 0
      var pending = new Map()
      var statusEl = document.getElementById('status')

      function call(action, params) {
        return new Promise(function (resolve) {
          var requestId = 'req-' + ++seq
          pending.set(requestId, resolve)
          // The panel frame is an opaque origin, so '*' is the only usable
          // targetOrigin; the host verifies the sending window instead.
          window.parent.postMessage(
            { type: 'orca-panel-action', requestId: requestId, action: action, params: params },
            '*'
          )
        })
      }

      window.addEventListener('message', function (event) {
        var data = event.data
        if (event.source !== window.parent || !data || data.type !== 'orca-panel-action-result') {
          return
        }
        var resolve = pending.get(data.requestId)
        if (!resolve) return
        pending.delete(data.requestId)
        resolve(data)
      })

      document.getElementById('ctx').addEventListener('click', function () {
        call('workspace.readContext').then(function (result) {
          if (!result.ok) {
            statusEl.textContent = 'context failed: ' + (result.error || result.errorCode)
            return
          }
          if (!result.value) {
            statusEl.textContent = 'No workspace is focused.'
            return
          }
          var count = result.value.terminals.length
          var branch = result.value.branch.replace(/^refs\/heads\//, '')
          var terminals = count === 1 ? 'terminal' : 'terminals'
          statusEl.textContent = `${result.value.displayName} on branch ${branch} · ${count} ${terminals}`
        })
      })

      document.getElementById('notify').addEventListener('click', function () {
        call('notifications.show', { title: 'Hello from the panel' }).then(function (result) {
          statusEl.textContent = result.ok
            ? result.value.delivered
              ? 'Notification shown.'
              : 'Notifications are turned off.'
            : 'notify failed: ' + (result.error || result.errorCode)
        })
      })
    </script>
  </body>
</html>
