[package]
name = "orca-desktop"
version = "1.4.104"
description = "Orca desktop host (Tauri v2 / Pake-style system webview)"
authors = ["stablyai"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "orca_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
