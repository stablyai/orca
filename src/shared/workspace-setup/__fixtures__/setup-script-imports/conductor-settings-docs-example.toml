"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "pnpm install"
archive = "pnpm clean"
run_mode = "concurrent"
auto_run_after_setup = true

[scripts.run.web]
command = "pnpm dev --port $CONDUCTOR_PORT"
default = true
icon = "play"
available_in = ["local", "cloud"]

[scripts.run.worker]
command = "pnpm worker:dev"
icon = "server"

[scripts.run.test]
command = "pnpm test:watch"
icon = "test-tube"

[scripts.run.storybook]
command = "pnpm storybook"
args = ["--port", "6006", "--no-open"]
options = { cwd = "packages/ui" }
icon = "book"
