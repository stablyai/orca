<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head><body>
<div class="hd"><img class="brand" src="icons/icon-48.png" alt="Orca"><span class="nm">AI 대화 아카이브</span><span id="conn" class="conn">확인 중…</span></div>
<div id="site" class="site"></div>
<button id="sync" class="cta" disabled>동기화</button>
<label class="opt"><input type="checkbox" id="force"> 기존 대화도 다시 가져오기(형식 갱신)</label>
<label class="opt"><input type="checkbox" id="optImages"> 사진 포함</label>
<label class="opt"><input type="checkbox" id="optFiles"> 파일 포함</label>
<div id="prog" class="prog" hidden>
  <div class="prog-h"><span id="prog-label">가져오는 중…</span><span id="prog-txt">0 / 0</span></div>
  <div class="bar"><div id="fill" class="fill"></div></div>
</div>
<div id="recent" class="recent"></div>
<div id="status" class="foot">Orca 설정 → 브라우저 연동에서 설치하면 자동 동기화돼요</div>
<script type="module" src="popup.js"></script></body></html>
