name: ZCode transcript contract
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'src/main/ai-vault/session-scanner-zcode*'
      - 'src/main/ai-vault/session-scanner-opencode*'
      - 'src/main/ai-vault/opencode-wsl-runtime*'
      - 'src/main/native-chat/transcript-opencode*'
      - 'src/main/native-chat/transcript-zcode*'
      - 'src/shared/native-chat-types.ts'
      - 'src/shared/native-chat-transcript-projection*'
      - '.github/workflows/zcode-transcript-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zcode-transcript-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  transcript-readers:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version
      - name: Verify SQLite ordering, legacy readers, and host routing
        run: pnpm test src/main/native-chat/transcript-zcode.test.ts src/main/native-chat/transcript-opencode.test.ts src/main/native-chat/transcript-opencode-sqlite-query.test.ts src/main/native-chat/transcript-opencode2-sqlite.test.ts src/main/native-chat/transcript-opencode-semantic-fidelity.test.ts src/main/native-chat/transcript-opencode-read-bounds.test.ts src/main/native-chat/transcript-opencode-subscribe.test.ts src/main/ai-vault/session-scanner-zcode.test.ts src/main/ai-vault/session-scanner-zcode-sources.test.ts src/main/ai-vault/opencode-wsl-runtime-preparation.test.ts src/main/ai-vault/session-scanner-opencode-wsl-routing.test.ts src/shared/native-chat-transcript-projection.test.ts src/renderer/src/components/native-chat/structured-agent-session-transcript-order.test.ts
