name: Unit transform cache producer

# Cold full unit run on main that publishes per-shard Vitest transform caches for PR shards.
# Runs on the PR shards' hosted ARM image so its GitHub-cache entries match their keys.
# Manual only: each shard seals ~330-380 MB, above the 250 MB cap, so a schedule saved nothing.
# PR shards fall back to cold transforms when no entry exists.
on:
  workflow_dispatch:

concurrency:
  group: unit-module-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit_plan:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/unit-plan.yml

  test:
    needs: unit_plan
    uses: ./.github/workflows/unit-tests.yml
    with:
      # Match the PR unit matrix so the cache key's runtime and shard fields line up.
      node_versions: '["24"]'
      runner: ubuntu-24.04-arm
      shards: ${{ needs.unit_plan.outputs.shards }}
      module_cache: cold
      artifact_prefix: cache-producer-unit
