name: Publish Codex history cleanup policy

# Maintainer-only publisher: dispatch main to next, soak, then promote identical bytes to stable; emergency-off turns every kind off on both channels at once. Use GITHUB_TOKEN so release-policy accepts bot-authored prereleases.
# Create the `codex-history-cleanup-policy` environment with required reviewers before the first dispatch, or GitHub creates it unprotected. Emergency-off waits for the same approval.
# Pull requests touching the policy or its publisher run only the validation, so a bad edit fails before merge.
# Emergency-off shares the publishes' concurrency group and cancels a running one (even one awaiting approval), so no publish can land after it. A publish dispatched while off is still pending replaces it: off then shows cancelled, so rerun it. Limit: it still installs dependencies, since it imports the app's parser.
on:
  pull_request:
    paths:
      - 'config/remote-policies/codex-history-cleanup-policy.json'
      - 'config/scripts/release/codex-history-cleanup-policy/**'
      - 'config/scripts/release/publication/channel-release-asset.mjs'
      - 'src/main/codex/history/cleanup-policy/codex-history-cleanup-policy.ts'
      - 'config/scripts/release/versioning/release-tag-patterns.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/codex-history-cleanup-policy-publish.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'publish-next publishes config/remote-policies/codex-history-cleanup-policy.json to next; promote-stable copies the next file to stable; emergency-off publishes every kind off to next and stable'
        required: true
        type: choice
        options:
          - publish-next
          - promote-stable
          - emergency-off
      revision:
        description: 'emergency-off only: the lowest revision to use (1 to 2146483647), above any ever published; needed to replace a channel whose revision cannot be read'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Per ref, so a wrong-ref dispatch never replaces a pending one from main.
  group: ${{ format('codex-history-cleanup-policy-{0}-{1}', github.event_name == 'pull_request' && 'validate' || 'publish', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || inputs.action == 'emergency-off' }}

jobs:
  # A dispatch from another ref must fail visibly, not skip green while nothing was published.
  require-main:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse a dispatch outside main
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          echo "::error::Dispatched from $DISPATCH_REF; this workflow publishes only from main. Rerun with --ref main."
          exit 1

  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The publisher validates with the app's own parser, which needs the app's dependencies.
      - uses: ./.github/actions/install-node-dependencies
      - name: Validate the policy
        run: node config/scripts/release/codex-history-cleanup-policy/codex-history-cleanup-policy-publish.mjs validate

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: codex-history-cleanup-policy
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ inputs.action }}
          REVISION: ${{ inputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          args=("$ACTION")
          [[ "$ACTION" == "emergency-off" && -n "$REVISION" ]] && args+=(--revision "$REVISION")
          node config/scripts/release/codex-history-cleanup-policy/codex-history-cleanup-policy-publish.mjs "${args[@]}"
