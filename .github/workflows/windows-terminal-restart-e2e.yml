name: Windows terminal restart E2E

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to check out
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-terminal-restart-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-terminal-restart:
    name: Windows terminal restart regressions
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      # Why: pnpm must exist before setup-node resolves its dependency cache.
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron app for Windows E2E
        run: pnpm exec electron-vite build --mode e2e

      - name: Prepare immediate handle diagnostic
        shell: pwsh
        run: |
          $handleZip = Join-Path $env:RUNNER_TEMP 'Handle.zip'
          $handleDir = Join-Path $env:RUNNER_TEMP 'orca-handle-diagnostic'
          Invoke-WebRequest 'https://download.sysinternals.com/files/Handle.zip' -OutFile $handleZip
          Expand-Archive $handleZip -DestinationPath $handleDir
          "ORCA_E2E_HANDLE_EXE=$(Join-Path $handleDir 'handle64.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run Windows terminal restart regressions
        env:
          SKIP_BUILD: '1'
          ORCA_E2E_FORWARD_APP_LOGS: '1'
        # Why: pnpm forwards a literal `--` to Playwright, which makes the
        # grep and worker flags positional filters instead of CLI options.
        run: >-
          pnpm run test:e2e
          tests/e2e/golden-tab-bar-agent-launch.spec.ts
          --repeat-each=3
          --workers=1

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-terminal-restart-playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
