name: Wayland IME boundary investigation

on:
  push:
    branches: [ci/wayland-ime-investigation]

permissions:
  contents: read

env:
  ORCA_BACKGROUND_LAUNCH: '1'

jobs:
  linux-wayland:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install native build, nested compositor and IME tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential python3 fonts-noto-cjk dbus-x11 dconf-gsettings-backend
          ibus ibus-hangul gnome-shell gnome-settings-daemon libglib2.0-bin
          xdotool xvfb x11-utils imagemagick
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
      - name: Build Electron app for E2E
        env:
          VITE_EXPOSE_STORE: 'true'
        run: |
          pnpm run build:relay
          pnpm exec electron-vite build --mode e2e
          pnpm run build:web-from-renderer
      - name: Observe native Wayland and IBus boundaries
        env:
          SKIP_BUILD: '1'
          ORCA_E2E_IME_DIAGNOSTICS: '1'
        run: |
          node config/scripts/run-terminal-ibus-hangul-e2e.mjs --nested-wayland > "$RUNNER_TEMP/orca-wayland-protocol.log" 2>&1
      - name: Upload every repetition and native protocol trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wayland-ime-investigation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            ${{ runner.temp }}/orca-wayland-protocol.log
          retention-days: 7
          if-no-files-found: error
