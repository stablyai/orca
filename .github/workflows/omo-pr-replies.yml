name: temp omo pr review replies
on:
  workflow_dispatch:
  push:
    branches: [feat/omo-native-tui-agent]
    paths:
      - '.github/workflows/omo-pr-replies.yml'
      - '.github/omo-pr-replies.trigger'
permissions:
  contents: read
jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - name: Probe PAT secrets
        run: |
          echo "HAS_PERSONAL_ACCESS_TOKEN=${{ secrets.PERSONAL_ACCESS_TOKEN != '' }}"
          echo "HAS_GH_PAT=${{ secrets.GH_PAT != '' }}"
          echo "HAS_GITHUB_PERSONAL_ACCESS_TOKEN=${{ secrets.GITHUB_PERSONAL_ACCESS_TOKEN != '' }}"
          echo "HAS_GH_TOKEN=${{ secrets.GH_TOKEN != '' }}"
          echo "HAS_ORCA_PAT=${{ secrets.ORCA_PAT != '' }}"
          echo "HAS_WEDREAMER_PAT=${{ secrets.WEDREAMER_PAT != '' }}"

      - name: Choose token
        id: tok
        run: |
          if [ -n "${{ secrets.PERSONAL_ACCESS_TOKEN }}" ]; then
            echo "name=PERSONAL_ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.GH_PAT }}" ]; then
            echo "name=GH_PAT" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.GITHUB_PERSONAL_ACCESS_TOKEN }}" ]; then
            echo "name=GITHUB_PERSONAL_ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.GH_TOKEN }}" ]; then
            echo "name=GH_TOKEN" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.ORCA_PAT }}" ]; then
            echo "name=ORCA_PAT" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.WEDREAMER_PAT }}" ]; then
            echo "name=WEDREAMER_PAT" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
            echo "No PAT secret configured; cannot reply as wedreamer to upstream PR."
          fi

      - name: Post replies
        if: steps.tok.outputs.name != ''
        env:
          GH_TOKEN: ${{ secrets[steps.tok.outputs.name] }}
        run: |
          set -euo pipefail
          whoami_login=$(gh api user -q .login)
          echo "authenticated_as=$whoami_login"
          test "$whoami_login" = "wedreamer"
          post_reply() {
            gh api -X POST repos/stablyai/orca/pulls/24069/comments -f body="$2" -F in_reply_to="$1" --jq .id
          }
          post_reply 4145764433 "Fixed in ca021a60 — OmO sessions-dir probe no longer awaits before ready; result applied asynchronously when still current."
          post_reply 4145795026 "Fixed in ca021a60 — removed await-before-ready race on establish; omoSessionsDir applied async with mux/current checks."
          post_reply 4145795064 "Fixed in ca021a60 — reconnect likewise does not await OmO probe before ready; async apply checks abortController + mux.isDisposed()."
          post_reply 4145840439 "Fixed in ca021a60 — readOptionalRemoteOmoSessionsDir passes wrapCommand: !isWindowsRemoteHost(hostPlatform)."
          post_reply 4144349306 "Fixed in ca021a60 — same Windows wrapCommand fix for the OmO sessions-dir probe."
          post_reply 4145653289 "Fixed in ca021a60 — writeOmoPrefillExtension is best-effort try/catch so prefill failure cannot throw into materializePi after status was written."
          post_reply 4142412002 "Already fixed earlier in b75e961 (WSL launchKind omo + ORCA_OMO_SOURCE_AGENT_DIR); no further change needed on tip ca021a60 / 30682d8b."
          post_reply 4142386715 "Addressed earlier in ad4eb5a — resume uses omo --session."
          post_reply 4142386741 "Addressed earlier — scanner env wiring for OmO is in place on tip."
          post_reply 4142386752 "Addressed earlier — WSL hooks path fixed on tip."
          post_reply 4142386761 "Addressed earlier — SSH overrides for OmO are in place on tip."
          post_reply 4144294271 "Addressed earlier in b75e961 — WSL drafts/prefill."
          post_reply 4144294278 "Addressed earlier in b75e961 — custom WSL home."
          post_reply 4144294288 "Addressed earlier in fc27e6f — SSH OmO probe/path."
          post_reply 4144294298 "Addressed earlier in fc27e6f — SSH OmO probe/path."
          post_reply 4142412032 "Addressed earlier in ad4eb5a — omo --session for known transcripts."
          post_reply 4144349292 "Addressed earlier — prefill deps handled on tip."
          post_reply 4144349326 "Addressed earlier in b75e961 — WSL agent dir (ORCA_OMO_SOURCE_AGENT_DIR)."
          echo all_replies_posted
