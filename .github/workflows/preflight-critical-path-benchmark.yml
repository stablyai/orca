name: Preflight critical-path comparison
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - .github/workflows/preflight-critical-path-benchmark.yml
      - config/scripts/benchmark-ci-preflight-critical-path.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preflight-critical-path-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  compare:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        comparison: [smoke, sync-spawn, typecheck]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version
      - name: Compare checks and verify their results
        run: node config/scripts/benchmark-ci-preflight-critical-path.mjs ${{ matrix.comparison }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preflight-critical-path-${{ matrix.comparison }}
          path: .build/preflight-benchmark/
          retention-days: 30
