name: Zotz desktop builds

# Builds unsigned Zotz installers for Windows, macOS (Apple silicon) and Linux and publishes them as a
# versioned release the in-app updater reads (docs/zotz/UPDATES-SPEC.md).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths:
      - '.github/workflows/zotz-desktop-builds.yml'
      - 'resources/win32/zotz/**'
  workflow_dispatch:

concurrency:
  group: zotz-desktop-builds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version:
    if: github.repository == 'HugoRodriguezDEV/zotz'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      base: ${{ steps.compute.outputs.base }}
      build: ${{ steps.compute.outputs.build }}
    steps:
      # Full history: the Orca base is the newest Orca release whose cut is merged into this commit.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      # An Orca sync must not point the updater back at stablyai/orca.
      - name: Check the updater reads Zotz releases
        run: node config/scripts/release/zotz-check-release-repo-refs.mjs

      - name: Compute the release version
        id: compute
        run: node config/scripts/release/zotz-release-version.mjs

  build:
    needs: version
    if: github.repository == 'HugoRodriguezDEV/zotz'
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
            builder-args: --win nsis --x64
            app-dir: dist/win-unpacked
            human-assets: |
              orca-windows-setup.exe=zotz-windows-x64-setup.exe
          - platform: macos
            runner: macos-15
            # The zip is what writes latest-mac.yml; the updater only offers mac a download link (unsigned).
            builder-args: --mac dmg zip --arm64
            app-dir: dist/mac-arm64/Zotz.app
            human-assets: |
              orca-macos-arm64.dmg=zotz-macos-arm64.dmg
          - platform: linux
            runner: ubuntu-24.04
            builder-args: --linux AppImage deb --x64
            app-dir: dist/linux-unpacked
            human-assets: |
              orca-linux.AppImage=zotz-linux-x64.AppImage
              orca-ide_*_amd64.deb=zotz-linux-amd64.deb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      # No Apple Developer certificate: macOS signs with the Zotz self-signed one (CSC_NAME, set below)
      # so Squirrel.Mac accepts updates; Gatekeeper still asks once.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ZOTZ_MAC_SIGNING_NAME: Zotz Release Signing
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Nothing else executes the node setup script before a user runs it elevated.
      - name: Parse the Windows node setup script
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/resources/win32/zotz/zotz-node-setup.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }

      # pnpm must be on PATH before setup-node so setup-node can locate the store.
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - uses: ./.github/actions/install-mobile-dependencies

      - name: Ensure the Rust toolchain for the Windows CLI launcher
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            rustup toolchain install stable --profile minimal
            rustup default stable
          }
          cargo --version

      - name: Build the Windows agent hook and CLI launcher
        if: matrix.platform == 'windows'
        run: |
          node config/scripts/native-build/windows/build-windows-agent-hook.mjs
          node config/scripts/native-build/windows/build-windows-cli-launcher.mjs

      # Same packages as the upstream release: build:native tests the Linux accessibility helper.
      - name: Install Linux build tooling
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-atspi-2.0 at-spi2-core xclip xdotool rpm

      - name: Build app
        run: pnpm build:release

      # Without the secret the build stays ad-hoc signed: installs from it can only update by hand.
      - name: Import the Zotz macOS signing certificate
        id: mac-signing
        if: matrix.platform == 'macos'
        shell: bash
        env:
          ZOTZ_MAC_CERT_P12: ${{ secrets.ZOTZ_MAC_CERT_P12 }}
          ZOTZ_MAC_CERT_PASSWORD: ${{ secrets.ZOTZ_MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ZOTZ_MAC_CERT_P12" ]]; then
            echo "::warning::ZOTZ_MAC_CERT_P12 is not set; the macOS build is ad-hoc signed and cannot self-update."
            exit 0
          fi
          bash config/scripts/release/zotz-import-mac-signing-cert.sh
          # Same-repo PRs get secrets; electron-builder skips signing on PRs unless told otherwise.
          { echo "CSC_NAME=$ZOTZ_MAC_SIGNING_NAME"; echo "CSC_FOR_PULL_REQUEST=true"; } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Package
        shell: bash
        env:
          ORCA_BUILD_COMMIT: ${{ github.sha }}
          ORCA_LOCAL_BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          node config/scripts/native-build/node-addons/ensure-native-runtime.mjs --runtime=electron
          pnpm exec electron-builder --config config/electron-builder.config.cjs ${{ matrix.builder-args }} --publish never

      # Installed nodes only accept an update carrying this same identity.
      - name: Check the macOS signature
        if: steps.mac-signing.outputs.signed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          codesign --verify --deep --strict "${{ matrix.app-dir }}"
          codesign -dvv "${{ matrix.app-dir }}" 2>&1 | grep -qx "Authority=$ZOTZ_MAC_SIGNING_NAME" || {
            codesign -dvv "${{ matrix.app-dir }}" >&2
            echo "::error::Zotz.app is not signed by $ZOTZ_MAC_SIGNING_NAME."
            exit 1
          }

      - name: Smoke the packaged CLI
        run: node config/scripts/desktop-distribution/runtime-verification/smoke-packaged-cli.mjs --app-dir=${{ matrix.app-dir }}

      # Manifest-named files must keep their names or the updater sees 404s and never offers the release.
      - name: Stage release assets
        env:
          ZOTZ_HUMAN_ASSETS: ${{ matrix.human-assets }}
        run: node config/scripts/release/zotz-stage-release-assets.mjs

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: zotz-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: ${{ !cancelled() && needs.version.result == 'success' && github.event_name != 'pull_request' && github.repository == 'HugoRodriguezDEV/zotz' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: zotz-*
          path: release
          merge-multiple: true

      # A stable, latest release: the updater resolves /releases/latest and ignores prereleases.
      - name: Publish the versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          BASE: ${{ needs.version.outputs.base }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No platform produced an installer."
            exit 1
          fi
          notes="Zotz ${VERSION} (Orca ${BASE}, build ${BUILD}) · commit ${GITHUB_SHA::10}.
          Las instalaciones de Zotz con updates (Fase 3b) la reciben solas. Instaladores sin firmar:
          - Windows: SmartScreen → Más información → Ejecutar de todas formas.
          - macOS (Apple silicon): clic derecho → Abrir, o xattr -dr com.apple.quarantine /Applications/Zotz.app.
          - Linux: chmod +x al AppImage, o instala el .deb."
          if [[ "$BUILD_RESULT" != success ]]; then
            notes="$notes
          Aviso: al menos una plataforma falló en este build; esas máquinas no ven esta versión."
          fi
          gh release create "$TAG" "${files[@]}"             --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest             --title "Zotz ${VERSION}" --notes "$notes" --generate-notes
