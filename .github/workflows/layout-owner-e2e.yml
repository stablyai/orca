name: Layout owner E2E (manual)
run-name: Layout owner E2E ${{ inputs.ref || github.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or ref to test (defaults to the workflow commit)
        required: false
        type: string

permissions:
  contents: read

# Reduced original journey selection; retired layout-oracle coverage is not claimed.
concurrency:
  group: layout-owner-e2e
  cancel-in-progress: false

jobs:
  layout_owner_switch_on:
    name: surviving layout-owner journeys (switch on)
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      test_files: '["tests/e2e/golden-journeys/golden-file-open-edit-save.spec.ts","tests/e2e/golden-journeys/golden-source-control-open-diff.spec.ts","tests/e2e/editor/file-lifecycle/editor-model-host-isolation.spec.ts","tests/e2e/terminal/remote-layout/headless-paired-remote-terminal-reveal-grid.spec.ts","tests/e2e/terminal/remote-input/headless-paired-remote-terminal-stall-recovery.spec.ts","tests/e2e/terminal/remote-layout/headless-paired-remote-terminal-viewer-size.spec.ts","tests/e2e/browser/remote-hosted/headless-serve-browser-tab-restart.spec.ts","tests/e2e/remote/paired-runtime/workspace-routing/headless-serve-desktop-activation.spec.ts","tests/e2e/remote/mobile-mirror/headless-serve-mobile-native-chat-identity.spec.ts","tests/e2e/remote/mobile-mirror/paired-mobile-serve-restart-terminal-tabs.spec.ts","tests/e2e/remote/managed-ssh/file-lifecycle/ssh-orcad-editor-watch-recovery.spec.ts","tests/e2e/remote/managed-ssh/file-lifecycle/ssh-orcad-explorer-watch-recovery.spec.ts","tests/e2e/remote/managed-ssh/host-lifecycle/ssh-orcad-idle-exit.spec.ts","tests/e2e/remote/managed-ssh/host-lifecycle/ssh-orcad-pairing-repair.spec.ts","tests/e2e/remote/managed-ssh/host-lifecycle/ssh-orcad-shared-home-machines.spec.ts","tests/e2e/remote/managed-ssh/host-lifecycle/ssh-orcad-unbindable-tunnel-port.spec.ts","tests/e2e/remote/managed-ssh/host-lifecycle/ssh-orcad-update-anyway.spec.ts"]'
      run_changed_e2e: true
      needs_build: true
      artifact_suffix: -layout-owner-switch-on
      layout_owner: main
