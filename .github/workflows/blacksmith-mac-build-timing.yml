name: Blacksmith Mac Build Timing (temp)

# TEMPORARY experiment workflow — times the signed/notarized macOS desktop
# build on a Blacksmith macOS tier without any release side effects.
# Mirrors the release-cut.yml `build` job's macOS path step-for-step, except:
#   - electron-builder runs with `--publish never` (no GitHub Release, no tag)
#   - no Windows/SignPath/Slack legs, no main bump, no version tagging
# Triggered by pushing the throwaway branch below so it can run without first
# landing on the default branch. DELETE this file once timing is captured.
#
# This pass targets the SMALLER 6 vCPU tier to compare against the 12 vCPU run.

on:
  push:
    branches:
      - nwparker/mac-smith
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blacksmith-mac-build-timing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-build-timing:
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Record runner facts
        run: |
          echo "## Blacksmith Mac runner (6 vCPU)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "arch: $(uname -m)" >> "$GITHUB_STEP_SUMMARY"
          echo "cpu cores: $(sysctl -n hw.ncpu 2>/dev/null || echo '?')" >> "$GITHUB_STEP_SUMMARY"
          echo "cpu brand: $(sysctl -n machdep.cpu.brand_string 2>/dev/null || echo '?')" >> "$GITHUB_STEP_SUMMARY"
          echo "mem bytes: $(sysctl -n hw.memsize 2>/dev/null || echo '?')" >> "$GITHUB_STEP_SUMMARY"
          echo "macOS: $(sw_vers -productVersion 2>/dev/null || echo '?')" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "RUNNER cores=$(sysctl -n hw.ncpu) mem=$(sysctl -n hw.memsize)"

      - name: Mark start time
        id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      # Tier-specific cache key so the 6 vCPU and 12 vCPU runs do not share a
      # warm electron-builder cache and bias the comparison.
      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-mac-6vcpu-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-mac-6vcpu-

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - name: Verify macOS signing environment
        run: node config/scripts/verify-macos-release-env.mjs
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify macOS entitlements
        run: pnpm verify:macos-entitlements

      - name: Mark deps-ready time
        id: deps_ready
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: pnpm build:release
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          ORCA_BUILD_IDENTITY: rc
          ORCA_DIAGNOSTICS_TOKEN_URL: https://www.onorca.dev/diagnostics/token
          ORCA_POSTHOG_WRITE_KEY: ${{ secrets.ORCA_POSTHOG_WRITE_KEY }}

      - name: Mark build-ready time
        id: build_ready
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      # Same packaging path as the release build (hardened runtime + notarize
      # gated on ORCA_MAC_RELEASE=1), but --publish never so nothing uploads.
      - name: Package signed + notarized macOS app (no publish)
        run: node config/scripts/ensure-native-runtime.mjs --runtime=electron && ORCA_MAC_RELEASE=1 pnpm exec electron-builder --config config/electron-builder.config.cjs --mac --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Timing summary
        if: always()
        env:
          T_START: ${{ steps.start.outputs.epoch }}
          T_DEPS: ${{ steps.deps_ready.outputs.epoch }}
          T_BUILD: ${{ steps.build_ready.outputs.epoch }}
        run: |
          now=$(date +%s)
          fmt() { printf '%dm %ds' $(($1 / 60)) $(($1 % 60)); }
          echo "## Blacksmith Mac build timing (6 vCPU)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${T_DEPS:-}" ]; then
            echo "- Setup + install + verify: $(fmt $((T_DEPS - T_START)))" >> "$GITHUB_STEP_SUMMARY"
            echo "TIMING setup_install=$((T_DEPS - T_START))s"
          fi
          if [ -n "${T_DEPS:-}" ] && [ -n "${T_BUILD:-}" ]; then
            echo "- build:release: $(fmt $((T_BUILD - T_DEPS)))" >> "$GITHUB_STEP_SUMMARY"
            echo "TIMING build_release=$((T_BUILD - T_DEPS))s"
          fi
          if [ -n "${T_BUILD:-}" ]; then
            echo "- electron-builder pack + sign + notarize: $(fmt $((now - T_BUILD)))" >> "$GITHUB_STEP_SUMMARY"
            echo "TIMING pack_sign_notarize=$((now - T_BUILD))s"
          fi
          echo "- **Total (checkout->done): $(fmt $((now - T_START)))**" >> "$GITHUB_STEP_SUMMARY"
          echo "TIMING total_work=$((now - T_START))s"

      - name: List built artifacts
        if: always()
        run: ls -lh dist/*.dmg dist/*.zip 2>/dev/null || echo "no dmg/zip artifacts found"
