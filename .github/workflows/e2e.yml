name: Docker SSH frame scheduling diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install headless tools
        run: sudo apt-get update && sudo apt-get install -y build-essential openssh-client python3 ripgrep xvfb zsh openbox x11-utils
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
      - name: Build relay and Electron
        run: |
          pnpm run build:relay
          pnpm exec electron-vite build --mode e2e
      - name: Measure existing freeze oracle distribution
        run: xvfb-run --auto-servernum bash .github/scripts/e2e-with-window-manager.sh env SKIP_BUILD=1 ORCA_E2E_SSH_DOCKER=1 ORCA_E2E_FORWARD_APP_LOGS=1 pnpm exec playwright test --config tests/playwright.config.ts tests/e2e/ssh-docker-bulk-open-freeze-repro.spec.ts --project=electron-headless --workers=1 --repeat-each=3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: freeze-frame-control-traces
          path: test-results/
          retention-days: 3
