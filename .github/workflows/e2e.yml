name: Excluded Docker SSH browser route unit baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ssh-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
      - name: Run original remote-only browser route journeys
        env:
          ORCA_BACKGROUND_LAUNCH: '1'
          ORCA_RUN_DOCKER_SSH_BROWSER_E2E: '1'
        run: node_modules/.bin/vitest run --config config/vitest.config.ts tests/e2e/ssh-browser-network-execution-route.docker.unit.test.ts
