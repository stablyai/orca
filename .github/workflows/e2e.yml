name: Nested SSH pairing and restart validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ssh:
    strategy:
      fail-fast: false
      matrix:
        spec:
          - tests/e2e/nested-runtime-ssh-lifecycle.spec.ts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install headless tools
        run: sudo apt-get update && sudo apt-get install -y build-essential openssh-client python3 ripgrep xvfb zsh openbox x11-utils
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
      - name: Build relay and Electron
        env:
          VITE_EXPOSE_STORE: 'true'
        run: |
          pnpm run build:relay
          pnpm exec electron-vite build --mode e2e
          pnpm run build:web-from-renderer
      - name: Run existing relay performance scenarios
        run: xvfb-run --auto-servernum bash .github/scripts/e2e-with-window-manager.sh env SKIP_BUILD=1 ORCA_E2E_SSH_DOCKER=1 ORCA_E2E_NESTED_RUNTIME_SSH=1 ORCA_E2E_WEB_CLIENT=1 ORCA_E2E_FORWARD_APP_LOGS=1 pnpm exec playwright test --config tests/playwright.config.ts ${{ matrix.spec }} --project=electron-headless --workers=1 --grep 'restores a paired'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nested-click-frames-${{ strategy.job-index }}
          path: test-results/
          retention-days: 3
