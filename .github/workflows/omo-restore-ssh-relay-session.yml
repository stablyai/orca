name: omo-restore-ssh-relay-session
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/omo-native-tui-agent
          sparse-checkout: |
            src/main/ssh/ssh-relay-session.ts
            src/relay/plugin-overlay-files.ts
            .github/workflows/omo-restore-ssh-relay-session.yml
          sparse-checkout-cone-mode: false
      - name: Restore ssh-relay-session.ts from fc27e6f + patch
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/wedreamer/orca/fc27e6f59e4c8415317c1c1f4e0ee92ab0156c3a/src/main/ssh/ssh-relay-session.ts" -o src/main/ssh/ssh-relay-session.ts
          echo "" | base64 -d > /tmp/omo-ssh.patch
          patch -p1 < /tmp/omo-ssh.patch
          grep -q "void omoSessionsDirPromise.then" src/main/ssh/ssh-relay-session.ts
          grep -q "wrapCommand: !isWindowsRemoteHost(hostPlatform)" src/main/ssh/ssh-relay-session.ts
          grep -q "Best-effort: a prefill write failure" src/relay/plugin-overlay-files.ts
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "shubuzuo"
          git config user.email "shubuzuo@gmail.com"
          git add src/main/ssh/ssh-relay-session.ts
          git commit -m "fix(ssh): keep OmO probe off the ready path and soften prefill writes"
          git push origin HEAD:feat/omo-native-tui-agent
      - name: Remove temporary workflow
        if: always()
        run: |
          set -euo pipefail
          git config user.name "shubuzuo"
          git config user.email "shubuzuo@gmail.com"
          git fetch origin feat/omo-native-tui-agent
          git checkout -B feat/omo-native-tui-agent origin/feat/omo-native-tui-agent
          if [ -f .github/workflows/omo-restore-ssh-relay-session.yml ]; then
            git rm -f .github/workflows/omo-restore-ssh-relay-session.yml
            git commit -m "chore: remove temporary omo restore workflow" || exit 0
            git push origin HEAD:feat/omo-native-tui-agent
          fi
