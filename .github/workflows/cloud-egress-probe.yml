name: Cloud Egress Probe

# Release check for sandbox egress, against DEV: placeholders are forwarded for the right hosts with
# other auth headers untouched, credential hosts fail closed, anonymous git works without an App
# token (#758), and the egress proxy swaps a bogus key in for its placeholder. Bogus tokens and
# throwaway echo sandboxes only. Details: cloud/apps/sandbox-control/scripts/README.md
on:
  workflow_dispatch:
    inputs:
      layers:
        description: firewall (Vercel only) or all (also the dev control plane's swap)
        required: false
        default: all
        type: choice
        options: [all, firewall]
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

concurrency:
  group: cloud-egress-probe
  cancel-in-progress: false

defaults:
  run:
    working-directory: cloud

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.ORCA_DEV_VERCEL_TOKEN }}
      DEV_TEST_JWK: ${{ secrets.ORCA_DEV_TEST_JWK }}
      LAYERS: ${{ inputs.layers || 'all' }}
    steps:
      - name: Check the dev credentials are configured
        id: creds
        working-directory: .
        run: |
          if [ -z "$VERCEL_TOKEN" ] || { [ "$LAYERS" = all ] && [ -z "$DEV_TEST_JWK" ]; }; then
            echo "::notice::ORCA_DEV_VERCEL_TOKEN / ORCA_DEV_TEST_JWK are not set: skipping the egress probe"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.creds.outputs.skip != '1'
        uses: actions/checkout@v4

      - if: steps.creds.outputs.skip != '1'
        uses: ./.github/actions/setup-pnpm
        with:
          package-json-file: cloud/package.json

      - if: steps.creds.outputs.skip != '1'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - if: steps.creds.outputs.skip != '1'
        run: pnpm install --frozen-lockfile --filter @orca-cloud/sandbox-control...

      - name: Probe dev egress
        if: steps.creds.outputs.skip != '1'
        run: |
          umask 077
          if [ "$LAYERS" = all ]; then
            printf '%s' "$DEV_TEST_JWK" > "$RUNNER_TEMP/dev-jwk.json"
            export ORCA_PROBE_DEV_JWK_FILE="$RUNNER_TEMP/dev-jwk.json"
          fi
          pnpm --filter @orca-cloud/sandbox-control exec tsx scripts/egress-probe.ts \
            $([ "$LAYERS" = firewall ] && echo --firewall-only) > "$RUNNER_TEMP/egress-probe.json"
          rm -f "$RUNNER_TEMP/dev-jwk.json"

      - uses: actions/upload-artifact@v4
        if: always() && steps.creds.outputs.skip != '1'
        with:
          name: cloud-egress-probe-report
          path: ${{ runner.temp }}/egress-probe.json
          retention-days: 14
