name: PR35787 genuine normal source child
on:
  push:
    branches: ['brennanb2025/pr-35787-ci2-source-20261030']
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  ORCA_BACKGROUND_LAUNCH: '1'
  HUSKY: '1'
jobs:
  source-child:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
      - name: Prepare immutable driver and throwaway homes
        run: |
          node - <<'PREPARE'
          const fs = require('node:fs'), path = require('node:path');
          const temp = process.env.RUNNER_TEMP, home = path.join(temp,'pr35787-ci2-source-home');
          if (fs.existsSync(path.join(process.env.GITHUB_WORKSPACE,'.pr35787-pinned-source-input')) || fs.existsSync(path.join(temp,'pr35787-ci2-immutable-source')) || fs.existsSync(home)) throw Error('owned paths must be new');
          const isolated = {HOME:home,USERPROFILE:home,XDG_CONFIG_HOME:path.join(home,'config'),XDG_DATA_HOME:path.join(home,'data'),XDG_CACHE_HOME:path.join(home,'cache'),XDG_STATE_HOME:path.join(home,'state'),XDG_RUNTIME_DIR:path.join(home,'run'),CLAUDE_CONFIG_DIR:path.join(home,'claude'),CODEX_HOME:path.join(home,'codex'),ORCA_E2E_USER_DATA_DIR:path.join(home,'orca-user'),ORCA_E2E_HOME_DIR:path.join(home,'orca-home'),ORCA_DISABLE_MACOS_LOGIN_SHELL:'1'};
          for (const [key,value] of Object.entries(isolated)) {if(key !== 'ORCA_DISABLE_MACOS_LOGIN_SHELL') fs.mkdirSync(value,{recursive:true});fs.appendFileSync(process.env.GITHUB_ENV,key+'='+value+'\n');}
          fs.writeFileSync(path.join(temp,'pr35787-ci2-source.cjs'),require('node:zlib').gunzipSync(Buffer.from('','base64')));
          PREPARE
      - name: Check out exact immutable source M with complete ancestry
        uses: actions/checkout@v6
        with:
          repository: stablyai/orca
          ref: 'b6185b179a63239b33c8164048eaea1d0e4deb50'
          path: .pr35787-pinned-source-input
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
      - name: Reconstruct only the reviewed pending source patch
        id: reconstruct
        run: node "$RUNNER_TEMP/pr35787-ci2-source.cjs" reconstruct
      - name: Install actual M pinned dependencies and native Node runtime
        id: install
        uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
      - name: Check generator, activate real Husky, normal source commit and export
        id: commit
        run: node "$RUNNER_TEMP/pr35787-ci2-source.cjs" commit
      - name: Preserve complete source and command outcomes on success or failure
        if: always()
        env:
          RECONSTRUCT_OUTCOME: ${{ steps.reconstruct.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: node "$RUNNER_TEMP/pr35787-ci2-source.cjs" snapshot
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr-35787-ci2-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr35787-ci2-source/
          retention-days: 14
          if-no-files-found: error
