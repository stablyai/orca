name: Linux Electron lifecycle

# PR package runs scope these files to changed inputs; main and the daily run keep them unconditional.
on:
  push:
    branches: [main]
  schedule:
    - cron: '20 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-electron-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    name: Linux Electron lifecycle boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron

      # Serialize dual-Electron lifecycle files: four concurrent probes on four vCPUs starve each other past their own deadlines.
      - name: Test Linux Electron lifecycle boundary
        env:
          ORCA_BACKGROUND_LAUNCH: '1'
        run: |
          set -euo pipefail
          mapfile -t FILES < <(node config/scripts/workflow/source-routing/linux-electron-lifecycle-scope.mjs --list)
          xvfb-run --auto-servernum pnpm exec vitest run --config config/vitest.config.ts --no-file-parallelism "${FILES[@]}"
