name: Preflight CLI platforms

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'src/main/ipc/preflight*'
      - 'src/main/ipc/command-path/agent-detection-shell-path.ts'
      - 'src/main/ipc/command-path/command-path-resolver*'
      - 'src/main/preflight/**'
      - 'src/main/startup/*shell*'
      - 'src/packages/process-host/**'
      - '.github/actions/install-node-dependencies/**'
      - '.github/workflows/preflight-cli-platforms.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preflight-cli-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    name: Preflight CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          cache-electron-package: 'true'
      - name: Check native CLI execution and shell PATH discovery
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts --maxWorkers=2
          src/main/ipc/preflight-runnable-local-cli.test.ts
          src/main/ipc/preflight-wsl-agent-detection.test.ts
          src/main/ipc/preflight-windows-path-refresh.repro.test.ts
          src/main/startup/hydrate-shell-path.windows.test.ts
          src/main/startup/login-shell-environment.test.ts
          src/packages/process-host/src/process-tree-termination.test.ts
          src/packages/process-host/src/run-process.test.ts
          src/packages/process-host/src/run-process-termination-failure.test.ts

  relay-holder-diagnostic:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24.22.2'
          native-runtime: node
      - name: Install Electron package binary for tests
        run: node config/scripts/electron-installation/platform-layout/install-electron-package-binary.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
          no-cache: true
      - name: Print runtime and lsof versions
        run: |
          node --version
          lsof -v
      - name: Add ephemeral holder diagnostics
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/main/ssh/legacy-relay/ssh-relay-endpoint-incumbent-shell.integration.test.ts')
          s = p.read_text()
          s = "import { quotePosixShell } from '../../../shared/shell/launch/shell-argument-quoting'\n" + s
          needle = '    expect(incumbent.holders.map((holder) => holder.pid)).toEqual([relay.pid])'
          assert s.count(needle) == 1
          extra = """    console.error('HOLDER_SNAPSHOT', { workerPid: process.pid, parentPid: process.ppid, relayPid: relay.pid, incumbent })
              console.error('HOLDER_RAW_LSOF', await sh('lsof -nP -a -U -- ' + quotePosixShell(sockPath) + ' || true'))
              const diagnosticPids = [...new Set([process.pid, process.ppid, ...incumbent.holders.map((holder) => holder.pid)])].join(',')
              console.error('HOLDER_PROCESSES', await sh('ps -o pid,ppid,args -p ' + diagnosticPids + ' || true'))
              console.error('HOLDER_DESCRIPTORS', await sh('for pid in ' + diagnosticPids.replaceAll(',', ' ') + '; do echo PID=$pid; ls -l /proc/$pid/fd 2>/dev/null; done; true'))
          """
          p.write_text(s.replace(needle, extra + needle))
      - name: Replay balanced shard with holder diagnostics
        env:
          ORCA_BALANCE_UNIT_SHARDS: '1'
          NODE_COMPILE_CACHE: ${{ runner.temp }}/orca-node-compile-cache-${{ github.run_id }}-${{ github.run_attempt }}-24-1
          ORCA_UNIT_PHASE_REPORT: 'ci-shards/unit-phases.json'
        run: |
          export ORCA_SHARD_SOURCE_SHA="$(git rev-parse HEAD)"
          node config/scripts/test-runtime/execution-policy/run-vitest.mjs run --config config/vitest.config.ts --shard=1/12 --maxWorkers=4 --silent=false
      - name: Upload diagnostic shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relay-holder-diagnostic-shard
          path: ci-shards/
