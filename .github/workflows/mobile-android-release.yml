name: Mobile Android Release

# Why a separate workflow from iOS: iOS releases go through App Store review,
# which can take days. Decoupling the triggers lets an Android release ship
# immediately without waiting on iOS, and vice versa.
on:
  push:
    tags:
      - 'mobile-android-v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional exact mobile marketing version assertion, e.g. 0.0.22'
        required: false
        type: string
      publish_github_release:
        description: 'Create or update the mobile-android-v<version> GitHub Release'
        required: false
        default: true
        type: boolean
      shell:
        description: 'Which shell the binary mounts: native screens, or the web page delivered over the air. Default native; `ota` is the only value that changes it.'
        required: false
        default: native
        type: choice
        options:
          - native
          - ota

jobs:
  android-build:
    runs-on: ubuntu-latest

    # Why: the "Create GitHub Release" step below uses the default GITHUB_TOKEN
    # to call `gh release create`, which requires contents:write. Without this,
    # the job builds the APK fine but fails at release time with
    # "HTTP 403: Resource not accessible by integration".
    permissions:
      contents: write

    outputs:
      publish_release: ${{ steps.release.outputs.publish_release }}

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version and version code
        id: release
        env:
          MOBILE_ANDROID_RELEASE_VERSION: ${{ github.event.inputs.release_version }}
          MOBILE_ANDROID_PUBLISH_RELEASE: ${{ github.event.inputs.publish_github_release }}
        run: node scripts/prepare-android-release.mjs

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Build Android release APK
        env:
          # The one build-time constant that decides whether this binary mounts the web page or
          # the native screens. A tag push and a schedule carry no inputs, so both read native.
          EXPO_PUBLIC_MOBILE_SHELL: ${{ inputs.shell || 'native' }}
        run: |
          set -euo pipefail
          echo "Mobile shell: $EXPO_PUBLIC_MOBILE_SHELL"
          cd android && ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: orca-mobile-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk

      - name: Ensure GitHub release tag
        if: steps.release.outputs.publish_release == 'true' && !startsWith(github.ref, 'refs/tags/mobile-android-v')
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists"
            exit 0
          fi

          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

      - name: Create GitHub Release
        if: steps.release.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              android/app/build/outputs/apk/release/*.apk
          else
            # Why: release tags live on side branches, so GitHub's automatic
            # previous-tag detection reaches back several releases; that body
            # already exceeds the 125000-character API limit and grows each
            # release. Pin the comparison base and cap the size.
            notes_file="$RUNNER_TEMP/android-release-notes.md"
            previous_tag="$(
              gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
                | grep '^mobile-android-v' | grep -Fxv "$tag" | sort -V | tail -1 || true
            )"

            if [ -n "$previous_tag" ]; then
              # Why: gh writes the JSON error body to stdout on an HTTP error, so a
              # non-empty file is not proof of success — gate on exit status.
              if ! gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -X POST \
                -f tag_name="$tag" \
                -f target_commitish="$GITHUB_SHA" \
                -f previous_tag_name="$previous_tag" \
                --jq .body > "$notes_file"; then
                : > "$notes_file"
              fi
            fi
            if [ ! -s "$notes_file" ]; then
              printf 'Orca Mobile Android %s\n' "$tag" > "$notes_file"
            fi
            # Why: reuse the desktop release path's character-safe truncation so a
            # multi-byte character cannot be split at the cap.
            NOTES_FILE="$notes_file" \
            NOTES_MODULE="$GITHUB_WORKSPACE/config/scripts/create-draft-release.mjs" \
            node --input-type=module -e '
              const { readFileSync, writeFileSync } = await import("node:fs")
              const { pathToFileURL } = await import("node:url")
              const { truncateReleaseBody } = await import(pathToFileURL(process.env.NOTES_MODULE).href)
              const file = process.env.NOTES_FILE
              writeFileSync(file, truncateReleaseBody(readFileSync(file, "utf8")))
            '

            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Orca Mobile Android $tag" \
              --prerelease \
              --latest=false \
              --notes-file "$notes_file" \
              android/app/build/outputs/apk/release/*.apk
          fi

  # Why: desktop releases own GitHub's releases/latest, so Android needs its own
  # fixed-URL release for README, docs and in-app download links to point at.
  android-latest:
    needs: android-build
    if: needs.android-build.outputs.publish_release == 'true'
    runs-on: ubuntu-latest

    # Why: serialized so each run reads the release list after the previous upload
    # lands; versioned releases stay outside the group and run in parallel.
    concurrency:
      group: mobile-android-latest
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Update rolling latest Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_tag="mobile-android-latest"

          # Why: publish the newest release's APK rather than this run's, so an older
          # re-run or a queued run GitHub dropped can never leave the link stale.
          # Paginated so no Android release is missed behind desktop ones.
          releases="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft | not) | .tag_name'
          )"
          newest_tag="$(printf '%s\n' "$releases" | grep '^mobile-android-v' | sort -V | tail -1 || true)"
          if [ -z "$newest_tag" ]; then
            echo "::error::No published mobile-android-v* release found"
            exit 1
          fi
          echo "Publishing $newest_tag as $latest_tag"

          apk_dir="$RUNNER_TEMP/apk"
          gh release download "$newest_tag" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir "$apk_dir"
          shopt -s nullglob
          apks=("$apk_dir"/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one APK on $newest_tag, found ${#apks[@]}"
            exit 1
          fi
          stable_apk="$RUNNER_TEMP/orca-android.apk"
          cp "${apks[0]}" "$stable_apk"

          # Why: only the APK is kept current; the tag and its source archives stay at first publish.
          notes="Always the newest Orca Mobile Android APK. It is currently [$newest_tag](https://github.com/$GITHUB_REPOSITORY/releases/tag/$newest_tag); use that release for its source and changelog."
          if gh release view "$latest_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Why: --clobber deletes before uploading, which 404s the permanent link for the
            # whole upload (and after a failed one). Stage under another name, then swap.
            staged_apk="$RUNNER_TEMP/orca-android.next.apk"
            cp "$stable_apk" "$staged_apk"
            gh release upload "$latest_tag" --repo "$GITHUB_REPOSITORY" --clobber "$staged_apk"
            asset_id() {
              gh api "repos/$GITHUB_REPOSITORY/releases/tags/$latest_tag" \
                --jq ".assets[] | select(.name == \"$1\") | .id"
            }
            staged_id="$(asset_id orca-android.next.apk)"
            current_id="$(asset_id orca-android.apk)"
            if [ -z "$staged_id" ]; then
              echo "::error::Staged APK is missing from $latest_tag after upload"
              exit 1
            fi
            if [ -n "$current_id" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$current_id"
            fi
            # A failure here leaves only the staged asset; re-running the job completes the swap.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$staged_id" \
              -f name=orca-android.apk --silent
            gh release edit "$latest_tag" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          else
            gh release create "$latest_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Orca Mobile Android (latest)" \
              --prerelease \
              --latest=false \
              --notes "$notes" \
              "$stable_apk"
          fi
