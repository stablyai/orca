name: Mobile Android Release

# Release Android independently so App Store review cannot block its shipping cadence.
# dev.orca.app ships on Google Play and as an APK on GitHub. Play's APKs carry its license check,
# which closes the app where Play is unreachable (mainland China, #42973), so the GitHub APK is our
# own build, signed with the release key instead of Google's app signing key.
on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional exact mobile marketing version assertion, e.g. 0.0.22'
        required: false
        type: string
      publish_github_release:
        description: 'Release to Play internal testing and publish the android-v<version> GitHub pre-release; off only validates the bundle with Play'
        required: false
        default: true
        type: boolean

jobs:
  android-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      GITHUB_APK: android/app/build/outputs/apk/release/app-release.apk
      # The release key's certificate (CN=Orca, O=Stably AI). Every GitHub install pins it.
      GITHUB_APK_CERT_SHA256: '19:68:CC:3A:F4:90:97:24:F7:FA:AC:8D:4E:3C:5E:F9:16:97:AE:FB:69:05:E2:EA:65:0D:19:1B:B3:9F:AD:BC'

    outputs:
      cert_sha256: ${{ env.GITHUB_APK_CERT_SHA256 }}
      publish_release: ${{ steps.release.outputs.publish_release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Play only accepts bundles signed with the upload key, and re-signs them with Google's app signing key.
      - name: Check upload key configuration
        env:
          ORCA_ANDROID_KEYSTORE_BASE64: ${{ secrets.ORCA_ANDROID_KEYSTORE_BASE64 }}
          ORCA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ORCA_ANDROID_KEYSTORE_PASSWORD }}
          ORCA_ANDROID_KEY_ALIAS: ${{ secrets.ORCA_ANDROID_KEY_ALIAS }}
          ORCA_ANDROID_KEY_PASSWORD: ${{ secrets.ORCA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in ORCA_ANDROID_KEYSTORE_BASE64 ORCA_ANDROID_KEYSTORE_PASSWORD ORCA_ANDROID_KEY_ALIAS ORCA_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::The Play upload key is not fully configured. Missing secrets: ${missing[*]}. See the Android Release Signing section of mobile/README.md."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version and version code
        id: release
        env:
          MOBILE_ANDROID_RELEASE_VERSION: ${{ github.event.inputs.release_version }}
          MOBILE_ANDROID_PUBLISH_RELEASE: ${{ github.event.inputs.publish_github_release }}
        run: node scripts/prepare-android-release.mjs

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Decode upload keystore
        env:
          ORCA_ANDROID_KEYSTORE_BASE64: ${{ secrets.ORCA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ORCA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/orca-release.keystore"

      # One run so the AAB and the GitHub APK come from the same compile and the same key.
      - name: Build Play app bundle and GitHub APK
        env:
          ORCA_ANDROID_REQUIRE_RELEASE_SIGNING: 'true'
          ORCA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/orca-release.keystore
          ORCA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ORCA_ANDROID_KEYSTORE_PASSWORD }}
          ORCA_ANDROID_KEY_ALIAS: ${{ secrets.ORCA_ANDROID_KEY_ALIAS }}
          ORCA_ANDROID_KEY_PASSWORD: ${{ secrets.ORCA_ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew bundleRelease assembleRelease

      - name: Remove upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/orca-release.keystore"

      # GitHub installs only take updates signed by the same key, so a swapped or debug key must not ship.
      - name: Verify GitHub APK signing certificate
        run: |
          set -euo pipefail
          expected="${GITHUB_APK_CERT_SHA256//:/}"
          expected="${expected,,}"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          certs="$("$apksigner" verify --print-certs "$GITHUB_APK" | sed -En 's/^(Signer #[0-9]+|V[0-9.]+ Signer):? certificate SHA-256 digest: //p' | sort -u)"
          if [ "$certs" != "$expected" ]; then
            echo "::error::The GitHub APK signing certificate ($certs) is not the Orca release key ($GITHUB_APK_CERT_SHA256)."
            exit 1
          fi
          echo "GitHub APK is signed with the Orca release key $GITHUB_APK_CERT_SHA256"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: orca-mobile-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: orca-mobile-apk
          path: mobile/${{ env.GITHUB_APK }}
          if-no-files-found: error

  # Its own job so a Play outage can be rerun without rebuilding. Play rejects a versionCode it has
  # seen, so a missed versionCode bump fails here, before anything is published.
  play-internal-upload:
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      BUNDLE_FROZEN: 'true'
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_OPT_OUT_USAGE: '1'

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download AAB artifact
        uses: actions/download-artifact@v8
        with:
          name: orca-mobile-aab
          path: mobile/build/play

      - name: Setup Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: mobile

      - name: Write Play service account key
        env:
          ORCA_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.ORCA_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/play-service-account.json"
          printf '%s' "$ORCA_PLAY_SERVICE_ACCOUNT_JSON" > "$key"
          echo "ORCA_PLAY_JSON_KEY_PATH=$key" >> "$GITHUB_ENV"

      # Production promotion stays a manual step in Play Console.
      - name: Upload to the internal testing track
        env:
          VALIDATE_ONLY: ${{ needs.android-build.outputs.publish_release != 'true' }}
        run: bundle exec fastlane android upload_internal aab:"$PWD/build/play/app-release.aab" validate_only:"$VALIDATE_ONLY"

      - name: Remove Play service account key
        if: always()
        run: rm -f "$RUNNER_TEMP/play-service-account.json"

  # After the Play upload, so a versionCode Play rejects fails before anything is published.
  github-release:
    needs: [android-build, play-internal-upload]
    if: needs.android-build.outputs.publish_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Grant contents:write for gh release create; build success alone does not authorize publication.
    permissions:
      contents: write

    env:
      APK: build/github/app-release.apk

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: orca-mobile-apk
          path: mobile/build/github

      # Publish size/digest to distinguish truncated downloads (missing tail signature block) from bad APK builds.
      - name: Checksum the APK
        id: apk
        run: |
          set -euo pipefail
          bytes="$(wc -c < "$APK" | tr -d ' ')"
          sha256="$(sha256sum "$APK" | cut -d ' ' -f 1)"
          # Publish sha256sum -c sidecars, excluded by *.apk globs. Use binary “ *” mode:
          # Git Bash text-mode newline translation can reject a valid APK.
          printf '%s *%s\n' "$sha256" "$(basename "$APK")" > "$APK.sha256"

          {
            echo "checksum=$APK.sha256"
            echo "bytes=$bytes"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"
          echo "APK is $bytes bytes, sha256 $sha256"

      - name: Ensure GitHub release tag
        if: ${{ !startsWith(github.ref, 'refs/tags/android-v') }}
        run: |
          set -euo pipefail
          tag="${{ needs.android-build.outputs.tag }}"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists"
            exit 0
          fi

          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.android-build.outputs.tag }}"
          notes_file="$RUNNER_TEMP/android-release-notes.md"

          # printf rather than a heredoc: YAML block indentation would leak into the Markdown.
          # Both platforms' commands are named because a reader on macOS has no sha256sum.
          signer_line='- Signing certificate SHA-256: `${{ needs.android-build.outputs.cert_sha256 }}`\n'
          verification_section() {
            printf '\n### Verify your download\n\n- Size: `%s` bytes\n- SHA-256: `%s`\n%b\nA "no certificate" or "problem parsing the package" install failure is usually a truncated download — check the size first, then `sha256sum -c app-release.apk.sha256` (`shasum -a 256 -c` on macOS).\n\nThis APK is signed with a different key from the Google Play app and from `android-v0.0.65`. If Android says "App not installed" over one of those, uninstall it first, then pair again.\n' \
              '${{ steps.apk.outputs.bytes }}' '${{ steps.apk.outputs.sha256 }}' "$signer_line"
          }

          # Verification is last; replace from heading to EOF, accepting API-roundtripped CRLFs.
          drop_verification_section() {
            sed '/^### Verify your download\r*$/,$d'
          }

          # Truncate by characters like desktop releases and reserve the appended section inside GitHub’s cap,
          # or --clobber could replace assets before notes fail. wc -c over-reserves multibyte section text safely.
          write_notes_with_verification() {
            NOTES_FILE="$notes_file" \
            NOTES_RESERVE="$(verification_section | wc -c | tr -d ' ')" \
            NOTES_MODULE="$GITHUB_WORKSPACE/config/scripts/release/publication/create-draft-release.mjs" \
            node --input-type=module -e '
              const { readFileSync, writeFileSync } = await import("node:fs")
              const { pathToFileURL } = await import("node:url")
              const { MAX_RELEASE_BODY_LENGTH, truncateReleaseBody } = await import(
                pathToFileURL(process.env.NOTES_MODULE).href
              )
              const file = process.env.NOTES_FILE
              const max = MAX_RELEASE_BODY_LENGTH - Number(process.env.NOTES_RESERVE)
              writeFileSync(file, truncateReleaseBody(readFileSync(file, "utf8"), max))
            '
            verification_section >> "$notes_file"
          }

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "$APK" \
              "${{ steps.apk.outputs.checksum }}"
            # --clobber replaced the APK; rewrite its digest so users cannot compare against obsolete bytes.
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
              | drop_verification_section > "$notes_file"
            write_notes_with_verification
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$notes_file"
          else
            # Side-branch release tags make automatic previous-tag detection span multiple releases and exceed
            # the 125000-character API cap; pin the comparison base and truncate.
            previous_tag="$(
              gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
                | grep '^android-v' | grep -Fxv "$tag" | sort -V | tail -1 || true
            )"

            if [ -n "$previous_tag" ]; then
              # gh writes HTTP error JSON to stdout too; require exit success, not merely a nonempty file.
              if ! gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -X POST \
                -f tag_name="$tag" \
                -f target_commitish="$GITHUB_SHA" \
                -f previous_tag_name="$previous_tag" \
                --jq .body > "$notes_file"; then
                : > "$notes_file"
              fi
            fi
            if [ ! -s "$notes_file" ]; then
              printf 'Orca Mobile Android %s\n' "$tag" > "$notes_file"
            fi
            write_notes_with_verification

            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Orca Mobile Android $tag" \
              --prerelease \
              --latest=false \
              --notes-file "$notes_file" \
              "$APK" \
              "${{ steps.apk.outputs.checksum }}"
          fi

  # Advisory: a failed mirror only leaves the R2 copy of this APK missing.
  release-mirror-r2:
    needs: [android-build, github-release]
    uses: ./.github/workflows/release-mirror-r2.yml
    with:
      tag: ${{ needs.android-build.outputs.tag }}
      assets: app-release.apk
    secrets: inherit
