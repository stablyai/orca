name: Unit transform cache comparison

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-module-cache-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit_plan:
    uses: ./.github/workflows/unit-plan.yml
    with:
      defer_shadow: true

  baseline:
    needs: unit_plan
    uses: ./.github/workflows/unit-tests.yml
    with:
      node_versions: '["24"]'
      runner: ubuntu-24.04-arm
      shards: ${{ needs.unit_plan.outputs.shards }}
      download_selection_plan: false
      artifact_prefix: baseline-unit
      phase_diagnostics: true
      run_relay_integration: false

  producer:
    needs: [unit_plan, baseline]
    uses: ./.github/workflows/unit-tests.yml
    with:
      node_versions: '["24"]'
      runner: ubuntu-24.04-arm
      shards: ${{ needs.unit_plan.outputs.shards }}
      download_selection_plan: false
      artifact_prefix: producer-unit
      module_cache: cold
      module_cache_namespace: ${{ github.run_id }}-${{ github.run_attempt }}
      module_cache_seed: true
      phase_diagnostics: true
      run_relay_integration: false

  warm:
    needs: [unit_plan, producer]
    uses: ./.github/workflows/unit-tests.yml
    with:
      node_versions: '["24"]'
      runner: ubuntu-24.04-arm
      shards: ${{ needs.unit_plan.outputs.shards }}
      download_selection_plan: false
      artifact_prefix: warm-unit
      module_cache: warm
      module_cache_namespace: ${{ github.run_id }}-${{ github.run_attempt }}
      phase_diagnostics: true
      run_relay_integration: false
