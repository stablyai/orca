name: Computer-use task benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  ORCA_BACKGROUND_LAUNCH: '1'
  ORCA_COMPUTER_BENCH_ISOLATED: '1'
jobs:
  linux:
    if: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [electron]
    env:
      ACCESSIBILITY_ENABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox dbus-x11 at-spi2-core python3-gi gir1.2-atspi-2.0 gir1.2-gtk-3.0 python3-tk xdotool xclip x11-xserver-utils libnss3 libgbm1 libasound2t64
      - run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/electron" electron@43.8.1
          node "$RUNNER_TEMP/electron/node_modules/electron/install.js"
      - run: |
          export PROBE_SOURCE="$(git rev-parse HEAD)"
          xvfb-run -a --server-args='-screen 0 1280x1024x24' dbus-run-session -- bash -euc '
            openbox >"$RUNNER_TEMP/openbox.log" 2>&1 &
            /usr/bin/python3 config/benchmarks/computer-use/linux_typing_probe.py --source "$PROBE_SOURCE" --electron "$RUNNER_TEMP/electron/node_modules/electron/dist/electron" --out out/probe
          '
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: input-linux-${{ matrix.target }}
          path: out/probe
  windows:
    if: false
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [fixture, electron]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          npm install --no-save --no-package-lock --prefix "$env:RUNNER_TEMP/electron" electron@43.8.1
          node "$env:RUNNER_TEMP/electron/node_modules/electron/install.js"
      - run: |
          $source = git rev-parse HEAD
          python config/benchmarks/computer-use/input_probe.py --source $source --target "${{ matrix.target }}" --electron "$env:RUNNER_TEMP/electron/node_modules/electron/dist/electron.exe" --out out/probe
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: input-windows-${{ matrix.target }}
          path: out/probe
