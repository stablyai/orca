name: PR35787 genuine conflict-main integration
on:
  push:
    branches: ['brennanb2025/pr-35787-final-merge-conflict-20261030']
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  ORCA_BACKGROUND_LAUNCH: '1'
  HUSKY: '1'
jobs:
  final-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 14
          fetch-tags: false
          persist-credentials: false
      - name: Prepare immutable driver and throwaway homes
        run: |
          node - <<'PREPARE'
          const fs = require('node:fs'), path = require('node:path');
          const temp = process.env.RUNNER_TEMP, home = path.join(temp, 'pr35787-final-merge-home');
          fs.mkdirSync(home, {recursive: true});
          if (fs.existsSync(path.join(process.env.GITHUB_WORKSPACE,'.pr35787-pinned-main-input')) || fs.existsSync(path.join(temp,'pr35787-immutable-main'))) throw Error('owned main-checkout paths must be new');
          const isolated = {HOME:home,USERPROFILE:home,XDG_CONFIG_HOME:path.join(home,'config'),XDG_DATA_HOME:path.join(home,'data'),XDG_CACHE_HOME:path.join(home,'cache'),XDG_STATE_HOME:path.join(home,'state'),XDG_RUNTIME_DIR:path.join(home,'run'),CLAUDE_CONFIG_DIR:path.join(home,'claude'),CODEX_HOME:path.join(home,'codex'),ORCA_E2E_USER_DATA_DIR:path.join(home,'orca-user'),ORCA_E2E_HOME_DIR:path.join(home,'orca-home'),ORCA_DISABLE_MACOS_LOGIN_SHELL:'1'};
          for (const [key,value] of Object.entries(isolated)) {if(key !== 'ORCA_DISABLE_MACOS_LOGIN_SHELL') fs.mkdirSync(value,{recursive:true});fs.appendFileSync(process.env.GITHUB_ENV, key+'='+value+'\n');}
          fs.writeFileSync(path.join(temp,'pr35787-final-merge.cjs'),Buffer.from('','base64'));
          PREPARE
      - name: Check out only the selected immutable conflict main N with complete ancestry
        uses: actions/checkout@v6
        with:
          repository: stablyai/orca
          ref: '527e7082b69c829daf19314f499c1a57e4f0ebe3'
          path: .pr35787-pinned-main-input
          fetch-depth: 31
          fetch-tags: false
          persist-credentials: false
      - name: Import exact objects and reconstruct the reviewed genuine merge
        id: merge
        run: node "$RUNNER_TEMP/pr35787-final-merge.cjs" reconstruct
      - name: Install the merged source's pinned dependencies and Node native runtime
        id: install
        uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
      - name: Run literal merge exception command, commit and export actual M
        id: commit
        run: node "$RUNNER_TEMP/pr35787-final-merge.cjs" commit
      - name: Preserve source bytes, merge state and outcomes even on failure
        if: always()
        env:
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: node "$RUNNER_TEMP/pr35787-final-merge.cjs" snapshot
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr-35787-final-merge-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr35787-final-merge/
          retention-days: 14
          if-no-files-found: error
