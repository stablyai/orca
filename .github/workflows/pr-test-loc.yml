name: PR test LoC

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-test-loc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  loc:
    name: test vs non-test LoC
    # API calls and a small Node script fit the free single-CPU container runner.
    runs-on: ubuntu-slim
    timeout-minutes: 6
    steps:
      - name: Capture actual LoC GET for timing evidence
        if: ${{ github.repository == 'stablyai/orca' && github.event.pull_request.number == 42518 && github.event.pull_request.user.id == 6427696 && github.event.pull_request.head.repo.full_name == 'stablyai/orca' && github.event.pull_request.head.ref == 'devops-pr-perf-section' && contains(github.event.pull_request.body, '<!-- orca-loc-race-arm -->') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRUSTED_REF: ${{ github.event.repository.default_branch }}
          RACE_DIR: ${{ runner.temp }}/pr-loc-timing
        run: |
          set -euo pipefail
          mkdir -p "$RACE_DIR"
          trusted_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TRUSTED_REF" --jq .sha)"
          echo "Trusted source: $trusted_sha"
          for script in pr-test-loc-table.mjs pr-test-loc-summary.mjs; do
            gh api "repos/$GITHUB_REPOSITORY/contents/.github/scripts/$script?ref=$trusted_sha" \
              --jq .content | base64 --decode > "$RACE_DIR/$script"
          done
          cat > "$RACE_DIR/pr-loc-race-probe.mjs" <<'NODE'
          import { appendFileSync, existsSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          import { updatePullRequest, listPullFiles } from './pr-test-loc-summary.mjs'
          import { sumChangedFiles } from './pr-test-loc-table.mjs'
          const directory = process.env.RACE_DIR
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/')
          const pullNumber = Number(process.env.PR_NUMBER)
          const token = process.env.GITHUB_TOKEN
          if (owner !== 'stablyai' || repo !== 'orca' || pullNumber !== 42518) throw new Error('Unexpected target')
          const record = (phase, extra = {}) => {
            const row = { phase, at: new Date().toISOString(), ...extra }
            appendFileSync(join(directory, 'events.jsonl'), JSON.stringify(row) + '\n')
            console.log(JSON.stringify(row))
          }
          const pause = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds))
          let code = 1
          try {
            const totals = sumChangedFiles(await listPullFiles({ owner, repo, pullNumber, token }))
            await updatePullRequest({ owner, repo, pullNumber, token, totals, fetchImpl: async (url, options) => {
              if (new URL(url).pathname !== '/repos/stablyai/orca/pulls/42518') throw new Error('Unexpected URL')
              const method = options.method ?? 'GET'
              if (method === 'PATCH') record('stale-patch-request', { body: JSON.parse(options.body).body })
              const response = await fetch(url, options)
              if (method === 'GET') {
                if (!response.ok) throw new Error('GET failed: ' + response.status)
                const snapshot = await response.clone().json()
                if (!snapshot.body.includes('<!-- orca-loc-race-arm -->') || snapshot.body.includes('<!-- orca-loc-race-release -->')) throw new Error('Unarmed body')
                record('real-get-returned', { body: snapshot.body, updatedAt: snapshot.updated_at })
                writeFileSync(join(directory, 'get-ready'), 'ready')
                const deadline = Date.now() + 180000
                while (!existsSync(join(directory, 'release'))) {
                  if (Date.now() > deadline) throw new Error('Release deadline exceeded')
                  await pause(200)
                }
                record('release-observed')
              } else {
                const result = await response.clone().json().catch(() => ({}))
                record('stale-patch-response', { status: response.status, body: result.body, updatedAt: result.updated_at })
              }
              return response
            } })
            code = 0
          } catch (error) {
            record('probe-error', { error: String(error) })
          } finally {
            writeFileSync(join(directory, 'done.json'), JSON.stringify({ code }))
            process.exitCode = code
          }
          NODE
          node "$RACE_DIR/pr-loc-race-probe.mjs" > "$RACE_DIR/probe.log" 2>&1 &
          for _ in {1..45}; do
            if [ -f "$RACE_DIR/get-ready" ]; then
              cat "$RACE_DIR/probe.log"
              exit 0
            fi
            if [ -f "$RACE_DIR/done.json" ]; then
              cat "$RACE_DIR/probe.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RACE_DIR/probe.log"
          exit 1
      - name: Hold GET snapshot for edited answer
        if: ${{ github.repository == 'stablyai/orca' && github.event.pull_request.number == 42518 && github.event.pull_request.user.id == 6427696 && github.event.pull_request.head.repo.full_name == 'stablyai/orca' && github.event.pull_request.head.ref == 'devops-pr-perf-section' && contains(github.event.pull_request.body, '<!-- orca-loc-race-arm -->') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RACE_DIR: ${{ runner.temp }}/pr-loc-timing
        run: |
          set -euo pipefail
          for _ in {1..75}; do
            if gh api repos/stablyai/orca/pulls/42518 --jq '.body | contains("<!-- orca-loc-race-release -->")' | grep -qx true; then
              touch "$RACE_DIR/release"
              exit 0
            fi
            sleep 2
          done
          cat "$RACE_DIR/probe.log"
          exit 1
      - name: Record stale PATCH result
        if: ${{ always() && (github.repository == 'stablyai/orca' && github.event.pull_request.number == 42518 && github.event.pull_request.user.id == 6427696 && github.event.pull_request.head.repo.full_name == 'stablyai/orca' && github.event.pull_request.head.ref == 'devops-pr-perf-section' && contains(github.event.pull_request.body, '<!-- orca-loc-race-arm -->')) }}
        env:
          RACE_DIR: ${{ runner.temp }}/pr-loc-timing
        run: |
          for _ in {1..30}; do
            if [ -f "$RACE_DIR/done.json" ]; then
              cat "$RACE_DIR/probe.log"
              node -e 'process.exit(JSON.parse(require("node:fs").readFileSync(process.env.RACE_DIR + "/done.json", "utf8")).code)'
              exit "$?"
            fi
            sleep 1
          done
          cat "$RACE_DIR/probe.log"
          exit 1
      # Read file counts through API without checkout; execute only default-branch scripts because GITHUB_TOKEN has write scope. PR edits take effect after merge.
      - name: Count test vs non-test LoC
        if: ${{ !(github.repository == 'stablyai/orca' && github.event.pull_request.number == 42518 && github.event.pull_request.user.id == 6427696 && github.event.pull_request.head.repo.full_name == 'stablyai/orca' && github.event.pull_request.head.ref == 'devops-pr-perf-section' && contains(github.event.pull_request.body, '<!-- orca-loc-race-arm -->')) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRUSTED_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          for script in pr-test-loc-table.mjs pr-test-loc-summary.mjs; do
            gh api "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/${script}?ref=${TRUSTED_REF}" \
              --jq .content | base64 --decode > "$RUNNER_TEMP/${script}"
          done
          node "$RUNNER_TEMP/pr-test-loc-summary.mjs" --update-pr "$PR_NUMBER"
