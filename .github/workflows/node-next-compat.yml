name: Node next compatibility

on:
  schedule:
    # Full future-runtime coverage is useful, but not worth doubling every PR matrix.
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: node-next-compat
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/unit-tests.yml
    with:
      node_versions: '["26"]'
