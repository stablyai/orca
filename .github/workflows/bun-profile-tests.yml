name: Bun profile persistence

on:
  pull_request:
    paths:
      - 'src/**'
      - 'config/**'
      - 'native/**'
      - 'tests/**'
      - 'resources/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - '.npmrc'
      - '.pnpmfile.cjs'
      - '.github/actions/install-node-dependencies/**'
      - '.github/workflows/bun-profile-tests.yml'
      - '.github/workflows/windows-watcher-artifacts.yml'
      - '.github/actions/load-windows-watcher-artifacts/**'
  workflow_dispatch:
    inputs:
      signed_mac_package:
        description: Sign, notarize and test macOS packages without publishing a release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bun-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.scope.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - name: Detect Bun build and test inputs
        id: scope
        shell: bash
        run: |
          # Compare the tested merge with its base, retaining both sides of renames.
          if git diff --name-only --no-renames -z HEAD^1 HEAD > "$RUNNER_TEMP/bun-changes"; then
            node config/scripts/bun-profile-change-scope.mjs "$RUNNER_TEMP/bun-changes"
          else
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
          fi

  windows_watcher:
    permissions:
      contents: read
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.should_run != 'false' }}
    uses: ./.github/workflows/windows-watcher-artifacts.yml

  persistence:
    needs: [changes, windows_watcher]
    # Missing/failed detection runs the full matrix; manual runs remain unconditional.
    if: ${{ !cancelled() && needs.changes.outputs.should_run != 'false' && needs.windows_watcher.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/load-windows-watcher-artifacts
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: ${{ runner.os == 'Windows' && 'node' || 'none' }}
      # build:orcad reuses the host addon validated by native-runtime preparation.
      - run: pnpm build:orcad
      - run: pnpm test:bun:profile --artifact
      - name: Verify packaged headless companion operations
        run: node node_modules/vitest/vitest.mjs run --config config/vitest.config.ts config/scripts/orcad-companion-artifacts.test.mjs

  owned_companions:
    needs: [changes, windows_watcher]
    if: ${{ !cancelled() && needs.changes.outputs.should_run != 'false' && needs.windows_watcher.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/load-windows-watcher-artifacts
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: ${{ runner.os == 'Windows' && 'node' || 'none' }}
      - name: Verify bundled CLI and companion process boundaries
        run: node config/scripts/run-bundled-runtime-tests.mjs

  cpu_emulator:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.should_run != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # QEMU 4.2 crashes in Bun's module loader even with JIT disabled and AVX enabled.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user-static
      - uses: actions/upload-artifact@v7
        with:
          name: bun-cpu-emulator
          path: /usr/bin/qemu-x86_64-static
          if-no-files-found: error
          retention-days: 1

  linux_glibc_floor:
    needs: [changes, cpu_emulator]
    # Missing/failed detection runs the full matrix; manual runs remain unconditional.
    if: ${{ !cancelled() && needs.changes.outputs.should_run != 'false' && needs.cpu_emulator.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    container: ubuntu:20.04
    timeout-minutes: 20
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - name: Install Ubuntu 20.04 prerequisites
        run: apt-get update && apt-get install -y build-essential ca-certificates git python3 unzip
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        if: runner.arch == 'X64'
        with:
          name: bun-cpu-emulator
          path: .build/cpu-emulator
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/install-node-dependencies
      - run: pnpm build:orcad
      - name: Verify pinned Bun without AVX or AVX2
        if: runner.arch == 'X64'
        run: |
          chmod +x .build/cpu-emulator/qemu-x86_64-static
          .build/cpu-emulator/qemu-x86_64-static --version
          timeout 120 .build/cpu-emulator/qemu-x86_64-static -cpu Nehalem out/orcad/bun-runtime config/scripts/bun-cpu-baseline-smoke.mjs
      - run: pnpm test:bun:profile --artifact
      - name: Verify packaged headless companion operations
        run: node node_modules/vitest/vitest.mjs run --config config/vitest.config.ts config/scripts/orcad-companion-artifacts.test.mjs

  linux_musl:
    needs: changes
    # Missing/failed detection runs the full matrix; manual runs remain unconditional.
    if: ${{ !cancelled() && needs.changes.outputs.should_run != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify native Alpine artifact and persistence
        run: |
          docker run --rm --init -i \
            -e ORCA_BACKGROUND_LAUNCH=1 \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            node:24-alpine3.23 sh -s <<'BUN_QUALIFICATION'
          set -eu
          apk add --no-cache bash git libstdc++ python3 make g++
          git config --global --add safe.directory /work
          npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build:orcad
          if [ "$(uname -m)" = x86_64 ]; then
            apk add --no-cache qemu-x86_64
            timeout 120 qemu-x86_64 -cpu Nehalem out/orcad/bun-runtime config/scripts/bun-cpu-baseline-smoke.mjs
          fi
          pnpm test:bun:profile --artifact
          node node_modules/vitest/vitest.mjs run --config config/vitest.config.ts config/scripts/orcad-companion-artifacts.test.mjs
          BUN_QUALIFICATION

  signed_mac_package:
    needs: windows_watcher
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.signed_mac_package && github.repository == 'stablyai/orca' && startsWith(github.ref, 'refs/heads/') && needs.windows_watcher.result == 'success' }}
    environment: adhoc-mac-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - uses: ./.github/actions/load-windows-watcher-artifacts
      - run: pnpm install:release
      - uses: ./.github/actions/install-mobile-dependencies
      - run: pnpm build:release
      - name: Sign and notarize without release publication
        env:
          ORCA_MAC_RELEASE: '1'
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node config/scripts/verify-macos-release-env.mjs
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          pnpm exec electron-builder --config config/electron-builder.config.cjs --mac zip --"$PACKAGE_ARCH" --publish never
      - name: Verify and exercise the distributed signed package
        run: |
          set -euo pipefail
          archives=(dist/*.zip)
          test "${#archives[@]}" -eq 1
          app="$RUNNER_TEMP/bun-signed-package/Orca.app"
          ditto -x -k "${archives[0]}" "$RUNNER_TEMP/bun-signed-package"
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose "$app"
          "$app/Contents/Resources/bin/orca" --help
          node config/scripts/runtime-serve-terminal-smoke.mjs --packaged-app-dir="$app" --restart
          node config/scripts/runtime-serve-terminal-smoke.mjs --packaged-app-dir="$app" --restart --folder
      - uses: actions/upload-artifact@v7
        with:
          name: bun-signed-mac-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
