# Rehearse #7785 inner-PE/uninstaller signing then rebuilt installer signing without publication. SignPath cannot deep-sign NSIS; captured uninstaller shares first request. Manual test-signing auto-approves; release-signing needs production review. Proven runs 28987534795/28988432001.
name: Windows signing rehearsal

on:
  workflow_dispatch:
    inputs:
      signing-policy-slug:
        description: SignPath signing policy
        type: choice
        default: test-signing
        options:
          - test-signing
          - release-signing
      inner-artifact-configuration-slug:
        description: SignPath artifact configuration for the inner-binaries zip
        type: string
        default: windows-inner-binaries-zip

jobs:
  # Ship the same qualified template as release-cut so the reseal over SignPath-rewritten binaries is rehearsed too.
  orcad-template:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/qualified-orcad-template.yml
    with:
      ref: ${{ github.sha }}
      # SignPath origin verification covers reusable-workflow jobs, so they stay GitHub-hosted.
      fast_runners: false

  rehearse:
    needs: orcad-template
    # Why: SignPath origin verification requires GitHub-hosted runners, and
    # windows-2022 matches the real release job's build environment.
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    env:
      ORCA_REQUIRE_ORCAD_TEMPLATE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Why: nothing here pushes; keep the token out of .git/config.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      # Electron and builder releases fix what this downloads; the lockfile churns far more often.
      - name: Resolve electron-builder download versions
        id: eb-versions
        shell: bash
        run: node -p "const d = require('./package.json').devDependencies; 'versions=electron' + d.electron + '-builder' + d['electron-builder']" >> "$GITHUB_OUTPUT"

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ steps.eb-versions.outputs.versions }}
          restore-keys: |
            electron-builder-win-

      # Why host-only: this job packages only for its own runner OS and
      # architecture, so the default host-scoped install is deliberate.
      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      # Why here: electron-builder's beforePack requires out/mobile-web, and the bundle
      # build resolves React Native and Expo from mobile/node_modules.
      - uses: ./.github/actions/install-mobile-dependencies

      # Why: rehearsal builds are never published, so the official-build
      # secrets (telemetry key, diagnostics URL) are intentionally omitted.
      - name: Build app
        run: pnpm build:release
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # After the app build so nothing that cleans out/ can drop it; electron-builder ships it.
      - name: Download the orcad deployment template
        uses: actions/download-artifact@v8
        with:
          name: orcad-template
          path: out/orcad-template

      # Build full --win: --dir never creates the NSIS uninstaller needed for MDE evidence.
      - name: Package Windows app and export the NSIS uninstaller
        shell: pwsh
        env:
          # Keep capture under runner.temp; all-negation files would include checkout leftovers in app.asar.
          ORCA_WIN_UNINSTALLER_EXPORT_PATH: ${{ runner.temp }}\uninstaller-signing\unsigned\orca-uninstaller.exe
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/win-unpacked/Orca.exe')) {
            throw 'electron-builder --win did not produce dist/win-unpacked/Orca.exe'
          }
          if (-not (Test-Path -LiteralPath $env:ORCA_WIN_UNINSTALLER_EXPORT_PATH)) {
            throw "The sign hook did not export the NSIS uninstaller to $env:ORCA_WIN_UNINSTALLER_EXPORT_PATH"
          }

      # Sign only unsigned PE files; retain vendor signatures such as Microsoft OpenConsole.
      - name: Stage unsigned PE files for inner signing
        id: stage-inner
        shell: pwsh
        run: |
          $root = Resolve-Path 'dist/win-unpacked'
          $stage = New-Item -ItemType Directory -Force -Path 'signing-stage'
          $list = New-Object System.Collections.Generic.List[string]
          $skipped = New-Object System.Collections.Generic.List[string]

          Get-ChildItem -Path $root -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.dll', '.node' } |
            ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath($root, $_.FullName)
              # The orcad template's Linux/macOS addons are data for SSH hosts, not PE files.
              if ($relative -match '^resources[\\/]orcad-template[\\/]targets[\\/](?!win32-)') {
                $skipped.Add("$relative  <non-Windows orcad template payload>")
                return
              }
              $signature = Get-AuthenticodeSignature -FilePath $_.FullName
              if ($signature.Status -eq 'Valid') {
                $skipped.Add("$relative  <already signed: $($signature.SignerCertificate.Subject)>")
                return
              }
              $destination = Join-Path $stage.FullName $relative
              New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
              Copy-Item -Path $_.FullName -Destination $destination -Force
              $list.Add($relative)
            }

          if (-not ($list -contains 'Orca.exe')) {
            throw 'Orca.exe was not staged for signing; unpacked layout changed?'
          }
          if (-not ($list | Where-Object { $_ -like '*conpty_console_list.node' })) {
            throw 'node-pty conpty_console_list.node was not staged; this is the file from issue #7785.'
          }

          Set-Content -Path 'inner-signing-list.txt' -Value ($list -join "`n")
          Write-Host "Staged $($list.Count) unsigned PE files for signing:"
          $list | ForEach-Object { Write-Host "  $_" }
          Write-Host "Skipped $($skipped.Count) already-signed files:"
          $skipped | ForEach-Object { Write-Host "  $_" }

          # The uninstaller is re-injected by the sign hook, outside win-unpacked’s copy-back list.
          # Fail staging loudly: rehearsal proves the flow and needs no release-job recovery catch.
          $exportedUninstaller = Join-Path $env:RUNNER_TEMP 'uninstaller-signing\unsigned\orca-uninstaller.exe'
          $uninstallerStagePath = Join-Path $stage.FullName 'uninstaller\orca-uninstaller.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path $uninstallerStagePath) | Out-Null
          Copy-Item -LiteralPath $exportedUninstaller -Destination $uninstallerStagePath -Force
          Write-Host 'Staged the NSIS uninstaller for signing: uninstaller\orca-uninstaller.exe'

      - name: Upload unsigned inner binaries for SignPath
        id: upload-unsigned-inner
        uses: actions/upload-artifact@v7
        with:
          name: orca-windows-inner-unsigned-${{ github.run_id }}
          path: signing-stage/**
          if-no-files-found: error

      - name: Install SignPath PowerShell module
        uses: ./.github/actions/install-signpath-module

      - name: Submit inner binaries signing request
        id: submit-inner-signing
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: c37aa192-a27a-4377-9c90-5d6c95912dc0
          project-slug: orca
          signing-policy-slug: ${{ inputs.signing-policy-slug || 'test-signing' }}
          artifact-configuration-slug: ${{ inputs.inner-artifact-configuration-slug || 'windows-inner-binaries-zip' }}
          github-artifact-id: ${{ steps.upload-unsigned-inner.outputs.artifact-id }}
          wait-for-completion: false

      - name: Download signed inner binaries from SignPath
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_REQUEST_ID: ${{ steps.submit-inner-signing.outputs.signing-request-id }}
        run: |
          Get-SignedArtifact `
            -ApiToken $env:SIGNPATH_API_TOKEN `
            -OrganizationId 'c37aa192-a27a-4377-9c90-5d6c95912dc0' `
            -SigningRequestId $env:SIGNPATH_REQUEST_ID `
            -OutputArtifactPath signed-inner.zip `
            -Force `
            -WaitForCompletionTimeoutInSeconds 3600
          New-Item -ItemType Directory -Path signed-inner -Force
          Expand-Archive -Path signed-inner.zip -DestinationPath signed-inner -Force

      # Copy back strictly by staged list so mismatches fail instead of shipping mixed signing.
      - name: Restore signed inner binaries into unpacked app
        shell: pwsh
        env:
          SIGNING_POLICY: ${{ inputs.signing-policy-slug || 'test-signing' }}
        run: |
          $requireValid = $env:SIGNING_POLICY -ne 'test-signing'
          $root = Resolve-Path 'dist/win-unpacked'
          $failures = New-Object System.Collections.Generic.List[string]
          foreach ($relative in Get-Content 'inner-signing-list.txt') {
            $candidates = @(
              (Join-Path 'signed-inner' $relative),
              (Join-Path 'signed-inner/signing-stage' $relative)
            ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }
            if (@($candidates).Count -ne 1) {
              $failures.Add("missing or ambiguous signed artifact path: $relative")
              continue
            }
            $signed = Get-Item -LiteralPath @($candidates)[0]
            $signature = Get-AuthenticodeSignature -FilePath $signed.FullName
            if ($null -eq $signature.SignerCertificate -or ($requireValid -and ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*CN=SignPath Foundation*'))) {
              $failures.Add("returned without a valid SignPath signature: $relative")
              continue
            }
            Copy-Item -Path $signed.FullName -Destination (Join-Path $root $relative) -Force
            Write-Host ("{0,-14} {1}  <{2}>" -f $signature.Status, $relative, $signature.SignerCertificate.Subject)
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Host "::error::$_" }
            throw "Signed inner artifact did not round-trip cleanly ($($failures.Count) failures)."
          }

      # Recompute template checksums over the signed bytes, then verify the template as release-cut does.
      - name: Reseal the orcad template over its signed binaries
        run: node config/scripts/packaged-orcad-template.cjs --reseal-signed dist/win-unpacked inner-signing-list.txt

      - name: Restore signed uninstaller for the installer rebuild
        shell: pwsh
        env:
          SIGNING_POLICY: ${{ inputs.signing-policy-slug || 'test-signing' }}
        run: |
          $requireValid = $env:SIGNING_POLICY -ne 'test-signing'
          $candidates = @(
            (Join-Path 'signed-inner' 'uninstaller\orca-uninstaller.exe'),
            (Join-Path 'signed-inner/signing-stage' 'uninstaller\orca-uninstaller.exe')
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }
          if (@($candidates).Count -ne 1) {
            throw 'Missing or ambiguous uninstaller/orca-uninstaller.exe in the signed artifact; check the windows-inner-binaries-zip configuration.'
          }
          $signed = Get-Item -LiteralPath @($candidates)[0]
          $signature = Get-AuthenticodeSignature -FilePath $signed.FullName
          if ($null -eq $signature.SignerCertificate -or ($requireValid -and ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*CN=SignPath Foundation*'))) {
            throw 'The returned NSIS uninstaller carries no valid SignPath signature.'
          }
          $signedDir = Join-Path $env:RUNNER_TEMP 'uninstaller-signing\signed'
          New-Item -ItemType Directory -Force -Path $signedDir | Out-Null
          Copy-Item -LiteralPath $signed.FullName -Destination (Join-Path $signedDir 'orca-uninstaller.exe') -Force
          Write-Host ("{0,-14} uninstaller  <{1}>" -f $signature.Status, $signature.SignerCertificate.Subject)

      - name: Build NSIS installer from signed unpacked app
        shell: pwsh
        env:
          ORCA_WIN_UNINSTALLER_SIGNED_PATH: ${{ runner.temp }}\uninstaller-signing\signed\orca-uninstaller.exe
        run: |
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never --prepackaged "$env:GITHUB_WORKSPACE\dist\win-unpacked"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/orca-windows-setup.exe')) {
            throw 'electron-builder --prepackaged did not produce dist/orca-windows-setup.exe'
          }

      - name: Upload unsigned Windows installer for SignPath
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          name: orca-windows-installer-unsigned-${{ github.run_id }}
          path: dist/orca-windows-setup.exe
          compression-level: 0
          if-no-files-found: error

      - name: Submit Windows installer signing request
        id: submit-installer-signing
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: c37aa192-a27a-4377-9c90-5d6c95912dc0
          project-slug: orca
          signing-policy-slug: ${{ inputs.signing-policy-slug || 'test-signing' }}
          artifact-configuration-slug: github-actions-windows-installer
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: false

      - name: Download signed Windows installer from SignPath
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_REQUEST_ID: ${{ steps.submit-installer-signing.outputs.signing-request-id }}
        run: |
          Get-SignedArtifact `
            -ApiToken $env:SIGNPATH_API_TOKEN `
            -OrganizationId 'c37aa192-a27a-4377-9c90-5d6c95912dc0' `
            -SigningRequestId $env:SIGNPATH_REQUEST_ID `
            -OutputArtifactPath signed-windows.zip `
            -Force `
            -WaitForCompletionTimeoutInSeconds 14400
          New-Item -ItemType Directory -Path signed-windows -Force
          Expand-Archive -Path signed-windows.zip -DestinationPath signed-windows -Force

      # Why: signing changes installer bytes, so the updater metadata must be
      # regenerated exactly like the release job's staging step does.
      - name: Stage signed Windows installer and regenerate updater metadata
        shell: pwsh
        run: |
          $signedInstaller = Get-ChildItem -Path signed-windows -Recurse -File -Filter 'orca-windows-setup.exe' | Select-Object -First 1
          if ($null -eq $signedInstaller) {
            throw 'Signed Windows installer was not returned by SignPath.'
          }
          Copy-Item -Path $signedInstaller.FullName -Destination 'dist/orca-windows-setup.exe' -Force
          node config/scripts/generate-windows-blockmap.mjs 'dist/orca-windows-setup.exe' 'dist/orca-windows-setup.exe.blockmap'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $installer = Get-Item 'dist/orca-windows-setup.exe'
          $blockmap = Get-Item 'dist/orca-windows-setup.exe.blockmap'
          $stream = [System.IO.File]::OpenRead($installer.FullName)
          try {
            $sha512 = [System.Security.Cryptography.SHA512]::Create()
            $hash = [Convert]::ToBase64String($sha512.ComputeHash($stream))
          } finally {
            if ($null -ne $sha512) { $sha512.Dispose() }
            $stream.Dispose()
          }
          $latestYml = Get-Content -Path 'dist/latest.yml' -Raw
          $latestYml = [regex]::Replace($latestYml, '(?m)^(\s*)sha512: .+$', {
            param($match)
            "$($match.Groups[1].Value)sha512: $hash"
          })
          $latestYml = $latestYml -replace '(?m)^    size: \d+$', "    size: $($installer.Length)"
          $latestYml = $latestYml -replace '(?m)^    blockMapSize: \d+$', "    blockMapSize: $($blockmap.Length)"
          Set-Content -Path 'dist/latest.yml' -Value $latestYml -NoNewline

      # Use production evidence gate (#7170); require trusted Status=Valid only for release signing, signature presence for test certs.
      - name: Verify signatures end to end
        shell: pwsh
        env:
          SIGNING_POLICY: ${{ inputs.signing-policy-slug || 'test-signing' }}
        run: |
          $report = New-Object System.Collections.Generic.List[string]
          $failures = New-Object System.Collections.Generic.List[string]
          $advisories = New-Object System.Collections.Generic.List[string]
          $requireValid = $env:SIGNING_POLICY -eq 'release-signing'

          # Advisory is only for resources\elevate.exe; all other signing failures must fail this rehearsal.
          function Test-Signature([string]$label, [string]$path, [switch]$Advisory) {
            $signature = Get-AuthenticodeSignature -FilePath $path
            $subject = if ($null -eq $signature.SignerCertificate) { '<none>' } else { $signature.SignerCertificate.Subject }
            $line = "{0,-14} {1}  <{2}>" -f $signature.Status, $label, $subject
            $script:report.Add($line)
            Write-Host $line
            $problem = $null
            if ($null -eq $signature.SignerCertificate -or $signature.Status -eq 'NotSigned') {
              $problem = "unsigned: $label"
            } elseif ($script:requireValid -and $signature.Status -ne 'Valid') {
              $problem = "not Valid under release-signing: $label ($($signature.Status))"
            } elseif ($script:requireValid -and $subject -notlike '*CN=SignPath Foundation*') {
              $problem = "unexpected signer: $label ($subject)"
            }
            if ($null -eq $problem) { return }
            if ($Advisory) {
              $script:advisories.Add($problem)
              Write-Host "::warning::$problem - known pre-existing issue, not failing the rehearsal"
            } else {
              $script:failures.Add($problem)
            }
          }

          Test-Signature 'installer: orca-windows-setup.exe' 'dist/orca-windows-setup.exe'

          # Extract/verify shipped bytes, including #7785. Builder 26.9+ removed bundled 7zip-bin (#6487).
          $7zaOutput = node config/scripts/resolve-7za-path.mjs
          $7zaExitCode = $LASTEXITCODE
          if ($7zaExitCode -ne 0) {
            throw "The 7za resolver exited with code $7zaExitCode for the signing rehearsal."
          }
          $7za = ($7zaOutput | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($7za) -or -not (Test-Path -LiteralPath $7za -PathType Leaf)) {
            throw "The 7za resolver returned an invalid path for the signing rehearsal: $7za"
          }
          New-Item -ItemType Directory -Path extracted-app -Force | Out-Null
          & $7za x 'dist/orca-windows-setup.exe' '-oextracted-app' -y | Out-Null

          $root = Resolve-Path 'extracted-app'
          # The receipt proves import, not NSIS embedding: the uninstaller lies outside the app 7z payload.
          # Unlike publishing release jobs, rehearsal can install silently and inspect the actual MDE-flagged file.
          $signedUninstaller = Join-Path $env:RUNNER_TEMP 'uninstaller-signing\signed\orca-uninstaller.exe'
          $receipt = "$signedUninstaller.embedded-sha256"
          if (-not (Test-Path -LiteralPath $receipt)) {
            $failures.Add('the sign hook did not embed the signed uninstaller into the rebuilt installer')
          } else {
            Test-Signature 'relayed: orca-uninstaller.exe' $signedUninstaller
          }

          # Try full 7z.exe’s NSIS handler non-invasively first; reduced 7za lacks it. Fall back to a real silent install.
          $installedUninstaller = $null
          $installedVia = $null
          $expectedDigest = if (Test-Path -LiteralPath $receipt) { (Get-Content -LiteralPath $receipt -Raw).Trim() } else { $null }
          $full7z = 'C:\Program Files\7-Zip\7z.exe'
          if (Test-Path -LiteralPath $full7z) {
            New-Item -ItemType Directory -Path nsis-extract -Force | Out-Null
            & $full7z x -tnsis 'dist/orca-windows-setup.exe' '-onsis-extract' -y 2>&1 | Out-Null
            $installedUninstaller = Get-ChildItem -Path nsis-extract -Recurse -File -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue |
              Select-Object -First 1
            # NSIS extraction can be partial/garbled: trust 7z only when its digest matches embedded bytes,
            # otherwise use ground-truth installation. Missing/misnamed entries also fall through.
            if ($null -ne $installedUninstaller -and $null -ne $expectedDigest -and
                (Get-FileHash -LiteralPath $installedUninstaller.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedDigest) {
              Write-Host "7-Zip's NSIS output did not match the relayed digest; falling back to a silent install."
              $installedUninstaller = $null
            }
            if ($null -ne $installedUninstaller) {
              $installedVia = "7-Zip's NSIS handler"
              Write-Host "Read the embedded uninstaller with 7-Zip's NSIS handler: $($installedUninstaller.FullName)"
            } else {
              Write-Host "7-Zip's NSIS handler did not yield a usable uninstaller; falling back to a silent install."
            }
          }

          if ($null -eq $installedUninstaller) {
            # No artifacts are published, so installation is safe here. Bound -PassThru waits; -Wait could hang on a prompt for 360 minutes.
            $installerProcess = Start-Process -FilePath (Resolve-Path 'dist/orca-windows-setup.exe') -ArgumentList '/S' -PassThru
            if (-not $installerProcess.WaitForExit(300000)) {
              $installerProcess | Stop-Process -Force -ErrorAction SilentlyContinue
              $failures.Add('the silent install did not exit within 5 minutes; it is likely prompting')
            }
            # Poll app shutdown: oneClick can launch Orca after installer exit, leaving app/daemon handles in LOCALAPPDATA\Programs.
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              $running = @(Get-Process -Name 'Orca' -ErrorAction SilentlyContinue)
              if ($running.Count -gt 0) {
                $running | Stop-Process -Force -ErrorAction SilentlyContinue
                break
              }
              Start-Sleep -Milliseconds 500
            }
            Get-Process -Name 'orca-terminal-daemon' -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            $installedUninstaller = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Recurse -File -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like '*Orca*' } |
              Select-Object -First 1
            if ($null -ne $installedUninstaller) { $installedVia = 'a silent install' }
          }

          if ($null -eq $installedUninstaller) {
            $failures.Add('could not obtain the uninstaller the installer ships; neither 7-Zip nor a silent install produced it')
          } else {
            # Hash NSIS-written bytes to prove the installer embedded SignPath-signed input; the release hook’s
            # input-to-input comparison cannot prove this. The 7z route already requires digest equality.
            if ($null -ne $expectedDigest) {
              $shippedDigest = (Get-FileHash -LiteralPath $installedUninstaller.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($shippedDigest -ne $expectedDigest) {
                $failures.Add("the uninstaller the installer ships is not the relayed one (via $installedVia): $shippedDigest vs $expectedDigest")
              }
            }
            Test-Signature "shipped: Uninstall Orca.exe (via $installedVia)" $installedUninstaller.FullName
          }

          $targets = @(Get-Content 'inner-signing-list.txt')
          foreach ($requiredTarget in @('Orca.exe', 'resources\bin\orca.exe', 'resources\bin\orca-agent-hook.exe')) {
            if ($targets -notcontains $requiredTarget) { $targets += $requiredTarget }
          }
          foreach ($relative in $targets) {
            $path = Join-Path $root $relative
            if (-not (Test-Path $path)) {
              $failures.Add("missing from installer payload: $relative")
              continue
            }
            # Only elevate.exe is advisory: NSIS pack recopies pristine cache bytes over signed win-unpacked output.
            # With no certificate, CopyElevateHelper.signIf signs nothing; this predates the uninstaller relay.
            # release-cut pre-seeds only Valid, SignPath-signed cache bytes; test certificates deliberately fail that guard.
            # DO NOT relax it: rehearsal shares electron-builder-win-<Electron+builder versions> with real releases and would poison
            # their cache with “Test certificate for Orca agent ide [OSS]”. Fix the UAC helper separately with proper scrutiny.
            if ($relative -eq 'resources\elevate.exe') {
              Test-Signature "installed: $relative" $path -Advisory
            } else {
              Test-Signature "installed: $relative" $path
            }
          }

          if ($advisories.Count -gt 0) {
            $report.Add('')
            $report.Add('ADVISORY (known pre-existing, did not fail this run):')
            $advisories | ForEach-Object { $report.Add("  $_") }
          }
          Set-Content -Path 'signing-evidence.txt' -Value ($report -join "`n")
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Host "::error::$_" }
            throw "Signing rehearsal failed with $($failures.Count) problems."
          }
          Write-Host "All checked binaries are signed, including the uninstaller the installer writes to disk ($($advisories.Count) advisory)."

      - name: Upload rehearsal evidence and installer
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-signing-rehearsal-${{ inputs.signing-policy-slug || 'test-signing' }}-${{ github.run_id }}
          path: |
            signing-evidence.txt
            inner-signing-list.txt
            dist/orca-windows-setup.exe
            dist/orca-windows-setup.exe.blockmap
