name: Windows signing rehearsal
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable or RC tag to rehearse without publishing
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-signing-rehearsal
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node config/windows-signing/preflight.mjs
        env:
          SIGNING_GATE_URL: ${{ vars.SIGNING_GATE_URL }}
          SIGNING_GATE_APP_ID: ${{ vars.SIGNING_GATE_APP_ID }}
          SIGNING_ENVIRONMENT_PREFIX: windows-rehearsal
  signing:
    needs: preflight
    uses: ./.github/workflows/release-windows-signing.yml
    permissions:
      contents: write
      actions: read
    with:
      tag: ${{ inputs.tag }}
      source_ref: ${{ inputs.tag }}
      source_sha: ${{ github.sha }}
      signing_policy: test-signing
      environment_prefix: windows-rehearsal
      publish: false
    secrets: inherit
