name: PR35764 R4 scoped observation final comparison
on:
  push:
    branches: [brennanb2025/sta-12544-md-find-anchor]
    paths: [.github/workflows/pr35764-r4-once.yml]
permissions:
  contents: read
concurrency:
  group: pr35764-r4-one-engine-comparison
  cancel-in-progress: false
jobs:
  compare:
    if: >-
      github.run_attempt == 1 &&
      github.event.before == '9de79ff96bd865f626569b06fb257f1f3af1a606' &&
      github.event.after == github.sha &&
      github.event.head_commit.id == github.sha &&
      github.event.head_commit.message == 'PR35764 R4 scoped observation final comparison'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Guard temporary commit and unchanged production inputs
        run: node config/ci/pr35764-r4/run-once.mjs guard
      - id: install
        uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24'
          native-runtime: node
      - name: One direct Node24 four-protocol invocation
        id: engine
        env:
          ORCA_BACKGROUND_LAUNCH: '1'
        run: node config/ci/pr35764-r4/run-once.mjs run
      - name: Seal complete bounded evidence on any outcome
        if: always()
        env:
          R4_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          R4_ENGINE_OUTCOME: ${{ steps.engine.outcome }}
        run: node config/ci/pr35764-r4/run-once.mjs seal
      - name: Upload original streams and full bounded case histories
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr35764-r4-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: r4-evidence/
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 14
