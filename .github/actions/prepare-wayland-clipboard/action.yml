name: Prepare Wayland clipboard helper
description: Reuse the source-matched Ubuntu 20.04 helper, validating its architecture and glibc requirements every time.

inputs:
  save-cache:
    description: Publish a validated helper from the default branch.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Resolve Wayland clipboard build identity
      id: identity
      shell: bash
      run: |
        node --input-type=module <<'NODE'
        import { appendFileSync } from 'node:fs'
        import { waylandClipboardFingerprint } from './config/scripts/build-wayland-clipboard.mjs'
        const fingerprint = waylandClipboardFingerprint(process.cwd(), process.arch)
        // Immutable invalid hits need a version bump here before publishing their repair.
        appendFileSync(process.env.GITHUB_OUTPUT, `key=wayland-clipboard-v1-${process.arch}-${fingerprint}\n`)
        NODE

    - name: Restore Wayland clipboard helper
      id: cache
      uses: actions/cache/restore@v5
      continue-on-error: true
      with:
        path: native/wayland-clipboard/.build
        key: ${{ steps.identity.outputs.key }}

    - name: Build or validate Wayland clipboard helper
      shell: bash
      env:
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        if node config/scripts/build-wayland-clipboard.mjs; then
          exit 0
        fi
        if [ "$CACHE_HIT" != true ]; then
          exit 1
        fi
        echo 'Discarding an unusable Wayland clipboard cache and rebuilding from source.'
        rm -rf -- native/wayland-clipboard/.build
        node config/scripts/build-wayland-clipboard.mjs

    - name: Save validated Wayland clipboard helper from main
      if: inputs.save-cache == 'true' && steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      uses: actions/cache/save@v5
      continue-on-error: true
      with:
        path: native/wayland-clipboard/.build
        key: ${{ steps.identity.outputs.key }}
