name: Prepare the Windows agent hook
description: Compiles native/windows-agent-hook into native/windows-agent-hook/.build/orca-agent-hook.exe, which electron-builder --win refuses to package without.

runs:
  using: composite
  steps:
    - name: Cache the Windows agent hook build
      if: runner.os == 'Windows'
      uses: actions/cache@v5
      with:
        path: |
          native/windows-agent-hook/.build
          native/windows-agent-hook/target
          ~/.cargo/registry
        key: windows-agent-hook-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/windows-agent-hook/**', 'config/scripts/build-windows-agent-hook.mjs', 'config/scripts/windows-rust-executable-build.mjs', 'resources/build/icon.ico', 'package.json') }}

    # Why explicit: a runner image without cargo would otherwise fail inside electron-builder's verify.
    - name: Build the Windows agent hook
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
          rustup toolchain install stable --profile minimal
          rustup default stable
        }
        node config/scripts/build-windows-agent-hook.mjs
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
