id: claude-chat-entrypoint-owner
language: typescript
severity: error
message: Keep the Claude identity literal in claude-chat-entrypoint.ts.
files: ['src/**']
ignores:
  - '**/*.test.*'
  - '**/*.test-fixtures.*'
  - '**/__fixtures__/**'
  - 'src/shared/agent-launch/startup/claude-chat-entrypoint.ts'
rule:
  all:
    - any:
        - kind: string_fragment
        - kind: property_identifier
        - kind: identifier
    - regex: '(?i)^(CLAUDE_CODE_ENTRYPOINT|sdk-cli)$'
