id: test-timeout-needs-reason
valid:
  - "it('reads', async () => {})"
  - |
    // Spawns a real shell, which is slow on Windows runners.
    it('spawns', async () => {}, 20_000)
  - |
    it('spawns', async () => {},
      // Spawns a real shell.
      20_000)
  - |
    // Builds the packaged app first.
    test.setTimeout(300_000)
  - 'await expect(locator).toBeVisible({ timeout: 10_000 })'
invalid:
  - "it('spawns', async () => {}, 20_000)"
  - "it('spawns', { timeout: 20_000 }, async () => {})"
  - "describe('suite', { timeout: 60_000 }, () => {})"
  - test.setTimeout(300_000)
  - test.slow()
---
id: test-no-in-test-import-actual
valid:
  - "vi.mock('./git', async () => ({ ...(await vi.importActual<typeof Git>('./git')), run: vi.fn() }))"
  - "beforeAll(async () => { actual = await vi.importActual<typeof Git>('./git') })"
  - "const actual = await vi.importActual<typeof Git>('./git')"
invalid:
  - "vi.doMock('./git', async () => ({ ...(await vi.importActual<typeof Git>('./git')) }))"
  - "function mockGit() { vi.doMock('./git', async () => ({ ...(await vi.importActual('./git')) })) }"
  - "it('creates', async () => { const actual = await vi.importActual<typeof Git>('./git') })"
  - "async function useReal() { return await vi.importActual('./git') }"
  - "beforeEach(async () => { actual = await vi.importActual('./git') })"
  - "it('reloads', async () => { vi.doMock('./git', async () => ({ ...(await vi.importActual('./git')) })) })"
  - "it.each([1])('reloads %s', async () => { vi.doMock('./git', async () => ({ ...(await vi.importActual('./git')) })) })"
