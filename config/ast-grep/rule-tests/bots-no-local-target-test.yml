id: bots-no-local-target
valid:
  - "callBotRpc(bot, 'bots.activity', { botId: bot.id })"
  - "const options = { kind: 'folder' }"
invalid:
  - "const LOCAL = { kind: 'local' } as const"
  - "callRuntimeRpc({ kind: 'local' }, 'bots.groups.list')"
  - 'const target: RuntimeClientTarget = { kind: "local", worktreeId }'
---
id: bots-no-local-target-tsx
valid:
  - 'export const X = () => <Card target={botTarget(bot)} />'
invalid:
  - "export const X = () => <Card target={{ kind: 'local' }} />"
