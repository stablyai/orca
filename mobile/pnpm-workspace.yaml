allowBuilds:
  esbuild: true
  # Its postinstall unpacks the prebuilt libsodium the native builds link.
  react-native-libsodium: true

minimumReleaseAge: 4320

overrides:
  # Expo still requires Zod 3; pin the version with our security backport.
  zod@>=3 <4: 3.25.76
  dompurify@<3.4.17: 3.4.17
  sprintf-js@<1.1.3: 1.1.3
  markdown-it@>=14.0.0 <14.3.3: 14.3.3
  # Mermaid 11 still requests KaTeX 0.16; the security fix starts at 0.18.2.
  katex@>=0.11.0 <0.18.2: 0.18.10
  # xcode still requests uuid 7; buffer bounds checks were fixed in 11.1.1.
  xcode>uuid: 11.1.1
  # Expo Router still requests query-string 7 and its vulnerable URI decoder.
  query-string: 9.5.1

patchedDependencies:
  zod@3.25.76: patches/zod@3.25.76.patch
  sprintf-js@1.1.3: patches/sprintf-js@1.1.3.patch
  '@xterm/addon-webgl@0.20.0-beta.300': patches/@xterm__addon-webgl@0.20.0-beta.300.patch
  expo-notifications@55.0.27: patches/expo-notifications@55.0.27.patch
  query-string@9.5.1: patches/query-string@9.5.1.patch
  react-native-webview@13.16.2: patches/react-native-webview@13.16.2.patch
  react-native@0.83.10: patches/react-native@0.83.10.patch
  braces@3.0.3: patches/braces@3.0.3.patch
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
