# Drives the terminal input strip attach menu: gallery (photo + video) then Files (2 docs).
# Precondition: phone is on a live shell terminal tab, attach button visible; test media and files are on the device.
appId: dev.orca.app
---
- extendedWaitUntil:
    visible: 'Live input'
    timeout: 20000
- takeScreenshot: 01-attach-button
# The input strip lives in the web view, which is not in the accessibility tree: coordinates only here.
- tapOn:
    point: '81%,91%'
- extendedWaitUntil:
    visible: 'Select from Gallery'
    timeout: 10000
- takeScreenshot: 02-attach-menu
- tapOn: 'Select from Gallery'
# System photo picker is fully accessible: select by content description (newest first).
- extendedWaitUntil:
    visible: 'Orca will only have access.*'
    timeout: 15000
- tapOn:
    text: 'Video taken on.*'
    index: 0
- tapOn:
    text: 'Photo taken on.*'
    index: 0
- extendedWaitUntil:
    visible: 'Done'
    timeout: 5000
- takeScreenshot: 03-gallery-selected
- tapOn: 'Done'
- extendedWaitUntil:
    notVisible: 'Done'
    timeout: 60000
- extendedWaitUntil:
    visible: 'Live input'
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 04-gallery-uploaded
- tapOn:
    point: '81%,91%'
- extendedWaitUntil:
    visible: 'Files'
    timeout: 10000
- tapOn: 'Files'
- extendedWaitUntil:
    visible: 'notes.json'
    timeout: 15000
# Documents UI multi-select: long-press the first item, tap the second.
- longPressOn: 'notes.json'
- tapOn: 'readme.txt'
- extendedWaitUntil:
    visible: '2 selected'
    timeout: 5000
- takeScreenshot: 05-files-selected
- tapOn: 'Select'
- extendedWaitUntil:
    notVisible: '2 selected'
    timeout: 60000
- extendedWaitUntil:
    visible: 'Live input'
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 06-files-uploaded
