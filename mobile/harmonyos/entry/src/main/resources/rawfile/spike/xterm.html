/**
 *  Default styles for xterm.js
 */

.xterm {
    cursor: text;
    position: relative;
    user-select: none;
    -ms-user-select: none;
    -webkit-user-select: none;
}

.xterm.focus,
.xterm:focus {
    outline: none;
}

.xterm .xterm-helpers {
    position: absolute;
    top: 0;
    /**
     * The z-index of the helpers must be higher than the canvases in order for
     * IMEs to appear on top.
     */
    z-index: 5;
}

.xterm .xterm-helper-textarea {
    padding: 0;
    border: 0;
    margin: 0;
    /* Move textarea out of the screen to the far left, so that the cursor is not visible */
    position: absolute;
    opacity: 0;
    left: -9999em;
    top: 0;
    width: 0;
    height: 0;
    z-index: -5;
    /** Prevent wrapping so the IME appears against the textarea at the correct position */
    white-space: nowrap;
    overflow: hidden;
    resize: none;
}

.xterm .composition-view {
    /* TODO: Composition position got messed up somewhere */
    background: #000;
    color: #FFF;
    display: none;
    position: absolute;
    white-space: nowrap;
    z-index: 1;
}

.xterm .composition-view.active {
    display: block;
}

.xterm .xterm-viewport {
    overflow-y: scroll;
    cursor: default;
    position: absolute;
    right: 0;
    left: 0;
    top: 0;
    bottom: 0;
}

.xterm:not(.allow-transparency) .xterm-viewport {
    /* On OS X this is required in order for the scroll bar to appear fully opaque */
    background-color: #000;
}

.xterm .xterm-screen {
    position: relative;
}

.xterm .xterm-screen canvas {
    position: absolute;
    left: 0;
    top: 0;
}

.xterm.enable-mouse-events {
    /* When mouse events are enabled (eg. tmux), revert to the standard pointer cursor */
    cursor: default;
}

.xterm.xterm-cursor-pointer,
.xterm .xterm-cursor-pointer {
    cursor: pointer;
}

.xterm.column-select.focus {
    /* Column selection mode */
    cursor: crosshair;
}

.xterm .xterm-accessibility:not(.debug),
.xterm .xterm-message {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    right: 0;
    z-index: 10;
    color: transparent;
    pointer-events: none;
}

.xterm .xterm-accessibility-tree:not(.debug) *::selection {
  color: transparent;
}

.xterm .xterm-accessibility-tree {
  font-family: monospace;
  user-select: text;
  white-space: pre;
}

.xterm .xterm-accessibility-tree > div {
  transform-origin: left;
  width: fit-content;
}

.xterm .live-region {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
}

.xterm-dim {
    /* Dim should not apply to background, so the opacity of the foreground color is applied
     * explicitly in the generated class and reset to 1 here */
    opacity: 1 !important;
}

.xterm-underline-1 { text-decoration: underline; }
.xterm-underline-2 { text-decoration: double underline; }
.xterm-underline-3 { text-decoration: wavy underline; }
.xterm-underline-4 { text-decoration: dotted underline; }
.xterm-underline-5 { text-decoration: dashed underline; }

.xterm-overline {
    text-decoration: overline;
}

.xterm-overline.xterm-underline-1 { text-decoration: overline underline; }
.xterm-overline.xterm-underline-2 { text-decoration: overline double underline; }
.xterm-overline.xterm-underline-3 { text-decoration: overline wavy underline; }
.xterm-overline.xterm-underline-4 { text-decoration: overline dotted underline; }
.xterm-overline.xterm-underline-5 { text-decoration: overline dashed underline; }

.xterm-strikethrough {
    text-decoration: line-through;
}

.xterm-screen .xterm-decoration-container .xterm-decoration {
	z-index: 6;
	position: absolute;
}

.xterm-screen .xterm-decoration-container .xterm-decoration.xterm-decoration-top-layer {
	z-index: 7;
}

.xterm-decoration-overview-ruler {
    z-index: 8;
    position: absolute;
    top: 0;
    right: 0;
    pointer-events: none;
}

.xterm-decoration-top {
    z-index: 2;
    position: relative;
}



/* Derived from vs/base/browser/ui/scrollbar/media/scrollbar.css */

/* xterm.js customization: Override xterm's cursor style */
.xterm .xterm-scrollable-element > .xterm-scrollbar {
    cursor: default;
}

/* Arrows */

.xterm .xterm-scrollable-element > .xterm-scrollbar > .xterm-scra {
	cursor: pointer;
    background-color: var(--vscode-scrollbarSliderBackground, rgba(100, 100, 100, 0.4));
    mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 11 11'><path d='M2.5 8.5 L5.5 2.5 L8.5 8.5 Z' fill='black'/></svg>");
    -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 11 11'><path d='M2.5 8.5 L5.5 2.5 L8.5 8.5 Z' fill='black'/></svg>");
    mask-repeat: no-repeat;
    -webkit-mask-repeat: no-repeat;
    mask-position: center center;
    -webkit-mask-position: center center;
    mask-size: 100% 100%;
    -webkit-mask-size: 100% 100%;
}

.xterm .xterm-scrollable-element > .xterm-scrollbar > .xterm-scra.xterm-arrow-down {
    transform: rotate(180deg);
}

.xterm .xterm-scrollable-element > .xterm-visible {
	opacity: 1;

	/* Background rule added for IE9 - to allow clicks on dom node */
	background:rgba(0,0,0,0);

	transition: opacity 100ms linear;
	/* In front of peek view */
	z-index: 11;
}
.xterm .xterm-scrollable-element > .xterm-invisible {
	opacity: 0;
	pointer-events: none;
}
.xterm .xterm-scrollable-element > .xterm-invisible.xterm-fade {
	transition: opacity 800ms linear;
}

/* Scrollable Content Inset Shadow */
.xterm .xterm-scrollable-element > .xterm-shadow {
	position: absolute;
	display: none;
}
.xterm .xterm-scrollable-element > .xterm-shadow.xterm-shadow-top {
	display: block;
	top: 0;
	left: 3px;
	height: 3px;
	width: 100%;
	box-shadow: var(--vscode-scrollbar-shadow, #000) 0 6px 6px -6px inset;
}
.xterm .xterm-scrollable-element > .xterm-shadow.xterm-shadow-left {
	display: block;
	top: 3px;
	left: 0;
	height: 100%;
	width: 3px;
	box-shadow: var(--vscode-scrollbar-shadow, #000) 6px 0 6px -6px inset;
}
.xterm .xterm-scrollable-element > .xterm-shadow.xterm-shadow-top-left-corner {
	display: block;
	top: 0;
	left: 0;
	height: 3px;
	width: 3px;
}
.xterm .xterm-scrollable-element > .xterm-shadow.xterm-shadow-top.xterm-shadow-left {
	box-shadow: var(--vscode-scrollbar-shadow, #000) 6px 0 6px -6px inset;
}

<script>

(function () {
  'use strict';
  var status = {
    ua: navigator.userAgent,
    terminal: 'missing',
    webgl: 'pending',
    webglError: '',
    rows: 0,
    cols: 0,
    keys: 0,
    writes: 0,
    errors: [],
    finished: false
  };
  window.__spikeStatus = status;
  function report() {
    try {
      if (window.orcaSpike && window.orcaSpike.report) {
        window.orcaSpike.report(JSON.stringify(status));
      }
    } catch (e) { /* bridge not ready yet */ }
  }
  window.addEventListener('error', function (ev) {
    status.errors.push(String(ev.message || ev));
    report();
  });

  function TerminalCtor() {
    if (typeof Terminal === 'function') return Terminal;
    return null;
  }

  var T = TerminalCtor();
  if (!T) {
    status.terminal = 'missing';
    status.finished = true;
    report();
    return;
  }
  status.terminal = 'loaded';

  var term = null;
  try {
    term = new T({
      rows: 24,
      cols: 80,
      cursorBlink: true,
      fontFamily: '"Menlo", "Cascadia Mono", monospace',
      fontSize: 14,
      theme: {
        background: '#111111',
        foreground: '#e8e8e8',
        cursor: '#e8e8e8'
      }
    });
    window.__term = term;
    term.open(document.getElementById('term'));
  } catch (e) {
    status.errors.push('open: ' + String(e && e.message || e));
    status.finished = true;
    report();
    return;
  }
  status.rows = term.rows;
  status.cols = term.cols;

  try {
    var NS = window.WebglAddon;
    var Ctor = null;
    if (NS && typeof NS.WebglAddon === 'function') Ctor = NS.WebglAddon;
    else if (typeof NS === 'function') Ctor = NS;
    if (!Ctor) throw new Error('webgl addon constructor not found');
    var addon = new Ctor();
    if (addon.onContextLoss) {
      addon.onContextLoss(function () {
        status.webgl = 'context-lost';
        report();
      });
    }
    term.loadAddon(addon);
    status.webgl = 'loaded';
  } catch (e) {
    status.webgl = 'failed';
    status.webglError = String(e && e.message || e);
  }

  term.onData(function (d) {
    status.keys++;
    term.write(d);
    if (status.keys % 8 === 0) report();
  });

  function banner() {
    term.writeln('\x1b[36mOrca HarmonyOS spike \u00b7 ArkWeb xterm\x1b[0m');
    term.writeln('webgl: ' + status.webgl + (status.webglError ? (' (' + status.webglError + ')') : ''));
    term.writeln('ua: ' + navigator.userAgent);
    term.writeln('');
    term.writeln('Type here to test keyboard echo. 256-color test:');
    var line = '';
    for (var i = 0; i < 8; i++) {
      for (var j = 0; j < 24; j++) {
        line += '\x1b[38;5;' + (i * 24 + j + 16) + 'm\u2588\x1b[0m';
      }
      term.writeln(line);
      line = '';
    }
    term.writeln('');
    term.writeln('\x1b[32m$ \x1b[0m');
  }
  try {
    banner();
    status.writes++;
  } catch (e) {
    status.errors.push('banner: ' + String(e && e.message || e));
  }

  var btn = document.getElementById('demo');
  if (btn) {
    btn.addEventListener('click', function () {
      status.keys += 1;
      term.write('echo spike-demo\r\n');
      term.writeln('spike-demo output line ' + new Date().toISOString());
    });
  }

  status.finished = true;
  report();
  setTimeout(report, 1500);
  setTimeout(report, 4000);
})();
