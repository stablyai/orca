shamefullyHoist: true

# Enables pnpm's global virtual store outside CI; under config/ because the repo root only admits
# allowlisted entries.
pnpmfile: config/pnpmfile.cjs

# Orca always launches the user's own resolved Claude CLI via
# pathToClaudeCodeExecutable, so the SDK's bundled ~95 MB-per-platform CLI
# binaries must never be installed. Excluding them is what makes the path
# override mandatory rather than merely preferred.
ignoredOptionalDependencies:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl'
  - '@anthropic-ai/claude-agent-sdk-linux-x64'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64'
  - '@anthropic-ai/claude-agent-sdk-win32-x64'

# Development and test jobs need only their host. Cross-target packaging opts in
# with pnpm install:release (or explicit pnpm install --os / --cpu targets).
supportedArchitectures:
  os:
    - current
  cpu:
    - current

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': false
  '@vscode/windows-process-tree': false
  agent-browser: false
  bun: true
  cpu-features: true
  electron-winstaller: false
  esbuild: true
  msw: false
  node-pty: true
  ssh2: false
  '@orca/windows-registry': false
  '@orca/windows-security': false

# Links the project's @types/<peer> next to every package that peer-depends on <peer> (e.g.
# @types/react beside lucide-react), so peer types resolve under the global virtual store.
addMissingPeerTypes: true

# These packages' published .d.ts import modules they never declare. Hoisting hides that,
# but under the global virtual store each package sees only its declared deps, so the types
# silently became `any` or (jest-dom) the vitest matcher augmentation vanished.
packageExtensions:
  '@testing-library/jest-dom':
    dependencies:
      '@types/aria-query': ^5.0.1
    peerDependencies:
      vitest: '*'
    peerDependenciesMeta:
      vitest:
        optional: true
  '@tiptap/extension-list':
    dependencies:
      prosemirror-model: ^1.0.0
  # electron-vite reads electron/package.json and the binary path at build and dev time.
  electron-vite:
    peerDependencies:
      electron: '*'
  electron-updater:
    peerDependencies:
      electron: '*'
    peerDependenciesMeta:
      electron:
        optional: true
  mermaid:
    dependencies:
      '@iconify/types': ^2.0.0
      '@types/d3-selection': ^3.0.0
      type-fest: ^5.0.0
  playwright-core:
    peerDependencies:
      electron: '*'
    peerDependenciesMeta:
      electron:
        optional: true
  remark-parse:
    dependencies:
      vfile: ^6.0.0

overrides:
  hono@>=4.12.4 <4.13.11: 4.13.11
  monaco-editor>dompurify: 3.4.17
  # Upstream markdown/math packages still require the vulnerable 0.16 line.
  katex@>=0.11.0 <0.18.2: 0.18.10

