[package]
name = "ide-dap"
description = "Debug adapter protocol client trimmed from OpenIDEA (Apache-2.0)"
version = "0.1.40"
edition = "2024"
license = "Apache-2.0"

[dependencies]
futures = "0.3"
tempfile = "3"
ide-core = { path = "../ide-core" }
ide-jsonrpc = { path = "../ide-jsonrpc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "process",
  "io-util",
  "fs",
  "net"
] }
parking_lot = "0.12"
memchr = "2"
portable-pty = "0.9"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["test-util"] }
