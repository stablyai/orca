[package]
name = "ide-core"
description = "Shared vocabulary and process/path utilities trimmed from OpenIDEA (Apache-2.0)"
version = "0.1.40"
edition = "2024"
license = "Apache-2.0"

[dependencies]
dunce = "1"
percent-encoding = "2"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading"
] }
