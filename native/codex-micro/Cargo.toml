[package]
name = "codex-micro"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "codex_micro"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "=2.6.6", default-features = false, features = ["linux-native-basic-udev"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
hidapi = "=2.6.6"
