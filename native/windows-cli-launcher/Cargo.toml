[package]
name = "orca-cli-launcher"
version = "0.0.0"
edition = "2021"
publish = false

# Why the bin is named `orca`: it ships as resources\bin\orca.exe, and the PE's
# OriginalFilename must match the file users actually invoke.
[[bin]]
name = "orca"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

# Why: this is a launcher, not a program. Everything here trims the PE toward the
# shape of an ordinary small native utility -- no panic machinery, no debug
# sections, one codegen unit -- which is also what keeps it out of the
# heuristic bucket the previous managed build sat in.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
