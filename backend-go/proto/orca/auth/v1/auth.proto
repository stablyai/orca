syntax = "proto3";

package orca.auth.v1;

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/auth/v1;authv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// AuthService owns users, sessions, RBAC/access-policies, audit log, admin console.
// See specs/backend-go/services/auth-service.md.
service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse);
  rpc IssueServiceToken(IssueServiceTokenRequest) returns (IssueServiceTokenResponse);
  // GetJWKS is public/unauthenticated by convention (Epic D): every service
  // needs to fetch auth-service's signing keys to verify JWTs without a
  // per-request call back, so this RPC deliberately requires no caller
  // identity.
  rpc GetJWKS(GetJWKSRequest) returns (GetJWKSResponse);

  // --- CR-CLI-002 (headless CLI credential: mint/revoke/list) ---
  // IsServiceTokenRevoked backs api-gateway's per-request bearer-JWT
  // revocation check (usecase.AuthValidator's RevocationChecker,
  // TASK-BE-CLI-005) — deliberately narrow (just a jti -> bool lookup, not
  // the full token record) so that check stays a single cheap call, cached
  // short-term on the caller side (see authclient's RevocationClient doc
  // comment). No caller-identity gate: any authenticated internal caller
  // may check any jti's revocation status (this is a yes/no on a random
  // 32-byte id, not a way to enumerate anything about the owning user).
  rpc IsServiceTokenRevoked(IsServiceTokenRevokedRequest) returns (IsServiceTokenRevokedResponse);
  // ListCliTokens/RevokeCliToken are self-service only (TASK-BE-CLI-006) —
  // user_id always comes from the caller's own resolved identity at
  // api-gateway (never a request field a client controls), and the
  // usecase itself re-verifies the caller against tenant.UserID(ctx)
  // before touching another user's tokens (see
  // usecase.RevokeCliTokenInput's doc comment) — same self-mint-only
  // posture as IssueServiceToken (CR-CLI-002, decision 2026-09-09).
  rpc ListCliTokens(ListCliTokensRequest) returns (ListCliTokensResponse);
  rpc RevokeCliToken(RevokeCliTokenRequest) returns (google.protobuf.Empty);

  // Admin console
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUserRole(UpdateUserRoleRequest) returns (UpdateUserRoleResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  rpc QueryAuditLog(QueryAuditLogRequest) returns (QueryAuditLogResponse);
  // AppendAuditEntry lets project-service/task-service/annotation-service/
  // infra-fleet-service append an entry to this service's own audit_log
  // from their own OPA-gated decisions (TASK-BE-017/019..022) — auth.audit_log
  // lives only in auth-service's database (bounded-context rule), so this is
  // the one cross-service write path onto it. No per-call user authorization
  // gate: every other service authenticates to auth-service via mTLS +
  // NetworkPolicy (07-security-architecture.md), not caller identity.
  rpc AppendAuditEntry(AppendAuditEntryRequest) returns (google.protobuf.Empty);
  rpc DeactivateUser(DeactivateUserRequest) returns (DeactivateUserResponse);
  rpc ReactivateUser(ReactivateUserRequest) returns (ReactivateUserResponse);
  rpc ListSessionsForUser(ListSessionsForUserRequest) returns (ListSessionsForUserResponse);
  rpc ForceRevokeAllSessionsForUser(ForceRevokeAllSessionsForUserRequest) returns (ForceRevokeAllSessionsForUserResponse);
  // ForceRevokeSession is the admin-console single-session kill action for
  // the Sessions tab's per-row "kill" button — session_id is the token
  // HASH (as ListSessionsForUser's Session.id already is), NOT the raw
  // token RevokeSession expects. See force_revoke_session.go's doc comment
  // for why RevokeSession cannot be reused for this (TASK-BE-002/030).
  rpc ForceRevokeSession(ForceRevokeSessionRequest) returns (google.protobuf.Empty);
  rpc CreateAccessPolicy(CreateAccessPolicyRequest) returns (AccessPolicy);
  rpc GetAccessPolicy(GetAccessPolicyRequest) returns (AccessPolicy);
  rpc ListAccessPolicies(ListAccessPoliciesRequest) returns (ListAccessPoliciesResponse);
  rpc UpdateAccessPolicy(UpdateAccessPolicyRequest) returns (AccessPolicy);
  rpc DeleteAccessPolicy(DeleteAccessPolicyRequest) returns (google.protobuf.Empty);
  rpc GetAdminStats(GetAdminStatsRequest) returns (GetAdminStatsResponse);

  // ListTenantMemberDirectory is the non-admin counterpart to ListUsers —
  // any authenticated user may look up their OWN tenant's other members by
  // name/email (member-picker UIs need this; ListUsers itself is
  // admin-console-only). tenant_id/actor come from the caller's own
  // identity, never a request field — there is deliberately no way to ask
  // for another tenant's directory here.
  rpc ListTenantMemberDirectory(ListTenantMemberDirectoryRequest) returns (ListTenantMemberDirectoryResponse);

  // --- CR-LOGIN-001 (SSO: GitHub / Google / generic OIDC) ---
  // StartSsoLogin/CompleteSsoLogin are unauthenticated by necessity — like
  // Login, the caller has no session yet. api-gateway's GET /auth/sso/
  // {provider} and GET /auth/callback are the only callers.
  rpc StartSsoLogin(StartSsoLoginRequest) returns (StartSsoLoginResponse);
  rpc CompleteSsoLogin(CompleteSsoLoginRequest) returns (CompleteSsoLoginResponse);

  // --- CR-RBAC-003 (SSO group->role mapping, session refresh) ---
  // RefreshSession rotates Orca's own opaque session token — never the
  // upstream IdP's OAuth refresh_token (out of scope, not touched by this
  // RPC). Rejects with PermissionDenied (not a generic error) for an
  // unknown, revoked, or expired refresh token; presenting an
  // already-rotated-away refresh token is treated as reuse and revokes
  // every session for that user, not just this one request.
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse);
  // UpdateSsoGroupMapping/ListSsoGroupMapping are admin-console operations
  // on auth.sso_group_role_mapping, gated by requireAdminActor like every
  // other admin-console RPC on this service.
  rpc UpdateSsoGroupMapping(UpdateSsoGroupMappingRequest) returns (UpdateSsoGroupMappingResponse);
  rpc ListSsoGroupMapping(ListSsoGroupMappingRequest) returns (ListSsoGroupMappingResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_USER = 1;
  ROLE_ADMIN = 2;
}

message User {
  string id = 1;
  string tenant_id = 2;
  string email = 3;
  string name = 4;
  Role role = 5;
  bool is_active = 6;
  google.protobuf.Timestamp created_at = 7;
  // provider: "none" for a local-password-only account, otherwise the sso
  // provider ("github" | "google" | "oidc") this user last authenticated
  // through — see CR-LOGIN-001.
  string provider = 8;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string session_token = 1;
  User user = 2;
  // refresh_token — see RefreshSessionResponse's doc comment (TASK-BE-012):
  // every session is now issued one at creation, local login included, so
  // /auth/refresh has something to rotate from on this session's very
  // first request.
  string refresh_token = 3;
}

message LogoutRequest {
  string session_token = 1;
}

message LogoutResponse {}

message ValidateSessionRequest {
  string session_token = 1;
}

message ValidateSessionResponse {
  bool valid = 1;
  User user = 2;
}

message IssueServiceTokenRequest {
  string user_id = 1;
  string audience = 2; // which service this JWT is intended for
}

message IssueServiceTokenResponse {
  string jwt = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message GetJWKSRequest {}

message GetJWKSResponse {
  // JSON-serialized RFC 7517 JWK Set (`{"keys":[...]}`) — kept as an
  // opaque string rather than a hand-modeled proto message, matching this
  // codebase's existing convention for opaque external-format payloads
  // (e.g. the Relay RPC's params_json/result_json).
  string jwks_json = 1;
}

message IsServiceTokenRevokedRequest {
  string jti = 1;
}

message IsServiceTokenRevokedResponse {
  bool revoked = 1;
}

// CliToken is one auth.issued_service_tokens row's wire shape — the JWT
// itself is never returned here (it was only ever handed back once, at
// mint time, IssueServiceTokenResponse.jwt — this is metadata for the
// list view, not a way to recover a lost token).
message CliToken {
  string jti = 1;
  string audience = 2;
  google.protobuf.Timestamp issued_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  // revoked_at is unset (nil) for a currently-valid token.
  google.protobuf.Timestamp revoked_at = 5;
}

message ListCliTokensRequest {
  string user_id = 1;
}

message ListCliTokensResponse {
  repeated CliToken tokens = 1;
}

message RevokeCliTokenRequest {
  string jti = 1;
  string user_id = 2;
}

message CreateUserRequest {
  string email = 1;
  string name = 2;
  string tenant_id = 3;
  Role role = 4;
  // password: optional. Empty means "auto-generate" — the plaintext is
  // returned exactly once in CreateUserResponse.generated_password (never
  // stored, never logged) since there is no invite/reset-link flow yet; the
  // calling admin is responsible for relaying it to the new user out of
  // band. A caller-supplied password skips generation entirely.
  string password = 5;
}

message CreateUserResponse {
  User user = 1;
  // generated_password is set only when the request's password field was
  // empty — see CreateUserRequest.password's doc comment.
  string generated_password = 2;
}

message ListUsersRequest {
  string tenant_id = 1;
  string page_token = 2;
  int32 page_size = 3;
}

message ListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
}

// Deliberately empty — see ListTenantMemberDirectory's own doc comment on
// the service definition for why tenant/actor are never request fields.
message ListTenantMemberDirectoryRequest {}

// TenantMemberDirectoryEntry is deliberately narrower than User (no role/
// is_active/created_at) — this backs a member-picker, not an admin view.
message TenantMemberDirectoryEntry {
  string id = 1;
  string name = 2;
  string email = 3;
}

message ListTenantMemberDirectoryResponse {
  repeated TenantMemberDirectoryEntry members = 1;
}

message UpdateUserRoleRequest {
  string user_id = 1;
  Role role = 2;
}

message UpdateUserRoleResponse {
  User user = 1;
}

message RevokeSessionRequest {
  string session_token = 1;
}

message RevokeSessionResponse {}

message AuditEntry {
  string id = 1;
  string tenant_id = 2;
  string actor_id = 3;
  string action = 4;
  string target = 5;
  google.protobuf.Timestamp occurred_at = 6;
  string outcome = 7;     // "allowed" | "denied" (TASK-BE-016)
  string ip_address = 8;
}

// AppendAuditEntryRequest carries an audit event another service wants
// recorded in auth-service's audit_log. tenant_id/actor_id come from the
// calling service's own already-validated context (its RPC caller), never
// re-validated here — see AppendAuditEntry's doc comment for why there is
// no admin gate on this RPC.
message AppendAuditEntryRequest {
  string tenant_id = 1;
  string actor_id = 2;
  string action = 3;      // e.g. "project.update", "repo.remove_member", "ssh.connect"
  string target = 4;      // resource type + id, e.g. "project:proj-123"
  string outcome = 5;     // "allowed" | "denied"
  string ip_address = 6;
}

message QueryAuditLogRequest {
  string tenant_id = 1;
  google.protobuf.Timestamp since = 2;
  string page_token = 3;
  int32 page_size = 4;
  // actor_id/action/outcome are optional filters (TASK-BE-016) — empty
  // means "no filter" on that dimension, matching AuditRepository.Query.
  string actor_id = 5;
  string action = 6;
  string outcome = 7;
}

message QueryAuditLogResponse {
  repeated AuditEntry entries = 1;
  string next_page_token = 2;
}

message DeactivateUserRequest { string user_id = 1; }
message DeactivateUserResponse { User user = 1; }
message ReactivateUserRequest { string user_id = 1; }
message ReactivateUserResponse { User user = 1; }

message ListSessionsForUserRequest { string user_id = 1; }
message ListSessionsForUserResponse { repeated Session sessions = 1; }
message Session {
  string id = 1;            // opaque token hash, never the raw token
  string user_id = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  google.protobuf.Timestamp last_seen_at = 5;
  string ip = 6;
  string user_agent = 7;
}
message ForceRevokeAllSessionsForUserRequest { string user_id = 1; }
message ForceRevokeAllSessionsForUserResponse { int32 revoked_count = 1; }

message ForceRevokeSessionRequest {
  string session_id = 1; // the opaque token HASH, as returned by ListSessionsForUser's Session.id
}

message AccessPolicy {
  string id = 1;
  string name = 2;
  string kind = 3;           // "role-definition" | "rate-tier" | ...
  string document_json = 4;  // JSONB document, serialized
  int32 version = 5;
  string updated_by = 6;
  google.protobuf.Timestamp updated_at = 7;
}
message CreateAccessPolicyRequest { string name = 1; string kind = 2; string document_json = 3; }
message GetAccessPolicyRequest { string id = 1; }
message ListAccessPoliciesRequest { string page_token = 1; int32 page_size = 2; }
message ListAccessPoliciesResponse { repeated AccessPolicy policies = 1; string next_page_token = 2; }
message UpdateAccessPolicyRequest { string id = 1; string document_json = 2; int32 expected_version = 3; }
message DeleteAccessPolicyRequest { string id = 1; }

message GetAdminStatsRequest {}
message GetAdminStatsResponse {
  int32 total_users = 1;
  int32 active_sessions = 2;
  int32 total_policies = 3;
}

// --- CR-LOGIN-001 (SSO) ---
message StartSsoLoginRequest {
  string provider = 1;     // "github" | "google" | "oidc"
  string redirect_uri = 2; // api-gateway's own /auth/callback URL — never derived from a request Host header, see api-gateway's auth_routes.go
}
message StartSsoLoginResponse {
  string authorization_url = 1;
  // state is returned for symmetry/testability; api-gateway doesn't need
  // it directly — the authorization_url already embeds it.
  string state = 2;
}

message CompleteSsoLoginRequest {
  string code = 1;
  string state = 2;
}
message CompleteSsoLoginResponse {
  string session_token = 1;
  User user = 2;
  // refresh_token — see LoginResponse.refresh_token's doc comment; SSO
  // login gets one for the same reason local login does (TASK-BE-012).
  string refresh_token = 3;
}

// --- CR-RBAC-003 (SSO group->role mapping, session refresh) ---
message RefreshSessionRequest {
  string refresh_token = 1;
}
message RefreshSessionResponse {
  string session_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  // refresh_token is the NEW refresh token minted by this rotation —
  // TASK-BE-011 originally shipped this response without it, which made a
  // second refresh impossible (the client would have no rotated token to
  // present next time). Added by TASK-BE-012 to close that gap; see
  // api-gateway's auth_routes.go for how it's stored (orca_refresh cookie).
  string refresh_token = 3;
}

message SsoGroupRoleMapping {
  string id = 1;
  string provider = 2;    // domain.SsoProvider values: "github" | "google" | "oidc"
  string group_name = 3;  // e.g. "orca-admins" (OIDC) or "org:my-company" (GitHub)
  Role role = 4;
  google.protobuf.Timestamp created_at = 5;
}

// UpdateSsoGroupMapping upserts one (tenant_id, provider, group_name) row —
// tenant_id comes from the request field, matching this service's other
// tenant-scoped admin-console RPCs (e.g. ListUsersRequest.tenant_id).
message UpdateSsoGroupMappingRequest {
  string tenant_id = 1;
  string provider = 2;
  string group_name = 3;
  Role role = 4;
}
message UpdateSsoGroupMappingResponse {
  SsoGroupRoleMapping mapping = 1;
}

message ListSsoGroupMappingRequest {
  string tenant_id = 1;
  // provider is an optional filter; empty means "every provider".
  string provider = 2;
}
message ListSsoGroupMappingResponse {
  repeated SsoGroupRoleMapping mappings = 1;
}
