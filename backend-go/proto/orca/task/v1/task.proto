syntax = "proto3";

package orca.task.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/task/v1;taskv1";

// TaskService owns the task DAG, edges, grants, comments. Does NOT own team
// membership (tenant-service) or execution (infra-fleet-service/orchestration-service).
// See specs/backend-go/services/task-service.md.
service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc AddEdge(AddEdgeRequest) returns (AddEdgeResponse);
  rpc Grant(GrantRequest) returns (GrantResponse);
  rpc ResolvePermission(ResolvePermissionRequest) returns (ResolvePermissionResponse);
  rpc Execute(TaskServiceExecuteRequest) returns (TaskServiceExecuteResponse);

  // HasActiveExecutions answers "does this project have a task currently
  // dispatched for execution (status=in_progress)" — added for Epic C
  // (backend-go/docs/execution-plan.md §10) to close
  // project-service.RebindDevServer's guard, previously a client-side
  // no-op because this RPC didn't exist. See that RPC's Go doc comment
  // (internal/usecase/has_active_executions.go) for the honest limit on
  // what this can currently answer — task-service has no completion
  // callback yet, so "in_progress" is one-way until that's built.
  rpc HasActiveExecutions(HasActiveExecutionsRequest) returns (HasActiveExecutionsResponse);

  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  rpc DeleteTask(DeleteTaskRequest) returns (google.protobuf.Empty);
  rpc GetDependencies(GetDependenciesRequest) returns (GetDependenciesResponse);

  // AIDecompose relays to the Dev Server Agent's ai.complete method (via
  // infra-fleet-service's Relay RPC) to propose a subtask breakdown for
  // task_id — review-before-commit: proposals are not written to
  // task_edges until a subsequent AIApply call. See TASK-224's Context
  // note for why task-service goes through infra-fleet-service rather
  // than calling the Dev Server Agent directly.
  rpc AIDecompose(AIDecomposeRequest) returns (AIDecomposeResponse);
  // AIApply commits a (possibly user-edited) proposal set from a prior
  // AIDecompose call, creating one subtask + parent_child edge per
  // proposal.
  rpc AIApply(AIApplyRequest) returns (AIApplyResponse);
}

message Task {
  string id = 1;
  string tenant_id = 2;
  string title = 3;
  string status = 4;
  string parent_id = 5;
  string project_id = 6; // added for Epic C's HasActiveExecutions — see that RPC's doc comment
  // workflow_template_id: optional workflow-service template attached to
  // this task (Engine 3). Empty = none attached. See docs/backlog/BACKLOG-016.
  string workflow_template_id = 7;
}

message CreateTaskRequest {
  string tenant_id = 1;
  string title = 2;
  string parent_id = 3;
  string project_id = 4;
}

message CreateTaskResponse {
  Task task = 1;
}

message GetTaskRequest {
  string id = 1;
}

message GetTaskResponse {
  Task task = 1;
}

enum EdgeType {
  EDGE_TYPE_UNSPECIFIED = 0;
  EDGE_TYPE_PARENT_CHILD = 1;
  EDGE_TYPE_DEPENDS_ON = 2;
}

// AddEdge rejects cycles (domain-layer CycleDetector), see task-service.md.
message AddEdgeRequest {
  string from_task_id = 1;
  string to_task_id = 2;
  EdgeType type = 3;
}

message AddEdgeResponse {}

enum GrantLevel {
  GRANT_LEVEL_UNSPECIFIED = 0;
  GRANT_LEVEL_OWNER = 1;
  GRANT_LEVEL_ADMIN = 2;
  GRANT_LEVEL_USER = 3;
  GRANT_LEVEL_TEAM = 4;
  GRANT_LEVEL_COMPANY = 5;
}

message GrantRequest {
  string task_id = 1;
  string subject_id = 2; // user or team id
  GrantLevel level = 3;
  bool apply_tree = 4;
}

message GrantResponse {}

// ResolvePermission runs the BFS ancestor-resolution algorithm in domain/,
// then the caller passes the result as OPA policy input for the final
// allow/deny — see task-service.md security notes.
message ResolvePermissionRequest {
  string task_id = 1;
  string user_id = 2;
}

message ResolvePermissionResponse {
  GrantLevel effective_level = 1;
}

// Execute branches by complexity: simple tasks relay to infra-fleet-service
// (agent.exec-equivalent), complex ones route through orchestration-service.
message TaskServiceExecuteRequest {
  string task_id = 1;
  string request_id = 2;
  // prompt: caller-supplied override for the agent prompt (TaskPromptEditor.tsx
  // lets the user edit it before running). Empty = fall back to the
  // executor's own default prompt built from the task (e.g.
  // SimpleExecutor.buildExecutePrompt's plain "Complete the following
  // task: <title>"). Not persisted — a per-execution input, not a task
  // field. See docs/backlog/BACKLOG-016.
  string prompt = 3;
}

message TaskServiceExecuteResponse {
  string execution_ref = 1; // opaque handle into infra-fleet-service or orchestration-service
}

message HasActiveExecutionsRequest {
  string project_id = 1;
}

message HasActiveExecutionsResponse {
  bool has_active = 1;
}

message ListTasksRequest {
  string project_id = 1; // optional filter, empty = no filter
  string page_token = 2;
  int32 page_size = 3;
}
message ListTasksResponse {
  repeated Task tasks = 1;
  string next_page_token = 2;
}

// UpdateTask uses optional (wrapper-typed) fields, same field-mask shape as
// UpdateAutomationRequest — a status-only edit (the common case, e.g.
// marking done) shouldn't require resending title. Status transitions into
// "in_progress" are rejected at the domain layer (domain.Task.SetStatus) —
// that transition is ExecuteTask's job only.
message UpdateTaskRequest {
  string id = 1;
  google.protobuf.StringValue title = 2;
  google.protobuf.StringValue status = 3;
  // workflow_template_id: set (even to "") to change which workflow-service
  // template is attached; unset (field absent) leaves it untouched — same
  // wrapper-typed field-mask shape as title/status above. See
  // docs/backlog/BACKLOG-016.
  google.protobuf.StringValue workflow_template_id = 4;
}
message UpdateTaskResponse {
  Task task = 1;
}

message DeleteTaskRequest {
  string id = 1;
}

// GetDependencies walks depends_on edges FROM task_id — distinct from
// AddEdge (write) and from the parent_child ancestor walk GetAncestors
// does internally (not on this proto's surface yet).
message GetDependenciesRequest {
  string task_id = 1;
}
message GetDependenciesResponse {
  repeated Task dependencies = 1;
}

message AIDecomposeRequest {
  string task_id = 1;
}
message SubtaskProposal {
  string title = 1;
  string description = 2;
}
message AIDecomposeResponse {
  repeated SubtaskProposal proposals = 1; // review-before-commit — not yet written to task_edges
}

// AIApply commits a (possibly user-edited) proposal set from a prior
// AIDecompose call — the two-step review-before-commit shape.
message AIApplyRequest {
  string task_id = 1;
  repeated SubtaskProposal proposals = 2;
}
message AIApplyResponse {
  repeated Task created_subtasks = 1;
}
