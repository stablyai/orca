syntax = "proto3";

package orca.tenant.v1;

option go_package = "github.com/stablyai/orca-go/proto/gen/go/orca/tenant/v1;tenantv1";

import "google/protobuf/empty.proto";

// TenantService owns companies, departments, user profiles (3-layer resolution), teams.
// This is the origin of tenant_id for every other service. See specs/backend-go/services/tenant-service.md.
service TenantService {
  rpc CreateCompany(CreateCompanyRequest) returns (CreateCompanyResponse);
  // GetCompany — the missing read half of Create/UpdateCompany (CR-DS-006/
  // 007/008 follow-up: the Admin Console's Company tab needs to display the
  // caller's own company name before offering to rename it).
  rpc GetCompany(GetCompanyRequest) returns (GetCompanyResponse);
  // ListCompanies — cross-tenant by nature (tenant.companies has no
  // tenant_id column, this table IS the tenant root); the caller MUST
  // admin-gate. Added because a company created via CreateCompany was
  // otherwise unreachable after the creating session ended — see
  // wscompat's profile.listCompanies.
  rpc ListCompanies(ListCompaniesRequest) returns (ListCompaniesResponse);
  rpc ValidateTenant(ValidateTenantRequest) returns (ValidateTenantResponse);
  rpc CreateDepartment(CreateDepartmentRequest) returns (CreateDepartmentResponse);
  rpc SetUserDepartment(SetUserDepartmentRequest) returns (SetUserDepartmentResponse);
  rpc GetResolvedProfile(GetResolvedProfileRequest) returns (GetResolvedProfileResponse);
  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse);
  rpc AddTeamMember(AddTeamMemberRequest) returns (AddTeamMemberResponse);
  rpc ListTeamMembers(ListTeamMembersRequest) returns (ListTeamMembersResponse);
  // ListTeamsForUser answers "which teams is this user a member of" without
  // the ListTeams(company)+ListTeamMembers(team) N+1 fan-out
  // devServer.listForUser's handler doc comment deliberately avoids — added
  // to unblock team-based dev-server access grants (BUG-013,
  // CR-DS-007 §3's recorded "Known gap ghi nhận khi triển khai").
  rpc ListTeamsForUser(ListTeamsForUserRequest) returns (ListTeamsForUserResponse);

  // ── profile.* surface (tenant-service.md §3) ──────────────────────────
  rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse);
  rpc ListDepartments(ListDepartmentsRequest) returns (ListDepartmentsResponse);
  rpc UpdateCompany(UpdateCompanyRequest) returns (UpdateCompanyResponse);
  rpc UpdateDepartment(UpdateDepartmentRequest) returns (UpdateDepartmentResponse);
  rpc UpdateUserProfile(UpdateUserProfileRequest) returns (UpdateUserProfileResponse);
  // ListTeams(ListTeamsRequest) returns (ListTeamsResponse) — the missing
  // half of team.* CRUD (create/get exist; list never did). See
  // tenant-service.md §3.
  rpc ListTeams(ListTeamsRequest) returns (ListTeamsResponse);

  // RemoveTeamMember — documented gap, services/tenant-service/README.md:101.
  rpc RemoveTeamMember(RemoveTeamMemberRequest) returns (google.protobuf.Empty);

  // GetOnboardingState/SetOnboardingState — per-user onboarding wizard
  // progress, opaque JSON as far as this service is concerned (api-gateway's
  // onboarding.get/update wscompat channels own decoding it). Added because
  // nothing ever persisted this: every page reload re-showed the onboarding
  // wizard forever. See UserProfileRepository.GetOnboardingState's doc
  // comment for why this is a dedicated store, not settings_json.
  rpc GetOnboardingState(GetOnboardingStateRequest) returns (GetOnboardingStateResponse);
  rpc SetOnboardingState(SetOnboardingStateRequest) returns (google.protobuf.Empty);

  // ── Client-local state (CR-STORAGE-001/003/004a,b) ────────────────────
  // GetClientState/SetClientState — 5 opaque per-user JSON blobs
  // (keybindings/UI local state/saved runtime environments/settings/
  // accounts->dev-server map) parameterized by ClientStateKind rather than
  // 5 near-identical RPC pairs — see
  // specs/backend-go/crs/v3/storage/solutions/
  // BE-SOL-STORAGE-001-user-profile-json-columns.md §5 for why. user_id is
  // NOT trusted as the scoping identity by itself — the caller
  // (api-gateway) always sends the authenticated caller's own user_id, same
  // convention as GetOnboardingStateRequest.
  rpc GetClientState(GetClientStateRequest) returns (GetClientStateResponse);
  rpc SetClientState(SetClientStateRequest) returns (google.protobuf.Empty);

  // GetWorkspaceSession/SetWorkspaceSession/PatchWorkspaceSession
  // (CR-STORAGE-004a) — a separate table keyed by (user_id, host_id), not a
  // 6th ClientStateKind: one user can have N sessions, one per host/
  // environment (BE-SOL-STORAGE-001 §3).
  rpc GetWorkspaceSession(GetWorkspaceSessionRequest) returns (GetWorkspaceSessionResponse);
  rpc SetWorkspaceSession(SetWorkspaceSessionRequest) returns (google.protobuf.Empty);
  rpc PatchWorkspaceSession(PatchWorkspaceSessionRequest) returns (google.protobuf.Empty);

  // ── Multi-tenant SSO follow-up (CR-LOGIN-001) ─────────────────────────
  // Add/Remove/ListCompanyEmailDomains are admin-console operations (caller
  // MUST admin-gate — see AddCompanyEmailDomain's doc comment).
  // ResolveCompanyByEmailDomain is a system-internal read auth-service
  // calls server-to-server to decide a brand-new SSO signup's tenant — NOT
  // an admin-console operation, never exposed as an end-user REST route.
  rpc AddCompanyEmailDomain(AddCompanyEmailDomainRequest) returns (AddCompanyEmailDomainResponse);
  rpc RemoveCompanyEmailDomain(RemoveCompanyEmailDomainRequest) returns (google.protobuf.Empty);
  rpc ListCompanyEmailDomains(ListCompanyEmailDomainsRequest) returns (ListCompanyEmailDomainsResponse);
  rpc ResolveCompanyByEmailDomain(ResolveCompanyByEmailDomainRequest) returns (ResolveCompanyByEmailDomainResponse);

  // ── starNag.* surface (BUG-005/SOL-005) ───────────────────────────────
  // Per-user "star Orca on GitHub" nag state — dismissal/cooldown/threshold/
  // completion — folded into tenant-service per SOL-005's "small per-user
  // preference state, no natural owning service" verdict, same shape as
  // GetOnboardingState/SetOnboardingState above. Every request carries only
  // user_id (never company_id — same convention as GetOnboardingStateRequest:
  // the scoping company comes from tenant.RequireTenantID(ctx), not a
  // message field).
  rpc DismissStarNag(DismissStarNagRequest) returns (google.protobuf.Empty);
  rpc DeferStarNag(DeferStarNagRequest) returns (google.protobuf.Empty); // "later"
  rpc CompleteStarNag(CompleteStarNagRequest) returns (google.protobuf.Empty);
  rpc DisableStarNag(DisableStarNagRequest) returns (google.protobuf.Empty);
  rpc ForceShowStarNag(ForceShowStarNagRequest) returns (google.protobuf.Empty);
  rpc NotifyStarNagOnboardingCompleted(NotifyStarNagOnboardingCompletedRequest) returns (google.protobuf.Empty);
  rpc OpenWebStarNag(OpenWebStarNagRequest) returns (google.protobuf.Empty);
  // StarOrcaFromNag performs (or attempts) the actual GitHub star action.
  // starred=false + ok=false (see StarOrcaFromNagResponse) means "unable to
  // determine/perform" — not an error — same shape as
  // github.checkOrcaStarred's null today (channels_scm.go:56-70).
  rpc StarOrcaFromNag(StarOrcaFromNagRequest) returns (StarOrcaFromNagResponse);
  rpc PrepareStarNagAgentValueMoment(PrepareStarNagAgentValueMomentRequest) returns (StarNagAgentValueMomentPreparation);
  rpc ShowPreparedStarNagAgentValueMoment(ShowPreparedStarNagAgentValueMomentRequest) returns (google.protobuf.Empty);
}

message Company {
  string id = 1;
  string name = 2;
  string settings_json = 3; // company-layer defaults, deep-merge base
}

message Department {
  string id = 1;
  string company_id = 2;
  string name = 3;
  string settings_json = 4;
}

message CreateCompanyRequest {
  string name = 1;
}

message CreateCompanyResponse {
  Company company = 1;
}

message GetCompanyRequest {
  string id = 1;
}

message GetCompanyResponse {
  Company company = 1;
}

message ListCompaniesRequest {}

message ListCompaniesResponse {
  repeated Company companies = 1;
}

message ValidateTenantRequest {
  string tenant_id = 1;
}

message ValidateTenantResponse {
  bool exists = 1;
}

message CreateDepartmentRequest {
  string company_id = 1;
  string name = 2;
}

message CreateDepartmentResponse {
  Department department = 1;
}

message SetUserDepartmentRequest {
  string user_id = 1;
  string department_id = 2;
}

message SetUserDepartmentResponse {}

message GetResolvedProfileRequest {
  string user_id = 1;
}

message GetResolvedProfileResponse {
  string resolved_settings_json = 1; // company <- department <- user deep-merge result
}

message Team {
  string id = 1;
  string company_id = 2;
  string name = 3;
  string settings_json = 4; // team-layer profile override, see ResolveProfile
}

message CreateTeamRequest {
  string company_id = 1;
  string name = 2;
  string settings_json = 3; // optional; empty/unset means no team-layer override
}

message CreateTeamResponse {
  Team team = 1;
}

message AddTeamMemberRequest {
  string team_id = 1;
  string user_id = 2;
  int32 priority = 3;
}

message AddTeamMemberResponse {}

message ListTeamMembersRequest {
  string team_id = 1;
}

message TeamMember {
  string user_id = 1;
  int32 priority = 2;
}

message ListTeamMembersResponse {
  repeated TeamMember members = 1;
}

message ListTeamsForUserRequest {
  string user_id = 1;
  // company_id intentionally omitted — same pattern as ListTeamsRequest/
  // AddTeamMemberRequest: the scoping company comes from the validated
  // request context (tenant.RequireTenantID), never a client-supplied
  // field, per tenant-service.md §9.
}

message ListTeamsForUserResponse {
  repeated string team_ids = 1;
}

// UserProfile is the wire shape of tenant.user_profiles — mirrors
// domain.UserProfile.
message UserProfile {
  string user_id = 1;
  string company_id = 2;
  string department_id = 3;  // empty = company-only inheritance
  string settings_json = 4;
}

message GetUserProfileRequest {
  string user_id = 1;
}

message GetUserProfileResponse {
  UserProfile profile = 1;
}

message ListDepartmentsRequest {
  string company_id = 1;
}

message ListDepartmentsResponse {
  repeated Department departments = 1;
}

message UpdateCompanyRequest {
  string id = 1;
  string name = 2;          // empty = no change
  string settings_json = 3; // empty = no change
}

message UpdateCompanyResponse {
  Company company = 1;
}

message UpdateDepartmentRequest {
  string id = 1;
  string name = 2;          // empty = no change
  string settings_json = 3; // empty = no change
}

message UpdateDepartmentResponse {
  Department department = 1;
}

// UpdateUserProfileRequest: department_id is only applied when
// clear_department is true OR department_id is non-empty — this avoids the
// "" = no-change vs "" = clear ambiguity UserProfile's own semantics create
// (see this task's Context). settings_json empty = no change, same as
// every other Update*Request in this file.
message UpdateUserProfileRequest {
  string user_id = 1;
  string department_id = 2;  // ignored unless clear_department is also set
  bool clear_department = 3; // true = set department_id to empty ("company-only")
  string settings_json = 4;  // empty = no change
}

message UpdateUserProfileResponse {
  UserProfile profile = 1;
}

message ListTeamsRequest {
  // company_id intentionally omitted — same pattern AddTeamMemberRequest/
  // SetUserDepartmentRequest already use: the scoping company comes from
  // the validated request context (tenant.RequireTenantID), never a
  // client-supplied field, per tenant-service.md §9's "never inferred from
  // a nested resource ID" rule.
}

message ListTeamsResponse {
  repeated Team teams = 1;
}

message RemoveTeamMemberRequest {
  string team_id = 1;
  string user_id = 2;
}

message GetOnboardingStateRequest {
  string user_id = 1;
}

message GetOnboardingStateResponse {
  // state_json empty + found=false means "wizard never started" — the
  // caller's existing default, not an error.
  string state_json = 1;
  bool found = 2;
}

message SetOnboardingStateRequest {
  string user_id = 1;
  string state_json = 2;
}

// ── Client-local state messages (CR-STORAGE-001/003/004a,b) ────────────
enum ClientStateKind {
  CLIENT_STATE_KIND_UNSPECIFIED = 0;
  CLIENT_STATE_KIND_KEYBINDINGS = 1;
  CLIENT_STATE_KIND_UI_LOCAL = 2;
  CLIENT_STATE_KIND_SAVED_RUNTIME_ENVIRONMENTS = 3;
  CLIENT_STATE_KIND_SETTINGS = 4;
  CLIENT_STATE_KIND_ACCOUNTS_DEV_SERVER_MAP = 5;
}

message GetClientStateRequest {
  string user_id = 1;
  // kind selects exactly 1 of the 5 single-blob columns (not
  // workspace_session — see GetWorkspaceSession) — avoids 5 nearly
  // identical RPC pairs.
  ClientStateKind kind = 2;
}

message GetClientStateResponse {
  // state_json empty + found=false means "never saved" — same convention
  // as GetOnboardingStateResponse, not an error.
  string state_json = 1;
  bool found = 2;
}

message SetClientStateRequest {
  string user_id = 1;
  ClientStateKind kind = 2;
  string state_json = 3;
}

// ── Workspace session messages (CR-STORAGE-004a) — separate table, keyed
// additionally by host_id ───────────────────────────────────────────────
message GetWorkspaceSessionRequest {
  string user_id = 1;
  string host_id = 2; // empty = the default/local host
}

message GetWorkspaceSessionResponse {
  string session_json = 1;
  bool found = 2;
}

message SetWorkspaceSessionRequest {
  string user_id = 1;
  string host_id = 2;
  string session_json = 3;
}

message PatchWorkspaceSessionRequest {
  string user_id = 1;
  string host_id = 2;
  string patch_json = 3; // shallow-merged into the existing record, server-side
}

// ── Multi-tenant SSO follow-up (CR-LOGIN-001) ───────────────────────────
message AddCompanyEmailDomainRequest {
  string company_id = 1;
  string email_domain = 2; // bare domain, e.g. "vnpay.vn" — no "@", no scheme
}
message AddCompanyEmailDomainResponse {
  string email_domain = 1; // normalized (lowercased) form actually stored
}

message RemoveCompanyEmailDomainRequest {
  string email_domain = 1;
}

message ListCompanyEmailDomainsRequest {
  string company_id = 1;
}
message ListCompanyEmailDomainsResponse {
  repeated string email_domains = 1;
}

message ResolveCompanyByEmailDomainRequest {
  string email_domain = 1;
}
message ResolveCompanyByEmailDomainResponse {
  string company_id = 1;
  // found=false means no company has registered this domain — the caller
  // (auth-service) surfaces this as "SSO isn't set up for this
  // organization yet", never guesses a fallback tenant.
  bool found = 2;
}

// ── starNag.* messages (BUG-005/SOL-005) ────────────────────────────────
message DismissStarNagRequest {
  string user_id = 1;
}

message DeferStarNagRequest {
  string user_id = 1;
}

message CompleteStarNagRequest {
  string user_id = 1;
}

message DisableStarNagRequest {
  string user_id = 1;
}

message ForceShowStarNagRequest {
  string user_id = 1;
}

message NotifyStarNagOnboardingCompletedRequest {
  string user_id = 1;
}

message OpenWebStarNagRequest {
  string user_id = 1;
}

message StarOrcaFromNagRequest {
  string user_id = 1;
}

message StarOrcaFromNagResponse {
  bool starred = 1;
}

message PrepareStarNagAgentValueMomentRequest {
  string user_id = 1;
  // app_version gates "one attempt per app version" — see
  // domain.StarNagState.AgentValueMomentAppVersion; without this field the
  // usecase's skip/ready gate is unimplementable (TASK-012's own
  // correction over its initial user_id-only sketch).
  string app_version = 2;
}

// StarNagAgentValueMomentPreparation mirrors the old TS backend's
// AgentValueMomentPreparation wire shape (agent-value-moment.ts).
message StarNagAgentValueMomentPreparation {
  string status = 1; // "ready" | "skipped"
  string mode = 2;   // "gh" | "web" — only meaningful when status == "ready"
}

message ShowPreparedStarNagAgentValueMomentRequest {
  string user_id = 1;
}
